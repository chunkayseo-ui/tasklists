// One technician's row in a "crew" list -- shared by the Supervisor board and
// the Overview tab so the two never drift apart on what "on site" or a
// job/on-site/travel summary actually shows.
function crewRow(r, isToday, opts){
  opts = opts || {};
  const cs = crewState(r), t = totals(r), span = t.onSite + t.travel;
  const bar = span ? `<div class="bar" role="img" aria-label="${t.onSite} minutes on site, ${t.travel} minutes travelling">
      <span class="s-on" style="width:${t.onSite/span*100}%"></span><span class="s-tr" style="width:${t.travel/span*100}%"></span></div>` : "";
  // Live "since" ticking only makes sense for today — a past day's unfinished stop
  // shouldn't grow a duration against the current clock.
  const chip = isToday
    ? `<span class="chip ${cs.k}"><span class="dot"></span>${esc(cs.label)}${cs.since?" · "+liveDur(cs.since):""}</span>`
    : `<span class="chip ${cs.k==="onsite"||cs.k==="travel"?"idle":cs.k}"><span class="dot"></span>${cs.k==="onsite"||cs.k==="travel"?"Not checked out":esc(cs.label)}</span>`;
  // Supervisor-only, e.g. for wiping test/practice rounds -- Overview stays
  // read-only so nobody deletes a live round by mistake while just watching
  // tonight's progress.
  const delBtn = opts.deletable
    ? `<button type="button" class="btn sm" data-delround="${esc(r.id)}" title="Delete this round" aria-label="Delete ${esc(r.person)}'s round" style="margin-left:auto;color:var(--urgent);border-color:var(--urgent);padding:4px 10px">Delete</button>`
    : "";
  return `<div class="crew-row"><div class="crew-top">
      <span class="crew-name">${esc(r.person)}</span>
      ${chip}
      <span class="crew-where mono">${t.tasksDone} jobs · ${dur(t.onSite)} on site · ${dur(t.travel)} travel</span>
      ${delBtn}
    </div>${bar}</div>`;
}

function mgrView(){
  const viewDate = state.viewDate || todayKey();
  const isToday = viewDate === todayKey();
  if(!isToday) loadHistory(viewDate);   // no-op once cached

  const dateNav = `<div class="card datebar">
    <button class="btn dnav" id="date-prev" aria-label="Previous day">◀</button>
    <div class="dmid">
      <div class="eyebrow">${isToday?"Today":""}</div>
      <div class="mono">${fmtDate(viewDate)}</div>
    </div>
    <button class="btn dnav" id="date-next" aria-label="Next day" ${isToday?"disabled":""}>▶</button>
    <input type="date" id="date-pick" value="${viewDate}" max="${todayKey()}" aria-label="Jump to date">
  </div>`;

  if(!isToday && state.db){
    const c = state.historyCache[viewDate];
    if(!c || c.loading){
      return `${dateNav}<div class="card empty"><div class="eyebrow" style="margin-bottom:8px">Loading ${esc(fmtDate(viewDate))}…</div></div>`;
    }
    if(c.error){
      return `${dateNav}<div class="card empty">Couldn't load that day. Check your connection and try again.<div style="margin-top:14px"><button class="btn sm" id="date-retry">Retry</button></div></div>`;
    }
  }

  const rounds = roundsForDate(viewDate);

  if(!rounds.length){
    return `${dateNav}<div class="card empty">
      <div class="eyebrow" style="margin-bottom:8px">${isToday ? "No rounds started today" : "No rounds recorded on "+esc(fmtDate(viewDate))}</div>
      ${isToday
        ? `Once a technician claims their first job, they appear here live — where they are,<br>which job they're on, and how long each one took.`
        : `Nobody logged a round that day, or it hasn't loaded yet.`}
    </div>${isToday ? rosterPanel() : ""}`;
  }

  const agg = rounds.reduce((a,r)=>{const t=totals(r);a.on+=t.onSite;a.tr+=t.travel;a.done+=t.done;a.tot+=t.total;a.tk+=t.tasksDone;return a;},{on:0,tr:0,done:0,tot:0,tk:0});
  const share = (agg.on+agg.tr) ? Math.round(agg.tr/(agg.on+agg.tr)*100) : 0;

  const crew = rounds.map(r => crewRow(r, isToday, {deletable:true})).join("");

  // Every job on the board today, across every stop of every round -- not just
  // ones someone has picked up. A pooled outlet (JE) puts the same job list
  // into every technician covering it, and claiming one mirrors it into the
  // others' copies (see syncTaskToOtherRounds), so the same logical job can
  // show up in more than one round's tasks array. Dedupe by outlet+kind+name
  // +pool so it's counted once here -- this also keeps "Time by job" below
  // from double-counting a shared outlet's durations.
  const items = [];
  const seenTask = new Set();
  rounds.forEach(r => r.stops.forEach(s => s.tasks.forEach(t => {
    const k = s.outlet+"|"+t.kind+"|"+t.name+"|"+(t.pool||"");
    if(seenTask.has(k)) return;
    seenTask.add(k);
    // A custom stop's `o` is a synthetic CUSTOM- id -- never fit for display --
    // so carry its friendly label alongside it (stopLabel(s) is a no-op for a
    // real outlet, just returning its code back).
    items.push({o:s.outlet, label:stopLabel(s), t:t});
  })));
  const outletOrder = new Map(OUTLETS.map((o,i)=>[o.code,i]));
  items.sort((a,b) => {
    const oi = (outletOrder.get(a.o) ?? 999) - (outletOrder.get(b.o) ?? 999);
    if(oi) return oi;
    const pa = a.t.pool||"", pb = b.t.pool||"";
    return pa === pb ? 0 : (pa < pb ? -1 : 1);   // group each pool together within its outlet
  });

  const rows = items.map(it => {
    const finished = !!it.t.doneAt, running = it.t.startedAt && !finished;
    const status = finished ? '<span class="tag st-done">Done</span>'
                 : running  ? '<span class="tag st-prog">In Progress</span>'
                            : '<span class="tag st-open">Open</span>';
    return `<tr>
      <td class="num">${it.t.startedAt ? clockOf(it.t.startedAt) : '<span class="muted">—</span>'}</td>
      <td><strong>${esc(it.label)}</strong>${it.t.pool ? `<br><span class="tag pool">${esc(it.t.pool)}</span>` : ""}</td>
      <td>${esc(it.t.name)}</td>
      <td>${it.t.kind==="required"?'<span class="tag req">Must do</span>':it.t.kind==="optional"?'<span class="tag opt">If time allows</span>':it.t.kind==="issue"?'<span class="tag urgent">Reported issue</span>':'<span class="tag add">Added</span>'}</td>
      <td>${status}</td>
      <td>${it.t.claimedBy ? esc(it.t.claimedBy) : addedByOf(it.t) ? `<span class="muted">added by ${esc(addedByOf(it.t))}</span>` : '<span class="muted">—</span>'}</td>
      <td class="num">${finished ? dur(mins(it.t.startedAt,it.t.doneAt)) : (running ? '<span style="color:var(--accent)">running</span>' : '<span class="muted">—</span>')}</td>
    </tr>`;
  }).join("");

  // time by job type — aggregated across all outlets, or grouped per outlet
  const doneItems = items.filter(i=>i.t.doneAt);
  function jobBars(list){
    const byName = {};
    list.forEach(i => { const k=i.t.name; byName[k]=byName[k]||{m:0,n:0}; byName[k].m+=mins(i.t.startedAt,i.t.doneAt); byName[k].n++; });
    const names = Object.keys(byName).sort((a,b)=>byName[b].m-byName[a].m);
    const maxM = names.length ? byName[names[0]].m : 1;
    return names.map(n => `<div class="brow">
      <span class="lbl">${esc(n)} <span class="muted">×${byName[n].n}</span></span>
      <span class="val">${dur(byName[n].m)} · avg ${dur(Math.round(byName[n].m/byName[n].n))}</span>
      <span class="track"><span class="fill" style="width:${Math.max(3,byName[n].m/maxM*100)}%"></span></span>
    </div>`).join("");
  }
  const names = [...new Set(doneItems.map(i=>i.t.name))];
  const bars = jobBars(doneItems);
  // Same figures, split per outlet — each outlet's bars are scaled to its own
  // longest job, so a quiet branch's bars aren't dwarfed by a busy one's.
  const byOutlet = {}, outletLabel = {};
  doneItems.forEach(i => { (byOutlet[i.o] = byOutlet[i.o] || []).push(i); outletLabel[i.o] = i.label; });
  // Real outlets first, in their usual order; any custom stop with a finished
  // job on it (a synthetic id, never in OUTLETS) still gets its own group
  // after them, under its friendly name -- otherwise its jobs would just
  // silently be missing from this breakdown.
  const outletCodeSet = new Set(OUTLETS.map(o=>o.code));
  const orderedCodes = OUTLETS.map(o=>o.code).filter(c => byOutlet[c] && byOutlet[c].length);
  const extraCodes = Object.keys(byOutlet).filter(c => !outletCodeSet.has(c) && byOutlet[c].length);
  const groupedBars = orderedCodes.concat(extraCodes)
    .map(code => `<div class="outlet-group">
      <div class="outlet-group-head">${esc(outletLabel[code] || code)}</div>
      <div class="bars">${jobBars(byOutlet[code])}</div>
    </div>`).join("");

  return `
  ${dateNav}
  <div class="kpis">
    <div class="kpi"><div class="v">${agg.tk}</div><div class="k eyebrow">Jobs done</div></div>
    <div class="kpi"><div class="v">${agg.done}<span style="font-size:16.5px;color:var(--ink-3)">/${agg.tot}</span></div><div class="k eyebrow">Outlets done</div></div>
    <div class="kpi"><div class="v" style="color:var(--accent)">${dur(agg.on)}</div><div class="k eyebrow">On site</div></div>
    <div class="kpi"><div class="v" style="color:var(--travel)">${share}%</div><div class="k eyebrow">Time on the road</div></div>
  </div>

  <div class="stack" style="gap:9px">
    <div class="sec-head"><h2 class="sec">${isToday?"Crew right now":"Technicians that day"}</h2>
      ${isToday ? `<span class="legend"><span><i style="background:var(--accent)"></i>on site</span><span><i style="background:var(--travel);opacity:.55"></i>travelling</span></span>` : ""}</div>
    <div class="crew">${crew}</div>
  </div>

  ${names.length ? `<div class="stack" style="gap:9px">
    <div class="sec-head"><h2 class="sec">Time by job</h2>
      <div class="seg" role="group" aria-label="Group by">
        <button data-tbgroup="job" aria-pressed="${state.timeByGroup!=="outlet"}">By job</button>
        <button data-tbgroup="outlet" aria-pressed="${state.timeByGroup==="outlet"}">By outlet</button>
      </div>
    </div>
    <div class="card" style="padding:14px">${state.timeByGroup==="outlet" ? groupedBars : `<div class="bars">${bars}</div>`}</div>
    <p class="note">After a few rounds this tells you what each job really costs — the number to plan against.</p>
  </div>` : ""}

  <div class="stack" style="gap:9px">
    <h2 class="sec">${isToday?"Jobs today":"Jobs on "+esc(fmtDate(viewDate))}</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Start</th><th>Outlet</th><th>Job</th><th>Type</th><th>Status</th><th>Technician</th><th>Took</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>
  ${isToday ? rosterPanel() : `<p class="note">Team members are edited from <strong>Today</strong> — switch back to change them.</p>`}`;
}

/* ---------- routes: which outlets each technician actually visited, in order ----------
 * The artifact sandbox can't embed live map tiles, so "the route" is shown two ways:
 * a schematic diagram drawn from each outlet's real coordinates (straight lines, not
 * roads — good for "who went where, in what order"), plus a "Open in Google Maps" link
 * that hands the real driving directions off to Maps itself.
 */
// Singapore spans well under a quarter of a degree here, so plain linear lat/lng
// scaling (no map projection math) places the outlets accurately enough for a
// schematic — a real projection would be invisible at this scale.
// extraPts (optional) are folded into the bounding box alongside the ten
// fixed branches -- e.g. a custom stop's geocoded coordinate might sit just
// outside the branches' own footprint, and without this it would still get
// projected (using the branches-only box) and just land off toward an edge.
function geoProjector(viewW, viewH, margin, extraPts){
  margin = margin || 34;
  const innerW = viewW - margin*2, innerH = viewH - margin*2;
  const lats = OUTLETS.map(o=>o.lat).concat((extraPts||[]).map(p=>p.lat));
  const lngs = OUTLETS.map(o=>o.lng).concat((extraPts||[]).map(p=>p.lng));
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const spanLat = (maxLat-minLat) || 1, spanLng = (maxLng-minLng) || 1;
  return (lat,lng) => ({
    x: margin + (lng-minLng)/spanLng*innerW,
    y: margin + innerH - (lat-minLat)/spanLat*innerH   // latitude increases northward -> smaller y
  });
}
// CC and HB, for instance, sit ~150m apart on the same road — real neighbours that
// a whole-island schematic has no room to tell apart. Rather than let their dots and
// labels print on top of each other, spread any points closer than minDist apart
// along the line between them (or, if truly coincident, in different directions).
function declutterPoints(pts, minDist){
  const out = pts.map(p => ({x:p.x, y:p.y}));
  for(let i=1;i<out.length;i++){
    for(let j=0;j<i;j++){
      const dx = out[i].x-out[j].x, dy = out[i].y-out[j].y;
      const d = Math.hypot(dx,dy);
      if(d < minDist){
        const ang = d > 0.5 ? Math.atan2(dy,dx) : (Math.PI*2/5)*i;
        out[i].x = out[j].x + Math.cos(ang)*minDist;
        out[i].y = out[j].y + Math.sin(ang)*minDist;
      }
    }
  }
  return out;
}
function routeCard(r, proj, byCode){
  // r.stops is stored in the master outlet-list order (which outlets were picked
  // for the day, not the order they were actually visited) — a technician can tap
  // Arrive on any of their selected outlets in any order. So the route sequence
  // has to be sorted by actual arrival time, not by position in r.stops.
  const visited = r.stops.filter(s => s.arriveAt && byCode[s.outlet])
    .sort((a,b) => a.arriveAt < b.arriveAt ? -1 : 1);
  const seq = visited.map((s,i) => Object.assign({idx:i+1, arriveAt:s.arriveAt, departAt:s.departAt, tasks:s.tasks, covering:s.covering, coveringNote:s.coveringNote}, byCode[s.outlet]));
  const visitedCodes = new Set(seq.map(o=>o.code));
  // The textual stop list below is built from the FULL seq, always -- a stop
  // with no coordinates yet (a custom stop still waiting on/failed geocoding)
  // simply can't be drawn on the map, same as it's always been for anything
  // lacking lat/lng, but it must never disappear from the list itself. Map
  // drawing below works off this plottable subset instead of seq directly.
  const plottableSeq = seq.filter(o => o.lat!=null && o.lng!=null);
  const pts = declutterPoints(plottableSeq.map(o => proj(o.lat, o.lng)), 24);
  // Only the most recent stop can still be "on site" — arriving anywhere else
  // requires leaving wherever came before, so every earlier stop in the sequence
  // is necessarily already departed.
  const lastIdx = seq.length - 1;
  const onSiteNow = lastIdx >= 0 && !seq[lastIdx].departAt;

  // Outlets still on tonight's list but not yet visited — known in advance from
  // r.stops (every outlet the technician picked at round-start is in there,
  // whether visited yet or not), so this doesn't have to be guessed. Drawn
  // distinctly from outlets that were never part of this round, so a supervisor
  // can see whether the technician is genuinely done or still has stops coming.
  const plannedRemaining = r.stops.filter(s => !s.arriveAt && byCode[s.outlet]).map(s => byCode[s.outlet]);
  const plannedCodes = new Set(plannedRemaining.map(o=>o.code));
  const roundComplete = seq.length > 0 && !onSiteNow && plannedRemaining.length === 0;
  const completedCount = onSiteNow ? seq.length - 1 : seq.length;
  // A technician can flag which pool they're headed to next once they've left
  // a stop — if they have, and it's still genuinely unvisited, the map can
  // show that leg before it happens instead of only ever showing history.
  const headingCode = (r.headingTo && plannedCodes.has(r.headingTo)) ? r.headingTo : null;

  const W = 340, H = 230;
  const refOutlets = OUTLETS.filter(o => !visitedCodes.has(o.code) && !plannedCodes.has(o.code));
  const refPts = declutterPoints(refOutlets.map(o => proj(o.lat, o.lng)), 20);
  const refDots = refOutlets.map((o,i) => {
    const p = refPts[i];
    const nearest = Math.min(...refPts.filter((_,k)=>k!==i).map(q => Math.hypot(q.x-p.x, q.y-p.y)).concat([999]));
    const t = nearest < 26
      ? `<text x="${(p.x+6).toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="start" font-size="10" fill="currentColor" opacity=".4">${esc(o.code)}</text>`
      : `<text x="${p.x.toFixed(1)}" y="${(p.y-7).toFixed(1)}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".4">${esc(o.code)}</text>`;
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="currentColor" opacity=".25"/>${t}`;
  }).join("");
  // Planned-but-not-yet-visited stops get a dashed accent ring instead of the
  // faint reference dot — visible enough to read as "still coming tonight"
  // without competing with the actual visited-route markers. The one the
  // technician has actually said they're heading to gets a solid, filled
  // marker instead, so it reads as "next" rather than just "eventually."
  const plottableRemaining = plannedRemaining.filter(o => o.lat!=null && o.lng!=null);
  const pendingPts = declutterPoints(plottableRemaining.map(o => proj(o.lat, o.lng)), 20);
  const pendingDots = plottableRemaining.map((o,i) => {
    const p = pendingPts[i];
    const isHeading = o.code === headingCode;
    const nearest = Math.min(...pendingPts.filter((_,k)=>k!==i).map(q => Math.hypot(q.x-p.x, q.y-p.y)).concat([999]));
    const suffix = isHeading ? " · heading here" : "";
    const t = nearest < 26
      ? `<text x="${(p.x+7).toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="start" font-size="10" font-weight="600" fill="var(--accent)" opacity="${isHeading?"1":".75"}">${esc(o.label)}${suffix}</text>`
      : `<text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)" opacity="${isHeading?"1":".75"}">${esc(o.label)}${suffix}</text>`;
    const dot = isHeading
      ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`
      : `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2.5 2" opacity=".8"/>`;
    return `${dot}${t}`;
  }).join("");
  let path = "";
  for(let i=0;i<pts.length-1;i++){
    path += `<line x1="${pts[i].x.toFixed(1)}" y1="${pts[i].y.toFixed(1)}" x2="${pts[i+1].x.toFixed(1)}" y2="${pts[i+1].y.toFixed(1)}" stroke="var(--accent)" stroke-width="2" marker-end="url(#routearrow)"/>`;
  }
  // The anticipated next leg — drawn dashed, since (unlike everything else on
  // this map) it hasn't happened yet, only been declared.
  let headingLine = "";
  if(headingCode && lastIdx >= 0){
    // Computed directly from the last-visited stop's own coordinates (rather
    // than indexing into pts) since pts now only covers plottable stops --
    // if the technician's current last stop has no coordinates of its own,
    // there's simply nothing to draw this line from.
    const lastStop = seq[lastIdx];
    if(lastStop.lat!=null && lastStop.lng!=null){
      const from = proj(lastStop.lat, lastStop.lng);
      const to = pendingPts[plottableRemaining.findIndex(o=>o.code===headingCode)];
      if(to) headingLine = `<line x1="${from.x.toFixed(1)}" y1="${from.y.toFixed(1)}" x2="${to.x.toFixed(1)}" y2="${to.y.toFixed(1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" opacity=".6" marker-end="url(#routearrow)"/>`;
    }
  }
  // A label placed straight above the circle, as usual, collides when decluttering
  // has stacked two stops (e.g. two outlets on the same street) close together —
  // for any marker with a near neighbor, put its code label out to the side instead.
  // Completed stops (departed) and the one the technician is still standing at
  // right now get different marker colors — green for done, amber for "here now"
  // — the same done/in-progress language used everywhere else in the app, so a
  // supervisor can read status straight off the map without opening the stop list.
  const markers = plottableSeq.map((o,i) => {
    const p = pts[i];
    // plottableSeq is filtered from seq but keeps the same object references,
    // so "is this the technician's current/last stop" is checked by identity
    // rather than by array position (pts/plottableSeq no longer line up 1:1
    // with seq's own indices once an unplotted stop is in the mix).
    const isHere = o === seq[lastIdx] && onSiteNow;
    const isFinal = o === seq[lastIdx] && roundComplete;
    const fill = isHere ? "var(--warn)" : "var(--ok)";
    const nearest = Math.min(...pts.filter((_,k)=>k!==i).map(q => Math.hypot(q.x-p.x, q.y-p.y)).concat([999]));
    const sideLabel = nearest < 28;
    const labelAttrs = sideLabel
      ? `x="${(p.x+13).toFixed(1)}" y="${(p.y+3.5).toFixed(1)}" text-anchor="start"`
      : `x="${p.x.toFixed(1)}" y="${(p.y-13).toFixed(1)}" text-anchor="middle"`;
    // "here now" pulses because it's live and changing; "last stop" is a static
    // ring — the round is over, nothing there is still moving.
    const ring = isHere
      ? `<circle class="route-pulse" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13" fill="none" stroke="var(--warn)" stroke-width="2"/>`
      : isFinal
      ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13" fill="none" stroke="var(--ok)" stroke-width="2" opacity=".55"/>`
      : "";
    const suffix = isHere ? " · here now" : isFinal ? " · last stop" : "";
    return `${ring}<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="${fill}" stroke="var(--surface)" stroke-width="1.5"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${o.idx}</text>
      <text ${labelAttrs} font-size="11" font-weight="600" fill="currentColor">${esc(o.label)}${suffix}</text>`;
  }).join("");
  const headingLabel = headingCode ? (plannedRemaining.find(o=>o.code===headingCode)||{}).label : null;
  const ariaLabel = seq.length
    ? `Route for ${r.person}: `+seq.map(o=>o.label).join(" then ")+(
        roundComplete ? " — round complete." :
        headingLabel ? " — heading to "+headingLabel+" next." :
        plannedRemaining.length ? " — still has "+plannedRemaining.map(o=>o.label).join(", ")+" to visit tonight." : "."
      )
    : `${r.person} has not checked in anywhere yet tonight.`;

  // Legend only lists what's actually drawn, so it never claims a category
  // that has nothing on the map to back it up.
  const legendItems = [];
  if(completedCount > 0) legendItems.push(`<span><i style="background:var(--ok)"></i>completed</span>`);
  if(onSiteNow) legendItems.push(`<span><i style="background:var(--warn)"></i>here now</span>`);
  else if(roundComplete) legendItems.push(`<span><i style="border:1.5px solid var(--ok)"></i>last stop</span>`);
  if(headingCode) legendItems.push(`<span><i style="background:var(--accent)"></i>heading here</span>`);
  if(plannedRemaining.some(o=>o.code!==headingCode)) legendItems.push(`<span><i style="border:1.5px dashed var(--accent)"></i>still to visit</span>`);
  const legend = legendItems.length ? `<span class="legend" style="margin-top:4px">${legendItems.join("")}</span>` : "";

  const svg = `<figure class="routemap">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaLabel)}">
      <defs>
        <marker id="routearrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
        </marker>
      </defs>
      <rect x="0.5" y="0.5" width="${W-1}" height="${H-1}" rx="10" fill="var(--surface-2)" stroke="var(--line-soft)"/>
      ${refDots}
      ${pendingDots}
      ${path}
      ${headingLine}
      ${markers}
    </svg>
    <figcaption class="note">Straight-line order of outlets visited — not the road route.
      ${legend}
    </figcaption>
  </figure>`;

  // Per-stop job status, so a supervisor can see straight from the route whether
  // every must-do job actually got claimed at each pool — not just where the
  // technician physically went — without switching to the Supervisor tab.
  const stopList = seq.map((o,i) => {
    const arr = clockOf(o.arriveAt);
    const dep = o.departAt ? clockOf(o.departAt) : null;
    const stillHere = i === lastIdx && onSiteNow;
    // The leg between this stop and the one before it -- how long the drive
    // (plus whatever else) actually took, straight from departure-to-arrival
    // timestamps, same math already used on the technician's own view. Every
    // earlier stop in the sequence is guaranteed departed by this point (see
    // the comment on onSiteNow/lastIdx above), so seq[i-1].departAt always
    // exists here.
    const gap = (() => {
      if(i === 0) return "";
      const gapMin = mins(seq[i-1].departAt, o.arriveAt);
      // A technician physically can't arrive here without first tapping Leave
      // at the previous stop -- so a gap this short almost always means Leave
      // was tapped late (once they'd already reached this outlet), not that
      // the drive was really near-instant. Flagged so it can be checked with
      // the technician rather than trusted at face value.
      const short = gapMin < SHORT_TRAVEL_MIN
        ? ` <span class="tag req" title="Leave was likely tapped late at the previous stop, not right when they actually left">⚠ check timing</span>`
        : "";
      return `<div class="travel-gap"><span>▼ travel ${dur(gapMin)}</span>${short}<span class="ln"></span></div>`;
    })();
    // An unplanned custom stop has no preset checklist and no issues -- just
    // the place, when they were there, and the remark they gave for going --
    // but it can carry ad-hoc jobs a technician logged on-site (see
    // addTask/stopCard), same as a real outlet, so those still need to show
    // up here rather than silently not reaching the Routes tab.
    if(o.custom){
      const customDoneN = o.tasks.length ? o.tasks.filter(t=>t.doneAt).length : 0;
      const customStopKey = r.id+"__"+o.code;
      const customExpanded = !!state.expandedStops[customStopKey];
      const customJobsToggle = o.tasks.length
        ? `<button type="button" class="link mono jobs-toggle" data-toggletasks="${esc(customStopKey)}" style="margin-left:auto" aria-expanded="${customExpanded}">${customDoneN}/${o.tasks.length} jobs ${customExpanded?"▲":"▼"}</button>`
        : "";
      const customTaskBreakdown = (o.tasks.length && customExpanded) ? `<div style="flex-basis:100%;margin-top:2px">${stopJobList(o)}</div>` : "";
      return `${gap}<div class="route-stop">
        <span class="route-idx">${o.idx}</span>
        <span class="route-name"><strong>${esc(o.label)}</strong></span>
        <span class="tag add">Stop</span>
        <span class="mono muted">${arr}${dep?" – "+dep:" – on site"}</span>
        ${customJobsToggle}
        ${stillHere?'<span class="tag st-prog">On site</span>':""}
        ${o.remark ? `<span class="mono muted" style="flex-basis:100%;font-style:italic">“${esc(o.remark)}”</span>` : ""}
        ${customTaskBreakdown}
      </div>`;
    }
    const left = requiredLeft(o);
    const doneN = o.tasks.filter(t=>t.doneAt).length;
    const status = stillHere
      ? `<span class="tag st-prog">On site</span>`
      : left
      ? `<span class="tag req">${left} must-do left open</span>`
      : `<span class="tag st-done">All done</span>`;
    // Any issue raised at this outlet (still open or already planned, but not
    // yet resolved) shows right here too -- a supervisor scanning routes
    // shouldn't have to separately check Overview to see that a stop they're
    // looking at has a heater replacement pending.
    const issueN = openIssuesFor(o.code).length;
    const issueTag = issueN ? `<span class="tag urgent">${issueN} issue${issueN>1?"s":""}</span>` : "";
    // A covering stop's note wraps to its own full-width line (flex-wrap on
    // .route-stop already handles this) rather than squeezing into the row.
    const noteLine = (o.covering && o.coveringNote)
      ? `<span class="mono muted" style="flex-basis:100%;font-style:italic">“${esc(o.coveringNote)}”</span>` : "";
    // The X/Y jobs count is clickable -- expands to the actual list of what's
    // done and what isn't at this stop, right on the Routes tab, instead of a
    // supervisor having to switch to Supervisor/Overview to see which job is
    // still open. Keyed by round + outlet so each stop's expand state is
    // independent (and independent per technician too).
    const stopKey = r.id+"__"+o.code;
    const expanded = !!state.expandedStops[stopKey];
    const jobsToggle = `<button type="button" class="link mono jobs-toggle" data-toggletasks="${esc(stopKey)}" style="margin-left:auto" aria-expanded="${expanded}">${doneN}/${o.tasks.length} jobs ${expanded?"▲":"▼"}</button>`;
    const taskBreakdown = expanded ? `<div style="flex-basis:100%;margin-top:2px">${stopJobList(o)}</div>` : "";
    return `${gap}<div class="route-stop">
      <span class="route-idx">${o.idx}</span>
      <span class="route-name"><strong>${esc(o.label)}</strong></span>
      ${o.covering?'<span class="tag covering">Covering</span>':""}
      <span class="mono muted">${arr}${dep?" – "+dep:" – on site"}</span>
      ${jobsToggle}
      ${status}${issueTag}
      ${noteLine}
      ${taskBreakdown}
    </div>`;
  }).join("");

  let mapsLink = "";
  if(seq.length >= 2){
    const enc = s => encodeURIComponent(s);
    const origin = enc(seq[0].addr), destination = enc(seq[seq.length-1].addr);
    const waypoints = seq.slice(1,-1).map(o=>enc(o.addr)).join("|");
    const url = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+origin+"&destination="+destination+(waypoints?"&waypoints="+waypoints:"");
    mapsLink = `<a class="btn sm" href="${url}" target="_blank" rel="noopener">Open in Google Maps</a>`;
  } else if(seq.length === 1){
    const url = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(seq[0].addr);
    mapsLink = `<a class="btn sm" href="${url}" target="_blank" rel="noopener">Open in Google Maps</a>`;
  }

  const cs = crewState(r);
  // Total jobs done, time on site, and time travelling for the whole night
  // so far -- the same numbers already shown per technician on Overview's
  // "Technicians right now", now also visible right here on their route.
  const t = totals(r), span = t.onSite + t.travel;
  const summaryBar = span ? `<div class="bar" role="img" aria-label="${t.onSite} minutes on site, ${t.travel} minutes travelling">
      <span class="s-on" style="width:${t.onSite/span*100}%"></span><span class="s-tr" style="width:${t.travel/span*100}%"></span></div>` : "";
  const summary = seq.length ? `<div class="route-summary">
      <span class="mono muted">${t.tasksDone} jobs · ${dur(t.onSite)} on site · ${dur(t.travel)} travel</span>
      ${summaryBar}
    </div>` : "";
  return `<div class="card route-card">
    <div class="route-head">
      <span class="crew-name">${esc(r.person)}</span>
      <span class="chip ${cs.k}"><span class="dot"></span>${esc(cs.label)}</span>
    </div>
    ${summary}
    ${seq.length ? `<div class="route-body">${svg}<div class="route-list">${stopList}</div></div>
    <div class="route-foot">${mapsLink}</div>` : `<p class="note" style="padding:0 14px 14px">Not checked in anywhere yet tonight.</p>`}
  </div>`;
}
function routesView(){
  const viewDate = state.viewDate || todayKey();
  const isToday = viewDate === todayKey();
  if(!isToday) loadHistory(viewDate);

  const dateNav = `<div class="card datebar">
    <button class="btn dnav" id="date-prev" aria-label="Previous day">◀</button>
    <div class="dmid">
      <div class="eyebrow">${isToday?"Today":""}</div>
      <div class="mono">${fmtDate(viewDate)}</div>
    </div>
    <button class="btn dnav" id="date-next" aria-label="Next day" ${isToday?"disabled":""}>▶</button>
    <input type="date" id="date-pick" value="${viewDate}" max="${todayKey()}" aria-label="Jump to date">
  </div>`;

  if(!isToday && state.db){
    const c = state.historyCache[viewDate];
    if(!c || c.loading){
      return `${dateNav}<div class="card empty"><div class="eyebrow" style="margin-bottom:8px">Loading ${esc(fmtDate(viewDate))}…</div></div>`;
    }
    if(c.error){
      return `${dateNav}<div class="card empty">Couldn't load that day. Check your connection and try again.<div style="margin-top:14px"><button class="btn sm" id="date-retry">Retry</button></div></div>`;
    }
  }

  const rounds = roundsForDate(viewDate);
  const withStops = rounds.filter(r => r.stops.some(s => s.arriveAt));

  if(!withStops.length){
    return `${dateNav}<div class="card empty">
      <div class="eyebrow" style="margin-bottom:8px">${isToday ? "No routes yet today" : "No routes recorded on "+esc(fmtDate(viewDate))}</div>
      Once a technician checks in at their first outlet, their route for the night builds here — where they went, in what order, with a link to open real driving directions in Google Maps.
    </div>`;
  }

  // Real branches key byCode by their own fixed code, label==code, addr from
  // the master OUTLETS list. A custom (unplanned) stop is ALWAYS registered
  // too, whether or not it's been geocoded yet -- a stop missing from byCode
  // is invisible to routeCard entirely (not just off the map, off the whole
  // per-stop list), and a technician's logged visit and any job they added
  // there shouldn't disappear from a supervisor's view just because OneMap
  // couldn't place the address. Only the MAP drawing inside routeCard skips
  // a stop with no lat/lng -- the textual stop list still shows it.
  const byCode = {};
  OUTLETS.forEach(o => byCode[o.code] = Object.assign({label:o.code}, o));
  const customPts = [];
  withStops.forEach(r => r.stops.forEach(s => {
    if(s.custom){
      byCode[s.outlet] = {code:s.outlet, label:s.customName||"Stop", lat:s.lat, lng:s.lng,
        addr:s.customAddress||"", custom:true, remark:s.customRemark||""};
      if(s.lat!=null && s.lng!=null) customPts.push({lat:s.lat, lng:s.lng});
    }
  }));
  const proj = geoProjector(340, 230, 34, customPts);
  const cards = withStops.map(r => routeCard(r, proj, byCode)).join("");

  return `${dateNav}
  <div class="stack" style="gap:14px">
    <div class="sec-head"><h2 class="sec">${isToday?"Tonight's routes":"Routes on "+esc(fmtDate(viewDate))}</h2></div>
    <div class="stack" style="gap:14px">${cards}</div>
  </div>`;
}

function taskSettingView(){

  // tonight the first time this tab is opened, but a supervisor can flip
  // through other days to set up a week's worth of differences in one sitting.
  const day = state.taskSettingDay != null ? state.taskSettingDay : operationalNow().getDay();
  const today = operationalNow().getDay();
  const req = state.cfg.required.map((n,i)=>`<div class="row-2"><input type="text" value="${esc(n)}" data-creq="${i}"><button class="btn sm" data-dreq="${i}">Remove</button></div>`).join("");
  const opt = state.cfg.optional.map((n,i)=>`<div class="row-2"><input type="text" value="${esc(n)}" data-copt="${i}"><button class="btn sm" data-dopt="${i}">Remove</button></div>`).join("");
  const daySeg = `<div class="seg" role="group" aria-label="Day" style="flex-wrap:wrap">${
    DAYNAME.map((dn,i)=>`<button data-tsday="${i}" aria-pressed="${day===i}">${dn}${i===today?" •":""}</button>`).join("")
  }</div>`;

    // A job added just for this outlet can be tagged to one of its physical pools
    // (e.g. "replace ladder pad" only applies to JEIP2) or left untagged for
    // something that isn't any one pool's job, like restocking the chemical shed.
    // A recurring one can also be scoped to specific nights (e.g. only Fridays);
    // a one-time job is already locked to the single day it was added, so no
    // day-of-week scope is shown for it.
    const extras = (state.cfg.extra[o.code] || []).map(e => {
      const daysTag = (e.days && e.days.length) ? `<span class="tag rec">${e.days.map(d=>DAYNAME[d]).join(", ")}</span>` : '<span class="tag rec">Every night</span>';
      return `<div class="extra-item">
        <span class="extra-name">${esc(e.name)}</span>
        ${e.pool ? `<span class="tag pool">${esc(e.pool)}</span>` : ""}

        ${e.oneTime ? '<span class="tag once">One-time</span>' : daysTag}

      </select>` : "";
    const dayChecks = DAYNAME.map((dn,i)=>`<label class="chk"><input type="checkbox" id="extra-day-${o.code}-${i}"> ${dn}</label>`).join("");
    return `<div class="assign-block">
      <div class="assign-row"><span class="oc">${esc(o.code)}</span>${togs || '<span class="note">No shared job to toggle</span>'}</div>
      ${o.pools ? `<p class="note" style="margin:6px 0 0">${esc(o.code)} has ${o.pools.length} pools (${o.pools.join(", ")}) — the must-do list and any shared job you toggle on above apply to all of them automatically. For a job below, pick one pool it's specific to, or leave it "Whole outlet" for something like restocking chemicals.</p>` : ""}
      ${extras ? `<div class="extra-list">${extras}</div>` : ""}
      <div class="extra-add">
        <input type="text" id="extra-new-${o.code}" placeholder="Add a job just for ${esc(o.code)}">
        ${poolPick}
        <label class="chk"><input type="checkbox" id="extra-req-${o.code}"> Must do</label>
        <label class="chk"><input type="checkbox" id="extra-once-${o.code}" checked> One-time (won't carry to the next visit)</label>
        <div class="extra-days"><span class="note">Recurring only, which nights:</span>${dayChecks}<span class="note">(none ticked = every night)</span></div>
        <button class="btn sm" data-addextra="${o.code}">Add</button>

    </div>`;
  }).join("");
  return `
  <div class="stack" style="gap:9px">
    <h2 class="sec">Must do — every outlet, every night</h2>
    <p class="note" style="margin:0 0 8px">Blocks leaving the outlet with a warning until it's done. Keep this list short — for something that's only needed some nights, use "Jobs per branch" below instead.</p>
    <div class="stack" style="gap:8px">${req}
      <div class="row-2"><input type="text" id="req-new" placeholder="Add a must-do job"><button class="btn primary sm" id="req-add">Add</button></div>
    </div>
  </div>

  <div class="stack" style="gap:9px">
    <h2 class="sec">If time allows — never blocks leaving</h2>
    <p class="note" style="margin:0 0 8px">Common jobs like Manual vacuum pool. Which of these apply at which outlet, and on which nights, is set below in "Jobs per branch"; the technician can always leave without doing them.</p>
    <div class="stack" style="gap:8px">${opt}
      <div class="row-2"><input type="text" id="opt-new" placeholder="Add a job to do if time allows"><button class="btn primary sm" id="opt-add">Add</button></div>
    </div>
  </div>

  <div class="stack" style="gap:9px">
    <h2 class="sec">Jobs per branch</h2>
    <p class="note" style="margin:0 0 8px">Some branches only need certain jobs on certain nights. Pick a day below, then turn on whichever shared jobs apply at each outlet <strong>on that day</strong> — the toggles you see are just for the selected day, not every day. Add something specific to just one outlet further down; tick "Must do" only if it should block leaving until it's done.</p>
    ${daySeg}
    <p class="note" style="margin:6px 0 0">Editing <strong>${DAYNAME[day]}</strong>${day===today?" (tonight)":""}. <span class="mono muted">•</span> marks tonight.</p>
    ${assign}
  </div>

  <div class="stack" style="gap:9px">
    <h2 class="sec">Photo proof — scale photo on Manual Dosing</h2>
    <p class="note" style="margin:0 0 8px">When a relay address is set here, the Manual Dosing job requires a photo of the scale (camera only, no gallery) before it can be saved. The photo is stamped with outlet, pool, technician and time, stored in Drive by the Apps Script relay, and for a digital scale the number on the display is read and pre-filled. Leave the address empty to switch this off.</p>
    <div class="stack" style="gap:8px">
      <input type="text" id="photo-relay-url" placeholder="Apps Script web app URL (https://script.google.com/macros/s/…/exec)" value="${esc((state.cfg.photo||{}).relayUrl||"")}" autocomplete="off">
      <div class="row-2"><input type="text" id="photo-relay-key" placeholder="Shared key (same as RELAY_KEY in the script)" value="${esc((state.cfg.photo||{}).key||"")}" autocomplete="off"><button class="btn primary sm" id="photo-relay-save">Save</button></div>
      <p class="note" style="margin:0">${relayCfg() ? "Photo proof is <strong>on</strong>." : "Photo proof is <strong>off</strong> — Manual Dosing takes a typed amount only."}</p>
    </div>
  </div>

  <div class="stack" style="gap:9px">
    <p class="note" style="margin:10px 0 0">A change to ${day===today?"tonight's":"another day's"} assignment reaches an outlet's round straight away only if it's still open ${day===today?"tonight":"the next time "+DAYNAME[day]+" comes around"}. <strong>One-time</strong> jobs drop off on their own after the day they were added, so a last-minute fix never needs to be removed by hand. A job the technician has already claimed is never pulled out from under them by any of these changes.</p>
  </div>`;
}
function rosterPanel(){
  const list = state.roster.map((n,i)=>`<div class="row-2"><input type="text" value="${esc(n)}" data-rname="${i}"><button class="btn sm" data-rdel="${i}">Remove</button></div>`).join("");
  return `<details class="panel" data-panel="roster" ${state.panelsOpen.roster?"open":""}><summary>Team members (${state.roster.length})</summary>
    <div class="panel-body">${list||'<p class="note" style="margin:0">No one added yet.</p>'}
      <div class="row-2"><input type="text" id="r-new" placeholder="Add a technician's name"><button class="btn primary sm" id="r-add">Add</button></div>
    </div></details>`;

// Supervisor-initiated delete of a whole round -- e.g. wiping out a
// technician's testing/practice data. Unlike #reset-round (today's own
// round only), this can target ANY person on ANY date, since the
// Supervisor tab's date-nav can be looking at yesterday or further back.
// A round can live in one of two places depending on which date is being
// viewed: today's live rounds are in state.rounds, keyed by round id; a
// past date's rounds are a separate cache in state.historyCache[date].rounds
// (see loadHistory), fetched once and reused rather than re-queried every
// render. We don't know in advance which one holds the round being deleted,
// so this checks state.rounds first, then searches every cached date --
// and on deletion, clears the round out of *both* possible places so the
// screen updates immediately without needing a reload.
function deleteRoundById(id){
  let r = state.rounds[id];
  if(!r){
    for(const c of Object.values(state.historyCache)){
      if(c && c.rounds){ const found = c.rounds.find(x=>x.id===id); if(found){ r = found; break; } }
    }
  }
  if(!r) return;
  if(!confirm(`Delete ${r.person}'s round for ${fmtDate(r.date)}? This can't be undone.`)) return;
  delete state.rounds[id];
  Object.values(state.historyCache).forEach(c => { if(c && c.rounds) c.rounds = c.rounds.filter(x=>x.id!==id); });
  if(state.db) state.db.doc("dosing_rounds/"+id).delete().catch(()=>{});
  else { const all = local.read(); delete all[id]; local.write(all); }
  render();
}

/* ================= events ================= */
function wire(){
  const on = (sel, fn, ev) => { const e = $(sel); if(e) e.addEventListener(ev||"click", fn); };
  const each = (sel, fn, ev) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev||"click", () => fn(el)));

  // The water-test panel's reference sections (today's readings, history,
  // route) only render their body once opened, so a real open/close needs a
  // redraw. Guarded on an actual state change: a freshly rendered <details
  // open> can fire toggle on insertion, and re-rendering on that would loop.
  // Registered before the generic remember-open listener below so the
  // comparison sees the previous value.
  document.querySelectorAll(".wt details.panel[data-panel]").forEach(d =>
    d.addEventListener("toggle", () => {
      if(!!state.panelsOpen[d.dataset.panel] === d.open) return;
      state.panelsOpen[d.dataset.panel] = d.open; render();
    }));
  // Remember open/closed per panel across redraws — the view is rebuilt on every
  // save and every incoming update, which would otherwise slam an open panel shut.
  document.querySelectorAll("details.panel[data-panel]").forEach(d =>
    d.addEventListener("toggle", () => { state.panelsOpen[d.dataset.panel] = d.open; }));
  const two = v => v.split("|");

  on("#who-go", () => { const v=$("#who").value; if(!v) return; state.me=v; localStorage.setItem("drt.me",v); render(); });
  on("#switch-user", () => { state.me=""; localStorage.removeItem("drt.me"); render(); });
  on("#reset-round", () => {
    const id = myId(); if(!id) return;
    delete state.rounds[id];
    if(state.db) state.db.doc("dosing_rounds/"+id).delete().catch(()=>{});
    else { const all = local.read(); delete all[id]; local.write(all); }
    state.picking = null; render();
  });
  each("[data-delround]", b => deleteRoundById(b.dataset.delround));

  each("[data-pick]", b => {
    const cur = state.picking || [], c = b.dataset.pick;
    state.picking = cur.includes(c) ? cur.filter(x=>x!==c) : cur.concat([c]); render();
  });
  on("#pick-all",  () => { state.picking = OUTLETS.map(o=>o.code); render(); });
  on("#pick-none", () => { state.picking = []; render(); });
  on("#start", () => {
    const sel = state.picking || [];
    const ordered = OUTLETS.map(o=>o.code).filter(c => sel.includes(c));
    if(ordered.length) startRound(ordered);
  });

  each("[data-arrive]", b => arrive(b.dataset.arrive));
  each("[data-heading]", b => setHeading(b.dataset.heading));
  on("#open-addoutlet",   () => { state.pickingExtra = true; state.pickingExtraFor = null; render(); });
  on("#cancel-addoutlet", () => { state.pickingExtra = false; state.pickingExtraFor = null; render(); });
  each("[data-addoutlet]", b => {
    state.pickingExtraFor = b.dataset.addoutlet; render();
    const i = $("#coveringnote"); if(i) i.focus();
  });
  on("#back-addoutlet", () => { state.pickingExtraFor = null; render(); });
  on("#confirm-addoutlet", () => {
    const code = state.pickingExtraFor; if(!code) return;
    const i = $("#coveringnote");
    state.pickingExtra = false; state.pickingExtraFor = null;
    addOutlet(code, i ? i.value : "");
  });
  const cn = $("#coveringnote");
  if(cn) cn.addEventListener("keydown", e => {
    if(e.key === "Enter"){ const b = $("#confirm-addoutlet"); if(b) b.click(); }
  });
  on("#open-addcustom",   () => { state.addingCustomStop = true; render(); const i=$("#customname"); if(i) i.focus(); });
  on("#cancel-addcustom", () => { state.addingCustomStop = false; render(); });
  on("#confirm-addcustom", () => {
    const name = $("#customname"), addr = $("#customaddr"), postal = $("#custompostal"), remark = $("#customremark");
    addCustomStop(name?name.value:"", addr?addr.value:"", postal?postal.value:"", remark?remark.value:"");
  });
  each("[data-retrygeo]", b => retryGeocodeStop(b.dataset.retrygeo));
  each("[data-asknote]",    b => { state.notingOutlet = b.dataset.asknote; render(); const i=$("#notenote"); if(i) i.focus(); });
  each("[data-cancelnote]", b => { state.notingOutlet = null; render(); });
  each("[data-savenote]",   b => {
    const i = $("#notenote");
    state.notingOutlet = null;
    setCoveringNote(b.dataset.savenote, i ? i.value : "");
  });
  const nn = $("#notenote");
  if(nn) nn.addEventListener("keydown", e => {
    if(e.key === "Enter"){ const b = document.querySelector("[data-savenote]"); if(b) b.click(); }
  });
  // Leaving with a must-do job still open needs a second tap to confirm, same
  // reasoning as the task Undo confirm — a full-width button right under a
  // warning line is an easy accidental tap otherwise.
  each("[data-askdepart]",    b => { state.confirmDepart = b.dataset.askdepart; render(); });
  each("[data-canceldepart]", b => { state.confirmDepart = null; render(); });
  each("[data-depart]", b => { state.confirmDepart = null; depart(b.dataset.depart); });
  each("[data-skip]",   b => skipStop(b.dataset.skip));
  each("[data-unarrive]", b => unarrive(b.dataset.unarrive));
  // Reopening a departed stop (Leave tapped by mistake) also needs a confirm —
  // it changes the shape of the round, not just one task.
  each("[data-askreopen]",    b => { state.confirmReopen = b.dataset.askreopen; render(); });
  each("[data-cancelreopen]", b => { state.confirmReopen = null; render(); });
  each("[data-reopen]", b => { state.confirmReopen = null; reopenStop(b.dataset.reopen); });
  each("[data-claim]",  b => { const [o,t] = two(b.dataset.claim); claimTask(o,t); });
  // X on a running job -- undoes an accidental claim right away, no confirm.
  each("[data-cancel]", b => { const [o,t] = two(b.dataset.cancel); cancelClaim(o,t); });
  // Tapping the claimer's own name on a running job marks it done.
  each("[data-finish]", b => { const [o,t] = two(b.dataset.finish); finishTask(o,t); });
  // Tapping Done again reopens it -- guarded by a native confirm() rather than
  // a second row of buttons, since only the claimer ever sees this control.
  each("[data-taskreopen]", b => { const [o,t] = two(b.dataset.taskreopen); if(confirm("Reopen this task?")) undoTask(o,t); });
  each("[data-rmtask]", b => { const [o,t] = two(b.dataset.rmtask); removeTask(o,t); });
  each("[data-openadd]",b => { state.adding = b.dataset.openadd; render(); const i=$("#newtask"); if(i) i.focus(); });
  on("#cancel-add", () => { state.adding = null; render(); });
  each("[data-sugg]",   b => { const i=$("#newtask"); if(i){ i.value = b.dataset.sugg; i.focus(); } });
  each("[data-addtask]",b => { const i=$("#newtask"); addTask(b.dataset.addtask, i ? i.value : ""); });
  const nt = $("#newtask");
  if(nt) nt.addEventListener("keydown", e => {
    if(e.key === "Enter"){ const b = document.querySelector("[data-addtask]"); if(b) addTask(b.dataset.addtask, nt.value); }
  });

  // Water test panel: every chip tap lands in state.wt (never only in the
  // DOM), then re-renders -- the dose readout and the Save button follow.
  each("[data-wtsched]", b => { const [o,t,v] = b.dataset.wtsched.split("|"); const w = wtState(o+"|"+t); w.schedule = v; w.fc = null; w.ph = null; render(); });
  each("[data-wtfc]",  b => { const [o,t,v] = b.dataset.wtfc.split("|"); wtState(o+"|"+t).fc = parseFloat(v); render(); });
  each("[data-wtph]",  b => { const [o,t,v] = b.dataset.wtph.split("|"); wtState(o+"|"+t).ph = parseFloat(v); render(); });
  each("[data-wtneg]", b => { const w = wtState(b.dataset.wtneg); w.showNeg = !w.showNeg; render(); });
  each("[data-wtset]", b => { const [o,t,f,v] = b.dataset.wtset.split("|"); wtState(o+"|"+t)[f] = v; render(); });
  each("[data-wtsave]", b => { const [o,t] = two(b.dataset.wtsave); finishWaterTest(o,t); });
  each("[data-wtretry]", () => { dosingData.tablesErr = false; loadDosingTables(); render(); });
  each("[data-wthistretry]", b => { loadPoolHistory(b.dataset.wthistretry, true); render(); });
  // Manual dosing entry: typed grams/ml land in state.dm on every keystroke
  // (no re-render, so the keyboard stays put); Save reads them back out.
  document.querySelectorAll("[data-dmin]").forEach(i => i.addEventListener("input", () => {
    const [o,t,f] = i.dataset.dmin.split("|"); const dd = dmState(o+"|"+t); dd[f] = i.value;
    if(f === "chlorine") dd.touched = true;
    // The jug total is shown, not typed, so a part-fill edit has to redraw it.
    if(f === "jugPart"){ render(); const again = document.querySelector(`[data-dmin="${o}|${t}|jugPart"]`); if(again){ again.focus(); const v = again.value; again.value = ""; again.value = v; } return; }
    const btn = document.querySelector(`[data-dmsave="${o}|${t}"]`);
    if(btn){ const st = dmSaveState(dmState(o+"|"+t)); btn.disabled = !st.ok; btn.textContent = st.label; }
  }));
  each("[data-dmset]", b => { const [o,t,f,v] = b.dataset.dmset.split("|"); dmState(o+"|"+t)[f] = v; render(); });
  each("[data-dmjug]", b => {
    const [o,t,delta] = b.dataset.dmjug.split("|"), d = dmState(o+"|"+t);
    d.jugFills = Math.max(0, (Number(d.jugFills) || 0) + Number(delta)); render();
  });
  each("[data-dmsave]", b => { const [o,t] = two(b.dataset.dmsave); finishDosing(o,t); });
  each("[data-dmphotobtn]", b => { const i = document.querySelector(`[data-dmphoto="${b.dataset.dmphotobtn}"]`); if(i){ i.value = ""; i.click(); } });
  document.querySelectorAll("[data-dmphoto]").forEach(i => i.addEventListener("change", () => { const f = i.files && i.files[0]; if(f) onDosingPhotoPicked(i.dataset.dmphoto, f); }));
  each("[data-dmphotoretry]", b => {
    const [o,t,pid] = b.dataset.dmphotoretry.split("|"), key = o+"|"+t; const r = myRound(); const s = r && r.stops.find(x=>x.outlet===o); const tk = s && s.tasks.find(x=>x.id===t);
    const d = dmState(key, tk); const ph = (d.photos || []).find(x => x.id === pid); if(!ph || !ph.base64) return;
    ph.status = "uploading"; render(); uploadDosingPhoto(key, d, ph, {code:o, poolKey:dosingKeyFor(o, tk && tk.pool), jobName:tk ? tk.name : "", tool:d.tool});
  });
  each("[data-dmphotorm]", b => {
    const [o,t,pid] = b.dataset.dmphotorm.split("|"), key = o+"|"+t; const d = dmState(key);
    d.photos = (d.photos || []).filter(x => x.id !== pid); d.photos.forEach((x,i) => x.n = i+1);
    if(!d.touched){ d.chlorine = ""; d.chlorineSource = null; d.readG = null; applyReading(d); if(!photoReadings(d).length && d.seeded){ /* back to the plan */ d.seeded = false; } }
    render();
  });
  // Task Setting: where the photo relay lives.
  on("#photo-relay-save", () => { const c = cfg(); c.photo = {relayUrl: ($("#photo-relay-url").value || "").trim(), key: ($("#photo-relay-key").value || "").trim()}; saveCfg(c); flash(c.photo.relayUrl ? "Photo relay saved — the scale photo is now required on Manual Dosing." : "Photo relay cleared — Manual Dosing is back to typed amounts."); });
  // The route diagram lives in a same-origin srcdoc iframe; size it to its
  // content once it loads so the whole plan shows without an inner scrollbar.
  document.querySelectorAll("iframe[data-wtroute]").forEach(f => f.addEventListener("load", () => {
    try{
      const doc = f.contentDocument; f.style.height = (doc.body.scrollHeight + 16) + "px";
      const plan = doc.querySelector(".plan"); if(plan) plan.scrollLeft = (plan.scrollWidth - plan.clientWidth) / 2;
    }catch(e){}
  }));

  each("[data-tbgroup]", b => { state.timeByGroup = b.dataset.tbgroup; render(); });

  on("#date-prev", () => { state.viewDate = shiftDate(state.viewDate||todayKey(), -1); render(); });
  on("#date-next", () => { state.viewDate = shiftDate(state.viewDate||todayKey(), 1); render(); });
  on("#date-pick", () => { const v=$("#date-pick").value; if(v) { state.viewDate = v; render(); } }, "change");
  on("#date-retry", () => { delete state.historyCache[state.viewDate]; render(); });

  // roster
  on("#r-add", () => { const v = $("#r-new").value.trim(); if(v && !state.roster.includes(v)) saveRoster(state.roster.concat([v])); });
  each("[data-rdel]", b => saveRoster(state.roster.filter((_,j)=>j!==+b.dataset.rdel)));
  each("[data-rname]", inp => { const v=inp.value.trim(); if(!v) return; const n=state.roster.slice(); n[+inp.dataset.rname]=v; saveRoster(n); }, "change");

  // job setup
  const cfg = () => clone(state.cfg);
  each("[data-tsday]", b => { state.taskSettingDay = +b.dataset.tsday; render(); });
  on("#req-add", () => { const v=$("#req-new").value.trim(); if(!v) return; const c=cfg(); if(!c.required.includes(v)){ const before=clone(c); c.required.push(v); saveCfg(c); syncPoolChangeToLiveRounds(before, c); } });
  on("#opt-add", () => { const v=$("#opt-new").value.trim(); if(!v) return; const c=cfg(); if(!c.optional.includes(v)){ c.optional.push(v); saveCfg(c); } });
  each("[data-dreq]", b => { const c=cfg(); const before=clone(c); c.required.splice(+b.dataset.dreq,1); saveCfg(c); syncPoolChangeToLiveRounds(before, c); });
  each("[data-dopt]", b => { const c=cfg(); const before=clone(c); const gone=c.optional.splice(+b.dataset.dopt,1)[0];
    // Removing a shared job from the master list drops it from every outlet's
    // assignment on every day, not just today's -- it no longer exists to assign.
    Object.keys(c.assigned).forEach(k => { const byDay=c.assigned[k];
      Object.keys(byDay).forEach(d => byDay[d] = (byDay[d]||[]).filter(x=>x!==gone)); });
    saveCfg(c); syncPoolChangeToLiveRounds(before, c); });
  each("[data-creq]", inp => { const v=inp.value.trim(); if(!v) return; const c=cfg(); const before=clone(c); c.required[+inp.dataset.creq]=v; saveCfg(c); syncPoolChangeToLiveRounds(before, c); }, "change");
  each("[data-copt]", inp => { const v=inp.value.trim(); if(!v) return; const c=cfg(); const before=clone(c); const old=c.optional[+inp.dataset.copt]; c.optional[+inp.dataset.copt]=v;
    // Renaming a shared job carries the rename into every day it was assigned
    // on, at every outlet, so an existing day-specific setup doesn't silently
    // lose the job just because its name changed.
    Object.keys(c.assigned).forEach(k => { const byDay=c.assigned[k];
      Object.keys(byDay).forEach(d => byDay[d] = (byDay[d]||[]).map(x=>x===old?v:x)); });
    saveCfg(c); syncPoolChangeToLiveRounds(before, c); }, "change");
  // Toggling a shared job on/off for an outlet applies to whichever day is
  // currently selected on the Task Setting tab -- not every day -- since the
  // whole point is that some nights need different jobs than others.
  each("[data-assign]", b => {
    const [o,n] = two(b.dataset.assign); const day = +b.dataset.assignday;
    const c = cfg(); const before = clone(c);
    if(!c.assigned[o]) c.assigned[o] = {};
    const cur = c.assigned[o][day] || [];
    c.assigned[o][day] = cur.includes(n) ? cur.filter(x=>x!==n) : cur.concat([n]);
    saveCfg(c);
    syncPoolChangeToLiveRounds(before, c);
  });

  // One-off jobs added for a single outlet only. Also pushed straight into any
  // of today's rounds still open at that outlet, so an urgent job is seen right
  // away instead of waiting for the next round.
  each("[data-addextra]", b => {
    const outlet = b.dataset.addextra;
    const inp = $("#extra-new-"+outlet), chk = $("#extra-req-"+outlet), onceChk = $("#extra-once-"+outlet);
    const poolSel = $("#extra-pool-"+outlet);
    const v = inp ? inp.value.trim() : ""; if(!v) return;
    const kind = (chk&&chk.checked) ? "required" : "optional";
    const oneTime = !onceChk || onceChk.checked;
    const pool = (poolSel && poolSel.value) ? poolSel.value : undefined;
    const days = [];
    for(let d=0; d<7; d++){ const el = document.getElementById("extra-day-"+outlet+"-"+d); if(el && el.checked) days.push(d); }
    const c = cfg();
    // Recorded so a job on the checklist that nobody recognizes ("Light bulb
    // replace"?) can be traced back to whoever on the team set it up, same
    // idea as crediting an ad-hoc job or a reported issue to its author.
    const entry = {id:uid(), name:v, kind, oneTime, addedDate: todayKey(), addedBy: state.me || "Supervisor"};
    if(pool) entry.pool = pool;
    if(days.length) entry.days = days;
    c.extra[outlet] = (c.extra[outlet]||[]).concat([entry]);
    saveCfg(c);
    // Only push it into tonight's open round if it actually applies tonight --
    // a job scoped to other nights shouldn't show up early just because it
    // was added just now.
    if(!days.length || days.includes(operationalNow().getDay())) syncExtraToLiveRounds(outlet, {name:v, kind, pool, addedBy:entry.addedBy}, "add");
  });
  each("[data-rmextra]", b => {
    const [outlet, id] = two(b.dataset.rmextra); const c = cfg();
    const removed = (c.extra[outlet]||[]).find(e => e.id === id);
    c.extra[outlet] = (c.extra[outlet]||[]).filter(e => e.id !== id);
    saveCfg(c);
    if(removed) syncExtraToLiveRounds(outlet, {name:removed.name, kind:removed.kind, pool:removed.pool}, "remove");
  });
  document.querySelectorAll('[id^="extra-new-"]').forEach(inp => inp.addEventListener("keydown", e => {
    if(e.key === "Enter"){ const outlet = inp.id.slice("extra-new-".length); const b = document.querySelector('[data-addextra="'+outlet+'"]'); if(b) b.click(); }
  }));

  // issues — technician reporting one from their own outlet stop
  // The X/Y jobs count on a Routes-tab stop toggles that stop's per-job
  // breakdown open/closed -- purely a view state, so no round needs saving.
  each("[data-toggletasks]", b => {
    const key = b.dataset.toggletasks;
    state.expandedStops[key] = !state.expandedStops[key];
    render();
  });
  // Same idea, but for an outlet card on Overview's "Outlets tonight" grid --
  // expands that outlet's job list and open issues in place.
  each("[data-toggleoutlet]", b => {
    const key = b.dataset.toggleoutlet;
    state.expandedOutlets[key] = !state.expandedOutlets[key];
    render();
  });
  each("[data-openissue]", b => { state.reportingIssue = b.dataset.openissue; render(); const i=$("#issue-desc"); if(i) i.focus(); });
  on("#cancel-issue", () => { state.reportingIssue = null; render(); });
  each("[data-submitissue]", b => {
    const outlet = b.dataset.submitissue;
    const d = $("#issue-desc"), p = $("#issue-priority");
    state.reportingIssue = null;
    reportIssue(outlet, d ? d.value : "", p ? p.value : "medium");
  });

  // Chun Kay wanted the "Open issues" count to actually take you to the
  // issues, not just sit there as a number -- both this KPI card and the
  // matching red badge on the Overview nav tab (wired separately, since the
  // nav bar sits outside #view and isn't rebuilt by wire()) jump straight to
  // the "Issues & tasks" board at the bottom of the page.
  on("#kpi-open-issues", () => { const el = $("#issues-section"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); });

  // issues — supervisor adding a non-urgent task straight to an outlet, from Overview
  on("#open-addissue",   () => { state.addingIssue = true; render(); const i=$("#addissue-desc"); if(i) i.focus(); });
  on("#cancel-addissue", () => { state.addingIssue = false; render(); });
  on("#submit-addissue", () => {
    const o = $("#addissue-outlet"), d = $("#addissue-desc"), p = $("#addissue-priority");
    state.addingIssue = false;
    reportIssue(o ? o.value : "", d ? d.value : "", p ? p.value : "low");
  });

  // issues — supervisor planning/resolving, from the Overview board
  each("[data-planissue]",   b => { state.planningIssue = b.dataset.planissue; render(); });
  each("[data-cancelplan]",  b => { state.planningIssue = null; render(); });
  each("[data-saveplan]", b => {
    const id = b.dataset.saveplan;
    const pr = $("#plan-priority-"+id), dt = $("#plan-date-"+id), asg = $("#plan-assignee-"+id), nt = $("#plan-notes-"+id);
    state.planningIssue = null;
    planIssue(id, {
      priority: pr ? pr.value : undefined,
      targetDate: dt ? dt.value : undefined,
      assignee: asg ? asg.value : undefined,
      notes: nt ? nt.value : undefined
    });
  });
  each("[data-resolveissue]", b => resolveIssue(b.dataset.resolveissue));
  each("[data-reopenissue]",  b => reopenIssue(b.dataset.reopenissue));

  // issues — turning one into a claimable job, from either the technician's
  // own stop card or the supervisor's Overview board (see convertIssueToTask).
  each("[data-converttask]", b => convertIssueToTask(b.dataset.converttask));
}

$("#btn-tech").addEventListener("click", () => { state.role="tech"; render(); });
$("#btn-overview").addEventListener("click", (e) => {
  // Tapping the red issue-count badge should land you ON the issues, not
  // just on the Overview tab you'd then have to scroll down from yourself.
  const toIssues = e.target.closest(".nav-badge");
  state.role="overview"; render();
  if(toIssues){ const el = $("#issues-section"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
});
$("#btn-mgr").addEventListener("click",  () => { state.role="mgr";  render(); });
$("#btn-routes").addEventListener("click", () => { state.role="routes"; render(); });
$("#btn-tasksetting").addEventListener("click", () => { state.role="tasksetting"; render(); });

/* ================= boot ================= */
state.viewDate = todayKey();
try{ const c = localStorage.getItem("drt.cfg"); if(c) state.cfg = JSON.parse(c); }catch(e){}
state.cfg.assigned = normalizeAssigned(state.cfg.assigned);
{ const pruned = pruneExpiredExtras(state.cfg.extra); state.cfg.extra = pruned.extra;
  if(pruned.changed){ try{ localStorage.setItem("drt.cfg", JSON.stringify(state.cfg)); }catch(e){} } }
state.rounds = normalizeRounds(local.read());
state.issues = localIssues.read();
try{ state.roster = JSON.parse(localStorage.getItem("drt.roster")||"[]"); }catch(e){}
render();
initDb();
window.addEventListener("online", () => flushPending());

setInterval(() => {
  // Only worth a tick at all if some live duration ("travelling 12m...") is
  // actually ticking upward somewhere on screen; externalUpdate() itself
  // holds off if the person is mid-edit anywhere that matters.
  const running = Object.values(state.rounds).some(r => r.date===todayKey() && ["onsite","travel"].includes(crewState(r).k));
  if(running) externalUpdate();
}, 15000);
</script>
</body>
</html>
