<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosing Round Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*
 * Deliberately one fixed light theme, not following the phone's dark mode.
 * This is a field tool read on pool decks in direct sunlight — a dark screen
 * loses to glare far worse than it gains from matching the OS setting, so it
 * always renders the same high-contrast light layout for every viewer.
 */
:root{
  --ground:#EEF3F3; --surface:#FFFFFF; --surface-2:#F6F9F9;
  --line:#C7D6D6; --line-soft:#DCE6E6;
  --ink:#0A1417; --ink-2:#33474D; --ink-3:#5B7378;
  --accent:#00676F; --accent-soft:#DCEEEE;
  --travel:#42509B; --travel-soft:#E3E5F5;
  --ok:#256B4C; --ok-soft:#DDEEE5;
  --warn:#8A590D; --warn-soft:#F6EAD4;
  /* A problem a technician can't fix themselves (broken equipment, needs a
     contractor) is a different kind of "attention needed" than the amber
     --warn already used for in-progress/must-do — this is reserved for
     Urgent-priority issues so they stand out from routine in-progress work. */
  --urgent:#B23A2E; --urgent-soft:#F8DEDA;
  --shadow:0 1px 2px rgba(14,26,31,.08),0 6px 18px -8px rgba(14,26,31,.22);
  --r:10px;
  /* A stop with several named pools (JE today) tags each pool's heading with
     one of these, cycled in order, purely so a technician's eye can tell two
     pools' jobs apart at a glance -- no meaning is attached to which color a
     given pool gets. Kept separate from --travel/--ok/--warn above, which
     already mean something else (en route / done / still open). */
  --pool-1:#2E5FA3; --pool-1-soft:#E2EAF6;
  --pool-2:#7A4B9E; --pool-2-soft:#EEE5F5;
  --pool-3:#A15A17; --pool-3-soft:#F5E7D6;
  --pool-4:#3C7A57; --pool-4-soft:#E1EFE6;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 64px}

.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);margin-bottom:18px}
.top-in{max-width:960px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand h1{font-family:"Barlow Condensed",ui-sans-serif,sans-serif;font-weight:700;font-size:25px;margin:0;text-transform:uppercase;letter-spacing:.01em}
.brand .dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-3);white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{font:600 12px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.09em;
  padding:8px 13px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);line-height:1.55}
h2.sec{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.row-2{display:flex;gap:8px}

button.btn,a.btn,span.btn{font:600 14px/1 "IBM Plex Sans",sans-serif;padding:13px 18px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-block}
a.btn{text-decoration:none}
button.btn:focus-visible,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.btn.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.big,a.btn.big{width:100%;padding:16px;font-size:16px}
button.btn.sm,a.btn.sm,span.btn.sm{padding:9px 14px;font-size:13px}
/* Soft amber for "still in progress, tap when done" — deliberately not the same
   solid color as a completed state, so the button doesn't read as already-done. */
button.btn.inprogress{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
button.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
/* Bright, hard-to-miss trigger for reporting a problem -- this is the one
   button on a stop card that should visually shout, since it's the path from
   "technician noticed something" to "supervisor can plan a fix". */
button.btn.urgent{background:var(--urgent);border-color:var(--urgent);color:#fff}
button.btn.urgent:hover{background:color-mix(in srgb,var(--urgent) 88%,black)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.link{border:0;background:transparent;color:var(--ink-3);padding:4px;font:400 13px/1.4 "IBM Plex Sans",sans-serif;cursor:pointer;text-decoration:underline}

select,input[type=text],input[type=number]{font-family:"IBM Plex Sans",sans-serif;font-size:15px;padding:11px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.banner{border-radius:var(--r);padding:11px 14px;font-size:13px;line-height:1.5;margin-bottom:14px;
  background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}

/* Fixed to the viewport (not the scrolling page), so an alert like "finish your
   current job first" is seen wherever the technician is scrolled to — a banner
   placed inline at the top of a long outlet list would otherwise go unseen. */
#toast{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:column;
  align-items:center;gap:8px;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
#toast .bubble{pointer-events:auto;max-width:480px;width:100%;border-radius:var(--r);padding:12px 16px;
  font-size:13.5px;line-height:1.45;font-weight:600;background:var(--warn-soft);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);box-shadow:0 6px 20px rgba(0,0,0,.18);
  animation:toast-in .18s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#toast .bubble{animation:none}}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;
  font:600 11px/1.4 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.onsite{background:var(--accent-soft);color:var(--accent)}
.chip.travel{background:var(--travel-soft);color:var(--travel)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.idle{background:var(--surface-2);color:var(--ink-3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chip.onsite .dot,.chip.travel .dot{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.chip .dot{animation:none}}

.tag{font:600 10px/1.5 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.11em;
  padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag.req{background:var(--warn-soft);color:var(--warn)}
.tag.opt{background:var(--travel-soft);color:var(--travel)}
.tag.add{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.tag.once{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.tag.rec{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.tag.st-open{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.tag.st-prog{background:var(--warn-soft);color:var(--warn)}
.tag.st-done{background:var(--ok-soft);color:var(--ok)}
.tag.covering{background:var(--travel-soft);color:var(--travel)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpis.trio{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;min-width:0}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k{margin-top:3px}
.kpis.trio .v{font-size:20px}
@media(max-width:420px){.kpis.trio .v{font-size:17px}.kpis.trio .kpi{padding:10px 9px}.kpis.trio .k{font-size:10px;letter-spacing:.08em}}

/* route */
.route{display:flex;flex-direction:column;gap:8px}
.stop{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 13px 50px}
.stop .idx{position:absolute;left:13px;top:13px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  font:600 12px/1 "IBM Plex Mono",monospace;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.stop.is-done{background:var(--surface-2)}
.stop.is-done .idx{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stop.is-active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.stop.is-active .idx{background:var(--accent);color:#fff;border-color:transparent}
.stop.is-next{border-color:var(--travel);border-style:dashed}
.stop.is-next .idx{background:var(--travel-soft);color:var(--travel);border-color:transparent}
.stop-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stop-name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.stop-times{margin-left:auto;font-size:12.5px;color:var(--ink-3);display:flex;gap:12px}
.stop-body{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.travel-gap{display:flex;align-items:center;gap:8px;padding:2px 0 2px 50px;font:500 12px/1 "IBM Plex Mono",monospace;color:var(--travel)}
.travel-gap .ln{flex:1;height:1px;background:var(--travel);opacity:.35}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pool-head{padding:7px 12px 6px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;background:var(--surface-2);color:var(--accent)}
.pool-head:not(:first-child){border-top:1px solid var(--line-soft)}
.pool-head.pool-c1{background:var(--pool-1-soft);color:var(--pool-1)}
.pool-head.pool-c2{background:var(--pool-2-soft);color:var(--pool-2)}
.pool-head.pool-c3{background:var(--pool-3-soft);color:var(--pool-3)}
.pool-head.pool-c4{background:var(--pool-4-soft);color:var(--pool-4)}
.task{background:var(--surface);padding:11px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.task.running{background:var(--warn-soft)}
.task.finished{background:var(--surface-2)}
.task-main{display:flex;flex-direction:column;gap:3px;min-width:140px;flex:1}
.task-name{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.task.finished .task-name{color:var(--ink-2)}
.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.task-time{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.task .act{flex:none}
/* The X (cancel claim) + claimer's-name (finish) button pair shown on a job
   the current technician has running. */
.act-group{display:flex;gap:6px;flex:none}
button.btn.act.cancel{padding:9px 11px;background:var(--surface);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
button.btn.act.done,span.btn.act.done{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
/* A <span> rather than <button> for a job someone else claimed or finished —
   shows their name/status without looking clickable to a technician who
   isn't allowed to act on it. */
span.btn.act{cursor:default}
span.btn.act.inprogress{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
/* A finished job that isn't this technician's own claim -- greyed out
   instead of the "mine, reopenable" green, so a job someone else already
   did never looks like something worth (or possible) to tap. */
span.btn.act.done.locked{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.task-conflict{display:block;width:100%;font-size:11px;line-height:1.4;color:var(--warn);margin-top:2px}
.mark{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 11px/1 "IBM Plex Mono",monospace;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-3)}
.task.finished .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.task.running .mark{background:var(--warn);border-color:var(--warn);color:#fff}

.addbox{background:var(--surface-2);border:1px dashed var(--line);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{font:500 12.5px/1 "IBM Plex Sans",sans-serif;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.sugg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* supervisor */
.crew{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crew-row{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.crew-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crew-name{font-weight:600;font-size:15px}
.crew-where{margin-left:auto;font-size:13px;color:var(--ink-2)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.bar .s-on{background:var(--accent)}
.bar .s-tr{background:var(--travel);opacity:.55}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.outlet-group+.outlet-group{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.outlet-group-head{font:600 12px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:8px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th{font:600 11px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}

.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.brow .lbl{font-size:13.5px;overflow-wrap:anywhere}
.brow .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
.brow .track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.brow .fill{display:block;height:100%;background:var(--accent);border-radius:4px}

.route-card{overflow:hidden}
.route-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.route-body{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:flex-start;padding:14px}
.routemap{margin:0;flex:1 1 260px;min-width:220px;max-width:340px}
.routemap svg{display:block;width:100%;height:auto;color:var(--ink-3)}
.routemap figcaption{margin-top:4px}
.route-list{flex:1 1 220px;min-width:200px;display:flex;flex-direction:column;gap:9px}
.route-stop{display:flex;align-items:center;gap:9px;font-size:13.5px;flex-wrap:wrap;row-gap:4px}
.route-idx{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font:700 11px/20px "Barlow Condensed",sans-serif;text-align:center}
.route-name{min-width:56px}
.route-foot{padding:0 14px 14px}

/* A ring pulsing around the marker the technician is still standing at right
   now — the same "live" language as the onsite/travel crew chips elsewhere. */
@keyframes route-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.route-pulse{animation:route-pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.route-pulse{animation:none}}

.datebar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.datebar .dnav{flex:none;width:38px;height:38px;padding:0;font-size:16px;line-height:1;border-radius:8px}
.datebar .dmid{flex:1;text-align:center;min-width:0}
.datebar .dmid .mono{font-weight:600;font-size:14px;white-space:nowrap}
.datebar input[type=date]{width:auto;flex:none;padding:8px 10px;font-size:13px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.6}
.sample-note{background:var(--travel-soft);color:var(--travel);border-radius:8px;padding:8px 12px;
  font:600 11px/1.4 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;display:inline-block}

details.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.panel summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"▾";float:right;color:var(--ink-3)}
details.panel[open] summary::after{content:"▴"}
.panel-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}

.pill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 6px;text-align:center;
  font:600 14px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:400;opacity:.7;margin-top:3px;letter-spacing:0}
/* Informational only -- another technician already having this outlet in
   their round today never blocks picking it too, it's just a heads-up. */
.pill-taken{border-color:var(--travel);background:var(--travel-soft)}
.pill-who{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;text-transform:none;
  letter-spacing:0;margin-top:3px;color:var(--travel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill[aria-pressed="true"] .pill-who{color:#fff;opacity:.9}

.assign-block{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.assign-block:last-child{border-bottom:0}
.assign-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.assign-row .oc{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:16px;min-width:64px}
.extra-list{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.extra-item{display:flex;align-items:center;gap:8px;font-size:13.5px}
.extra-item .extra-name{flex:1;overflow-wrap:anywhere}
.extra-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.extra-add input[type=text]{flex:1 1 160px}
.extra-add select.pool-pick{flex:0 0 auto;padding:9px 10px;font-size:13.5px}
.tag.pool{background:var(--accent-soft);color:var(--accent)}
.chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.tog{font:500 12.5px/1 "IBM Plex Sans",sans-serif;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--travel);border-color:var(--travel);color:#fff}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* nav badge -- small count shown on the Overview tab when issues need attention */

<!--
  Same Firebase project as the Maintenance Board app (maintenance-board-f931a),
  just a separate pair of top-level collections (dosing_rounds / dosing_config)
  so this app's data never mixes with the maintenance-task data. The apiKey
  below is a public client identifier, not a secret — Firestore access is
  controlled by the project's security rules, not by hiding this value.
-->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyANFCZbvRGO9aMRtG9MF_qONO3FL85CzSo",
  authDomain: "maintenance-board-f931a.firebaseapp.com",
  projectId: "maintenance-board-f931a",
  storageBucket: "maintenance-board-f931a.firebasestorage.app",
  messagingSenderId: "169864970579",
  appId: "1:169864970579:web:bfb7490d0aebcfed17e1a6",
  measurementId: "G-HYG264NKP4"
};

/* ================= configuration ================= */
const OUTLETS = [
  {code:"CC",day:2,addr:"750A Chai Chee Road, Viva Business Park, #01-02, Singapore 469001",lat:1.322978,lng:103.922125},
  {code:"DR",day:4,addr:"8 Duke's Road, Singapore",lat:1.322166,lng:103.811588},
  {code:"LENTOR",day:5,addr:"1 Kalidasa Avenue, Teacher's Housing Estate, Singapore 789381",lat:1.381713,lng:103.830166},
  {code:"TENGAH",day:1,addr:"126B Tengah Drive, #01-321 Plantation Village, Singapore 692126",lat:1.358959,lng:103.735645},
  // JE is one outlet/stop like any other -- arrive once, leave once -- but it
  // actually has 4 separate physical pools on site. "pools" fans each of the
  // outlet's required tasks out across every named pool, so the 3 must-do
  // jobs configured for every branch become 12 distinct checklist items here
  // (one per pool), instead of one ambiguous "Water test & dosing" that
  // doesn't say which of the 4 pools it's for.
  {code:"JE",day:1,addr:"2 Jurong Gateway Road Indoor Pool, #01-05, Singapore 608512",lat:1.336640,lng:103.744772,
    pools:["JEIP1","JEIP2","JEOP1","JEOP2"]},
  {code:"HB",day:3,addr:"750 Chai Chee Road, ESR BizPark @ Chai Chee, #01-07, Singapore 469000",lat:1.323652,lng:103.922103},
  {code:"HS",day:4,addr:"28 Stevens Road, #01-10 Swimming Pool, Singapore 257878",lat:1.313869,lng:103.828606},
  {code:"BK",day:1,addr:"18 Jalan Kelulut, Seletar Hills Estate, Singapore 809035",lat:1.383452,lng:103.875847},
  {code:"WWW",day:2,addr:"1 Pasir Ris Close, E!Hub@Downtown East, Singapore 519599",lat:1.379127,lng:103.955445},
  {code:"TPY",day:0,addr:"85 Lorong 4 Toa Payoh, #01-336, Singapore 310085",lat:1.336285,lng:103.848429}
];
const DAYNAME = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEFAULT_TASKS = {
  required: ["Water test & dosing"],
  optional: ["Manual vacuum pool", "Backwash filter", "Clear skimmer baskets"],
  assigned: {},                      // outlet code -> [optional task names] (shared pool, toggled per outlet)
  extra: {}                          // outlet code -> [{id, name, kind}] — one-off jobs unique to that outlet
};
const SUGGESTIONS = ["Fix door","Soap dispenser","Replace light","Clear drain","Top up chemicals","Report to office"];

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const dateKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
// A shift that runs past midnight -- an occasional late night, training a
// new hire, chasing down an urgent fix -- is still that day's shift for
// round-continuity purposes. Without this, the moment the clock ticks past
// 00:00 the technician's own round id (todayKey()+"__"+person) flips to a
// brand-new, nonexistent "today" round mid-shift: their open round looks
// like it vanished, every claim/finish action silently no-ops against a
// round that doesn't exist yet, and if they then pick outlets and hit Start
// again it creates a genuinely empty new round -- all while the real one,
// with the whole evening's actual work, just sits there under yesterday's
// date, invisible until a supervisor manually looks up that date. Treating
// the operational day as not changing until well past any realistic
// knock-off time avoids all of that.
const DAY_CUTOFF_HOUR = 6;
const DAY_CUTOFF_MINUTE = 30;
function operationalNow(){
  const d = new Date();
  const beforeCutoff = d.getHours() < DAY_CUTOFF_HOUR ||
    (d.getHours() === DAY_CUTOFF_HOUR && d.getMinutes() < DAY_CUTOFF_MINUTE);
  if(beforeCutoff) d.setDate(d.getDate()-1);
  return d;
}
const todayKey = () => dateKey(operationalNow());
const shiftDate = (key, days) => { const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+days); return dateKey(dt); };
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = key => {
  const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d);
  const yr = y===new Date().getFullYear() ? "" : " "+y;
  return DAYNAME[dt.getDay()]+", "+d+" "+MONTH_ABBR[m-1]+yr;
};
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "x";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clockOf = iso => { const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2,9);

function mins(a,b){ return Math.max(0, Math.round((new Date(b) - new Date(a))/60000)); }
function dur(m){ if(m==null) return "—"; if(m < 60) return m+"m"; return Math.floor(m/60)+"h "+pad(m%60)+"m"; }
function liveDur(since){ return dur(mins(since, new Date().toISOString())); }

/* ================= state ================= */
const state = {
  role:"tech",
  me: localStorage.getItem("drt.me") || "",
  roster: [],
  cfg: clone(DEFAULT_TASKS),
  rounds: {},
  showSample:false,
  db:null, dbTried:false,
  picking:null,
  pickingExtra:false,    // whether the "add outlet — covering for someone" picker is open
  pickingExtraFor:null,  // outlet code chosen in that picker, waiting on its optional note
  notingOutlet:null,     // outlet code whose covering-note box is open (add or edit)
  adding:null,           // outlet code whose "add task" box is open
  confirmDepart:null,    // outlet code of a Leave-with-open-must-do pending a second confirming tap
  confirmReopen:null,    // outlet code of a Reopen (undo a departure) pending a second confirming tap
  timeByGroup:"job",     // "Time by job" section: "job" (aggregate) or "outlet" (grouped per branch)
  pending:{},            // docPath -> {data, tries} — writes not yet confirmed saved to the team
  panelsOpen:{},         // panel key -> open/closed, kept across redraws (the view is rebuilt often)
  viewDate: null,        // supervisor board: which day is showing (set to today at boot)
  historyCache:{},       // date string -> {rounds:[...], loading:bool} — past days, fetched once and kept
  issues:{},             // id -> issue — problems flagged (by a technician) or tasks assigned (by a supervisor) that
                          // need a plan and a date, not routine nightly checklist jobs
  reportingIssue:null,   // outlet code whose "report an issue" form is open, on the technician's own round
  addingIssue:false,     // whether the Overview "+ Add a task for an outlet" form is open
  planningIssue:null     // issue id whose plan/edit form is open, on the Overview board
};
const myId = () => state.me ? todayKey()+"__"+slug(state.me) : null;
const myRound = () => state.rounds[myId()] || null;
// Who else (besides me) already has this outlet in their round today, whether
// they've arrived yet or not. Purely informational — nothing stops two
// technicians covering the same outlet, this just lets a technician picking
// their round see who else already grabbed a branch.
function othersOn(code){
  const mine = myId();
  const names = new Set();
  Object.values(state.rounds).forEach(r => {
    if(r.id === mine || r.date !== todayKey() || !r.stops) return;
    if(r.stops.some(s => s.outlet === code)) names.add(r.person);
  });
  return [...names];
}

// Two technicians can each end up with their own independent copy of the
// same physical job at a shared outlet -- most often because both already
// had that outlet in their round before live claim-syncing ever connected
// the two copies, so each finished "their" copy under their own name with
// nobody the wiser. If another round's copy of this exact job (same outlet,
// name, kind, pool) is ALSO finished but credited to someone else, that's a
// live conflict: this task's own claimedBy can't be trusted as sole truth,
// so it should never be treated as editable purely off this round's own
// data. Returns the other claimer's name, or null if every round agrees.
function conflictingTask(outlet, t){
  if(!t.doneAt || !t.claimedBy) return null;
  const today = todayKey();
  for(const r of Object.values(state.rounds)){
    if(r.date !== today || !r.stops) continue;
    const s = r.stops.find(x => x.outlet === outlet);
    if(!s) continue;
    const m = s.tasks.find(x => x.name===t.name && x.kind===t.kind && (x.pool||null)===(t.pool||null));
    if(m && m.doneAt && m.claimedBy && m.claimedBy !== t.claimedBy) return m;
  }
  return null;
}

/* ================= storage ================= */
const local = {
  read(){ try{ return JSON.parse(localStorage.getItem("drt.rounds")||"{}"); }catch(e){ return {}; } },
  write(all){ try{ localStorage.setItem("drt.rounds", JSON.stringify(all)); }catch(e){} }
};
const localIssues = {
  read(){ try{ return JSON.parse(localStorage.getItem("drt.issues")||"{}"); }catch(e){ return {}; } },
  write(all){ try{ localStorage.setItem("drt.issues", JSON.stringify(all)); }catch(e){} }
};

/*
 * Every write lands on this device immediately (localStorage), then tries the
 * shared store. If the shared write fails, the change is NOT lost — it stays
 * queued in state.pending and a background timer keeps retrying until it goes
 * through, so a flaky connection heals itself instead of needing the person
 * to notice and redo the change.
 */
async function persist(docPath, data, cacheFn){
  cacheFn();
  if(!state.db) return;
  try{
    await state.db.doc(docPath).set(data);
    if(state.pending[docPath]){ delete state.pending[docPath]; renderConn(); }
  } catch(e){
    state.pending[docPath] = {data, tries:(state.pending[docPath]?.tries||0)+1};
    renderConn();
    setTimeout(flushPending, 2500);
  }
}
async function flushPending(){
  if(!state.db) return;
  const paths = Object.keys(state.pending);
  for(const p of paths){
    const item = state.pending[p]; if(!item) continue;
    try{ await state.db.doc(p).set(item.data); delete state.pending[p]; }
    catch(e){ item.tries++; }
  }
  renderConn();
  if(Object.keys(state.pending).length) setTimeout(flushPending, 5000);
}

async function initDb(){
  let db = null;
  try {
    if(window.firebase && firebase.initializeApp){
      const app = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(firebaseConfig);
      db = firebase.firestore(app);
    }
  } catch(e){ db = null; }
  state.db = db; state.dbTried = true;

  if(!db){
    try{ state.roster = JSON.parse(localStorage.getItem("drt.roster")||"[]"); }catch(e){ state.roster=[]; }
    try{ const c = localStorage.getItem("drt.cfg"); if(c) state.cfg = JSON.parse(c); }catch(e){}
    const pruned = pruneExpiredExtras(state.cfg.extra);
    state.cfg.extra = pruned.extra;
    if(pruned.changed) localStorage.setItem("drt.cfg", JSON.stringify(state.cfg));
    state.rounds = normalizeRounds(local.read());
    state.issues = localIssues.read();
    render(); return;
  }
  // While a doc has a write of ours still pending, ignore incoming snapshots for it —
  // otherwise a stale remote read can stomp the change we're still trying to save.
  db.doc("dosing_config/roster").onSnapshot(
    s => { if(state.pending["dosing_config/roster"]) return;
      const d = s.exists ? s.data() : null; state.roster = (d && Array.isArray(d.members)) ? clone(d.members) : []; render(); }, ()=>{});
  db.doc("dosing_config/tasks").onSnapshot(
    s => {
      if(state.pending["dosing_config/tasks"]) return;
      const d = s.exists ? clone(s.data()) : null;
      state.cfg = {
        required: (d && Array.isArray(d.required)) ? d.required : clone(DEFAULT_TASKS.required),
        optional: (d && Array.isArray(d.optional)) ? d.optional : clone(DEFAULT_TASKS.optional),
        assigned: (d && d.assigned && typeof d.assigned === "object") ? d.assigned : {},
        extra: (d && d.extra && typeof d.extra === "object") ? d.extra : {}
      };
      const pruned = pruneExpiredExtras(state.cfg.extra);
      state.cfg.extra = pruned.extra;
      render();
      if(pruned.changed && !state.extrasPruned){ state.extrasPruned = true; saveCfg(clone(state.cfg)); }
    }, ()=>{});
  db.collection("dosing_rounds").where("date","==",todayKey()).onSnapshot(
    s => {
      const next={};
      s.docs.forEach(d => { const p="dosing_rounds/"+d.id; if(!state.pending[p]) next[d.id] = clone(Object.assign({id:d.id}, d.data())); });
      // keep any of today's rounds we still have a pending write for, using our local version
      Object.keys(state.pending).forEach(p => { if(p.startsWith("dosing_rounds/")){ const id=p.slice(14); if(state.rounds[id]) next[id]=state.rounds[id]; } });
      state.rounds = normalizeRounds(next); render();
    }, ()=>{});
  // Issues aren't scoped to today -- a problem raised last week and still
  // waiting on a contractor needs to stay visible until it's actually
  // resolved, not fall off the board at midnight the way a round does. The
  // limit just keeps a very old, long-running board from pulling an
  // unbounded amount of data; resolved issues are what ages out first in
  // practice since open/planned ones are what everyone keeps adding to.
  db.collection("dosing_issues").orderBy("raisedAt","desc").limit(500).onSnapshot(
    s => {
      const next={};
      s.docs.forEach(d => { const p="dosing_issues/"+d.id; if(!state.pending[p]) next[d.id] = clone(Object.assign({id:d.id}, d.data())); });
      Object.keys(state.pending).forEach(p => { if(p.startsWith("dosing_issues/")){ const id=p.slice(14); if(state.issues[id]) next[id]=state.issues[id]; } });
      state.issues = next; render();
    }, ()=>{});
  render();
}

async function saveRound(round){
  state.rounds[round.id] = round; render();
  await persist("dosing_rounds/"+round.id, (()=>{ const c=clone(round); delete c.id; return c; })(),
    () => { const all = local.read(); all[round.id] = round; local.write(all); });
}
async function saveRoster(members){
  state.roster = members; render();
  await persist("dosing_config/roster", {members}, () => localStorage.setItem("drt.roster", JSON.stringify(members)));
}
async function saveCfg(cfg){
  state.cfg = cfg; render();
  await persist("dosing_config/tasks", clone(cfg), () => localStorage.setItem("drt.cfg", JSON.stringify(cfg)));
}
async function saveIssue(issue){
  state.issues[issue.id] = issue; render();
  await persist("dosing_issues/"+issue.id, (()=>{ const c=clone(issue); delete c.id; return c; })(),
    () => { const all = localIssues.read(); all[issue.id] = issue; localIssues.write(all); });
}

// A one-off alert (blocked action, save failure) — shown as a toast fixed to the
// bottom of the viewport so it's seen no matter where the page is scrolled to,
// with its own timer so an unrelated re-render can't wipe it out early.
let toastTimer = null;
function flash(msg){
  const el = $("#toast"); if(!el) return;
  el.innerHTML = '<div class="bubble" role="alert">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; }, 4500);
}
function renderConn(){
  const el = $("#conn"); if(!el) return;
  const pendingN = Object.keys(state.pending).length;
  if(state.dbTried && !state.db){
    el.innerHTML = '<div class="banner"><strong>Local mode.</strong> Shared storage isn\'t available in this view, so entries stay on this device and the supervisor board won\'t show other people.</div>';
  } else if(pendingN){
    const stuck = Object.values(state.pending).some(p => p.tries >= 3);
    el.innerHTML = '<div class="banner"><strong>'+(stuck?"Still trying to sync.":"Saving…")+'</strong> '
      + (stuck
        ? "Your change is kept on this phone, but hasn't reached the team yet — check your signal. It'll keep retrying on its own."
        : "This will only take a moment.")
      + '</div>';
  } else {
    el.innerHTML = "";
  }
}

/* ================= location (recorded, never blocking) ================= */
function getFix(){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(null);
    let settled=false; const done = v => { if(!settled){ settled=true; resolve(v); } };
    setTimeout(()=>done(null), 8000);
    navigator.geolocation.getCurrentPosition(
      p => done({lat:+p.coords.latitude.toFixed(5), lng:+p.coords.longitude.toFixed(5), acc:Math.round(p.coords.accuracy)}),
      () => done(null), {enableHighAccuracy:true, timeout:7500, maximumAge:20000});
  });
}

/* ================= round mechanics ================= */
function scheduledToday(){
  const d = operationalNow().getDay();
  const list = OUTLETS.filter(o => o.day === d).map(o => o.code);
  return list.length ? list : OUTLETS.map(o => o.code);
}
function tasksFor(outlet){
  // Most outlets are a single pool, so the branch's jobs apply as-is. An outlet
  // with named pools (JE today) needs the must-do list AND any shared "if time
  // allows" job repeated once per pool -- every physical pool needs its own
  // water test, its own vacuuming -- labelled with the pool it's for instead of
  // one task that doesn't say which of several physical pools it covers.
  const pools = (OUTLETS.find(o => o.code===outlet) || {}).pools;
  // One-time extras only feed NEW rounds on the day they were added — a last-minute
  // job shouldn't need to be remembered and removed by hand before the next visit.
  const today = todayKey();
  const extraList = (state.cfg.extra[outlet] || []).filter(e => !e.oneTime || e.addedDate === today);

  if(!pools){
    const req = state.cfg.required.map(n => ({id:uid(), name:n, kind:"required", startedAt:null, doneAt:null, claimedBy:null}));
    const asg = (state.cfg.assigned[outlet] || []).map(n => ({id:uid(), name:n, kind:"optional", startedAt:null, doneAt:null, claimedBy:null}));
    const ex  = extraList.map(e => ({id:uid(), name:e.name, kind:e.kind==="required"?"required":"optional", startedAt:null, doneAt:null, claimedBy:null}));
    return req.concat(asg).concat(ex);
  }

  // A pooled outlet can also get an ad-hoc job that isn't tied to any one pool
  // (e.g. "restock chemical shed") — those are added with no e.pool and are
  // listed first, unheaded, same as the flat list above. Every pool-tagged job
  // (required, shared "if time allows", and any extra added for that specific
  // pool) is then grouped together in pool order, so each pool's jobs land
  // under exactly one heading instead of getting split if an ad-hoc job for
  // that pool was added after the standing ones.
  const wholeOutlet = extraList
    .filter(e => !e.pool)
    .map(e => ({id:uid(), name:e.name, kind:e.kind==="required"?"required":"optional", startedAt:null, doneAt:null, claimedBy:null}));
  const perPool = pools.flatMap(p => {
    const req = state.cfg.required.map(n => ({id:uid(), name:n, pool:p, kind:"required", startedAt:null, doneAt:null, claimedBy:null}));
    const asg = (state.cfg.assigned[outlet] || []).map(n => ({id:uid(), name:n, pool:p, kind:"optional", startedAt:null, doneAt:null, claimedBy:null}));
    const ex  = extraList.filter(e => e.pool === p)
      .map(e => ({id:uid(), name:e.name, pool:p, kind:e.kind==="required"?"required":"optional", startedAt:null, doneAt:null, claimedBy:null}));
    return req.concat(asg).concat(ex);
  });
  return wholeOutlet.concat(perPool);
}

// A technician can pick an outlet someone else is already covering today (see
// othersOn, which highlights this on the outlet picker) or add one mid-round
// to cover for a teammate. Either way, if a job there has already been
// claimed, started or finished by that teammate, the fresh copy this
// technician gets must start from that live state -- not blank -- otherwise
// their screen would show it as Open and let them claim or reopen work
// that's already spoken for. tasksFor() gives the canonical job list (ids,
// pools); this overlays whatever progress an existing round for that outlet
// already has, matched the same way syncTaskToOtherRounds matches tasks, so
// the two copies agree from the moment this one is created.
function seedTasksFor(outlet){
  const fresh = tasksFor(outlet);
  const today = todayKey();
  const existing = Object.values(state.rounds).find(r =>
    r.date === today && r.stops && r.stops.some(s => s.outlet === outlet && !s.departAt));
  if(!existing) return fresh;
  const stop = existing.stops.find(s => s.outlet === outlet && !s.departAt);
  return fresh.map(t => {
    const m = stop.tasks.find(x => x.name === t.name && x.kind === t.kind && (x.pool||null) === (t.pool||null));
    return m ? Object.assign({}, t, {claimedBy: m.claimedBy||null, startedAt: m.startedAt||null, doneAt: m.doneAt||null}) : t;
  });
}

// Drops one-time extras whose day has passed, so the supervisor never has to
// remember to remove a last-minute job manually. Recurring extras (oneTime
// false/undefined) and today's one-time extras are left untouched.
function pruneExpiredExtras(extra){
  const today = todayKey();
  const out = {}; let changed = false;
  Object.keys(extra||{}).forEach(outlet => {
    const list = extra[outlet] || [];
    const kept = list.filter(e => !e.oneTime || e.addedDate === today);
    if(kept.length !== list.length) changed = true;
    if(kept.length) out[outlet] = kept;
  });
  return {extra: out, changed};
}

// Repairs a round saved by an earlier version of the app (before jobs existed —
// stops only had chlorine/pH fields). Without this, one old round can throw on
// render and stall the whole page for whoever it belongs to. Never destructive:
// arrival/departure times are kept; a missing job list is filled in fresh.
function normalizeRound(r){
  if(!r || !Array.isArray(r.stops)) return r;
  if(r.headingTo === undefined) r.headingTo = null;
  r.stops = r.stops.map(s => Object.assign(
    {outlet:s.outlet, arriveAt:null, departAt:null, fixIn:null, fixOut:null, covering:false, coveringNote:""},
    s,
    {tasks: (Array.isArray(s.tasks) ? s.tasks : tasksFor(s.outlet)).map(t =>
      // Rounds saved before per-technician claiming existed have no
      // `claimedBy`. A task that was already started under the old
      // single-technician-per-round model was implicitly "claimed" by the
      // round's own owner, so that's the safe default to backfill -- an
      // untouched (never-started) task just gets an explicit null.
      Object.assign({claimedBy: t.startedAt ? r.person : null}, t))}
  ));
  return r;
}
function normalizeRounds(map){ Object.keys(map).forEach(k => normalizeRound(map[k])); return map; }

/*
 * The live subscription only tracks TODAY's rounds (so "Crew right now" stays fast
 * and cheap). A past day is fetched once, on demand, and cached — nothing is lost,
 * it just isn't loaded until the supervisor asks to see it.
 */
function roundsForDate(date){
  if(date === todayKey() || !state.db) return Object.values(state.rounds).filter(r => r.date === date);
  const c = state.historyCache[date];
  return (c && c.rounds) ? c.rounds : [];
}
async function loadHistory(date){
  if(date === todayKey() || !state.db) return;
  if(state.historyCache[date]) return;   // already loaded or in flight
  state.historyCache[date] = {rounds:[], loading:true};
  render();
  try{
    const snap = await state.db.collection("dosing_rounds").where("date","==",date).get();
    const rounds = snap.docs.map(d => normalizeRound(clone(Object.assign({id:d.id}, d.data()))));
    state.historyCache[date] = {rounds, loading:false};
  } catch(e){
    state.historyCache[date] = {rounds:[], loading:false, error:true};
  }
  render();
}
function activeStop(r){ return r ? r.stops.find(s => s.arriveAt && !s.departAt) : null; }
function nextStop(r){ return r ? r.stops.find(s => !s.arriveAt) : null; }
function lastDeparture(r){ const d = r ? r.stops.filter(s=>s.departAt) : []; return d.length ? d[d.length-1].departAt : null; }
// The task THIS round's own owner currently has running -- not just any task
// that happens to be mid-claim in r.stops. Two technicians can now cover the
// same outlet, and a claim either of them makes gets mirrored into the
// other's round too (see syncTaskToOtherRounds) so they can each see it's
// taken; without the claimedBy check here, a teammate's claim showing up in
// my own round would look like MY current job and wrongly block me from
// claiming something else of my own.
function runningTask(r){
  if(!r) return null;
  for(const s of r.stops){ const t = s.tasks.find(x => x.startedAt && !x.doneAt && x.claimedBy === r.person); if(t) return {stop:s, task:t}; }
  return null;
}
function crewState(r){
  if(!r || !r.stops.some(s => s.arriveAt)) return {k:"idle", label:"Not started"};
  const a = activeStop(r);
  if(a){
    const rt = a.tasks.find(t => t.startedAt && !t.doneAt && t.claimedBy === r.person);
    return {k:"onsite", label: rt ? a.outlet+" · "+rt.name : "At "+a.outlet, since: rt ? rt.startedAt : a.arriveAt};
  }
  if(nextStop(r)) return {k:"travel", label:"Travelling", since:lastDeparture(r)};
  return {k:"done", label:"Round complete"};
}
function totals(r){
  let on=0, tr=0, prev=null, tdone=0;
  r.stops.forEach(s => {
    tdone += s.tasks.filter(t => t.doneAt).length;
    if(!s.arriveAt) return;
    if(prev) tr += mins(prev, s.arriveAt);
    if(s.departAt){ on += mins(s.arriveAt, s.departAt); prev = s.departAt; } else prev = null;
  });
  return {onSite:on, travel:tr, done:r.stops.filter(s=>s.departAt).length, total:r.stops.length, tasksDone:tdone};
}
function requiredLeft(s){ return s.tasks.filter(t => t.kind==="required" && !t.doneAt).length; }

async function startRound(codes){
  state.picking = null;
  await saveRound({
    id: myId(), date: todayKey(), person: state.me, personSlug: slug(state.me),
    createdAt: new Date().toISOString(), headingTo: null,
    stops: codes.map(c => ({outlet:c, arriveAt:null, departAt:null, fixIn:null, fixOut:null, tasks: seedTasksFor(c)}))
  });
}
function withRound(fn, errMsg){
  return (async () => {
    try{
      const r = clone(myRound() || {}); if(!r.stops) return;
      const changed = fn(r); if(changed === false) return;
      await saveRound(r);
    } catch(e){ flash(errMsg || "Something didn't save. Try again."); }
  })();
}

/*
 * Supervisor-side push: whenever Job Setup changes what an outlet's job list
 * should look like — a per-branch job added/removed, a shared job toggled
 * on/off for that outlet, or the must-do/optional master lists edited —
 * reach into any of TODAY's rounds that still have that outlet open (not yet
 * departed) and add/remove the matching task there too, so nothing has to
 * wait for the next round to be noticed. A job the technician has already
 * started or finished is never touched, so nobody's real timing data gets
 * rewritten out from under them.
 */
// job may carry a `pool` field (the physical pool it's tagged to, e.g. "JEIP1")
// -- add/remove matches on name+kind+pool so a job scoped to one pool never
// touches another pool's identical-looking task.
async function syncExtraToLiveRounds(outlet, job, action){
  const today = todayKey();
  const jobs = Object.values(state.rounds).filter(r => r.date === today);
  const matches = t => t.name === job.name && t.kind === job.kind && (t.pool||null) === (job.pool||null);
  for(const orig of jobs){
    const r = clone(orig);
    const s = r.stops.find(x => x.outlet === outlet && !x.departAt);
    if(!s) continue;
    let changed = false;
    if(action === "add"){
      if(!s.tasks.some(matches)){
        s.tasks.push(Object.assign({id:uid(), name:job.name, kind:job.kind, startedAt:null, doneAt:null, claimedBy:null}, job.pool ? {pool:job.pool} : {}));
        changed = true;
      }
    } else {
      const before = s.tasks.length;
      s.tasks = s.tasks.filter(t => !(matches(t) && !t.startedAt));
      changed = s.tasks.length !== before;
    }
    if(changed){ try{ await saveRound(r); }catch(e){} }
  }
}

/*
 * Technician-side push, the counterpart to syncExtraToLiveRounds above: when
 * a technician claims, cancels a claim on, finishes, or reopens ONE task,
 * mirror that same change into every OTHER technician's round covering the
 * same outlet today (matched by name+kind+pool, same key as the sync above).
 * This is what lets two technicians working the same outlet see each other's
 * claims live -- Kay claiming a job shows up as "Kay" on Fik's copy of that
 * outlet too, and Fik can't also claim it -- without merging their rounds
 * into one shared document. Only reaches a stop that hasn't been departed in
 * the OTHER round; a technician's own already-finished visit is never
 * rewritten by someone else's action elsewhere.
 */
async function syncTaskToOtherRounds(outlet, task, patch){
  const mine = myId(), today = todayKey();
  const matches = t => t.name === task.name && t.kind === task.kind && (t.pool||null) === (task.pool||null);
  const others = Object.values(state.rounds).filter(r => r.id !== mine && r.date === today);
  for(const orig of others){
    const r = clone(orig);
    const s = r.stops.find(x => x.outlet === outlet && !x.departAt);
    if(!s) continue;
    const t = s.tasks.find(matches);
    if(!t) continue;
    Object.assign(t, patch);
    try{ await saveRound(r); }catch(e){}
  }
}

// The must-do list and the shared optional pool of jobs aren't per-outlet, so a
// single edit (rename, delete, or a per-outlet toggle) can add/drop a job at
// several outlets at once. This diffs the config before vs. after an edit and
// pushes each individual add/remove into today's open rounds via the same
// function per-branch jobs use above, so shared-job edits get the same "takes
// effect immediately" treatment instead of only applying to rounds started
// later. For an outlet with physical pools, both the must-do list and any
// toggled "if time allows" job always apply to every pool, so the diff is
// expanded to one entry per pool -- matching how tasksFor() builds them.
function poolTasksFor(c, outletCode){
  const req = c.required.map(n => ({name:n, kind:"required"}));
  const opt = (c.assigned[outletCode] || []).map(n => ({name:n, kind:"optional"}));
  const flat = req.concat(opt);
  const pools = (OUTLETS.find(o => o.code===outletCode) || {}).pools;
  return pools ? pools.flatMap(p => flat.map(j => Object.assign({pool:p}, j))) : flat;
}
async function syncPoolChangeToLiveRounds(before, after){
  const key = j => j.kind+"|"+j.name+"|"+(j.pool||"");
  for(const o of OUTLETS){
    const b = poolTasksFor(before, o.code), a = poolTasksFor(after, o.code);
    const bKeys = new Set(b.map(key)), aKeys = new Set(a.map(key));
    for(const j of a){ if(!bKeys.has(key(j))) await syncExtraToLiveRounds(o.code, j, "add"); }
    for(const j of b){ if(!aKeys.has(key(j))) await syncExtraToLiveRounds(o.code, j, "remove"); }
  }
}

function arrive(code){
  const open = activeStop(myRound());
  if(open && open.outlet !== code){
    flash("You're still checked in at "+open.outlet+". Tap “Leave "+open.outlet+"” before arriving somewhere else.");
    return;
  }
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || s.arriveAt) return false;
    if(r.stops.some(x => x.arriveAt && !x.departAt)) return false;   // one outlet at a time
    s.arriveAt = new Date().toISOString();
    r.headingTo = null;   // "next" is resolved the moment you actually arrive somewhere
  }, "Couldn't record the arrival. Try again.").then(async () => {
    const fix = await getFix(); if(!fix) return;
    withRound(r => { const s = r.stops.find(x=>x.outlet===code); if(!s || s.fixIn) return false; s.fixIn = fix; });
  });
}
function depart(code){
  let autoClosed = [], stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || !s.arriveAt || s.departAt) return false;
    // Only auto-close jobs the departing technician themselves claimed. A
    // coworker also covering this outlet may still be mid-job on something
    // that got mirrored into this round too (see syncTaskToOtherRounds) --
    // leaving here must never silently finish someone else's still-running work.
    s.tasks.forEach(t => {
      if(t.startedAt && !t.doneAt && t.claimedBy === r.person){
        t.doneAt = new Date().toISOString();
        autoClosed.push({name:t.name, kind:t.kind, pool:t.pool||null, doneAt:t.doneAt});
      }
    });
    s.departAt = new Date().toISOString();
    stopOutlet = s.outlet;
  }, "Couldn't record the departure. Try again.").then(async () => {
    for(const task of autoClosed) await syncTaskToOtherRounds(stopOutlet, task, {doneAt:task.doneAt});
    const fix = await getFix(); if(!fix) return;
    withRound(r => { const s = r.stops.find(x=>x.outlet===code); if(!s || s.fixOut) return false; s.fixOut = fix; });
  });
}
function skipStop(code){ withRound(r => { r.stops = r.stops.filter(s => s.outlet !== code); if(r.headingTo === code) r.headingTo = null; }); }

// Lets a technician add an outlet to their own round after it's already
// started — e.g. another technician is stuck fixing something at their own
// pool and can't get to their assigned outlet, so someone else covers it
// instead. Reuses the same job list a fresh round would give that outlet
// (must-do, shared optional pool, any per-branch extras) and is tagged
// "covering" so the supervisor can tell it apart from the technician's
// originally-planned outlets, without this turning into an OT/payroll record —
// it's the same coverage visibility the rest of the app gives, just for a
// same-day reassignment instead of a full day.
function addOutlet(code, note){
  withRound(r => {
    if(r.stops.some(x => x.outlet === code)) return false;   // already on this round
    r.stops.push({outlet:code, arriveAt:null, departAt:null, fixIn:null, fixOut:null,
      covering:true, coveringNote:(note||"").trim().slice(0,200), tasks: seedTasksFor(code)});
  }, "Couldn't add that outlet. Try again.");
}

// Lets a technician add or edit a short free-text note on a covering stop —
// who they're covering for, why, anything worth a supervisor knowing later.
// Never required, and available any time the stop is still on the round,
// whether it's been visited yet or not.
function setCoveringNote(code, note){
  withRound(r => {
    const s = r.stops.find(x => x.outlet===code); if(!s || !s.covering) return false;
    s.coveringNote = (note||"").trim().slice(0,200);
  }, "Couldn't save that note. Try again.");
}

// Lets a technician flag which pool they're headed to next, once they've left
// a stop and before they've arrived anywhere new. Purely informational — it
// reorders this device's own list and lights up the Routes map, but never
// blocks arriving somewhere else instead if plans change; arriving anywhere
// resolves it either way (see arrive()). Tapping the already-picked outlet
// again clears it.
function setHeading(code){
  withRound(r => {
    if(activeStop(r)) return false;
    const s = r.stops.find(x => x.outlet===code);
    if(!s || s.arriveAt) return false;
    r.headingTo = (r.headingTo === code) ? null : code;
  }, "Couldn't save that. Try again.");
}

// Undo a mis-tapped arrival, while nothing has been claimed yet.
function unarrive(code){
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || !s.arriveAt || s.departAt) return false;
    if(s.tasks.some(t => t.startedAt)) return false;
    s.arriveAt = null; s.fixIn = null;
  }, "Couldn't undo that. Try again.");
}

// Reopens a stop that was already departed — for "Leave" tapped by mistake before
// a must-do job was even claimed, with no confirmation to catch it. Only the
// departure itself is undone: arrival time and any already-timed jobs are left
// exactly as they were, so nothing about the real work gets rewritten. Same
// one-outlet-at-a-time rule as arriving: blocked if a different stop is
// currently checked into.
function reopenStop(code){
  const open = activeStop(myRound());
  if(open && open.outlet !== code){
    flash("You're still checked in at "+open.outlet+". Leave there before reopening "+code+".");
    return;
  }
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || !s.departAt) return false;
    s.departAt = null; s.fixOut = null;
  }, "Couldn't reopen that. Try again.");
}

// Claiming stamps the technician's own name onto the job (t.claimedBy), then
// mirrors that claim into any other technician's round covering the same
// outlet today, so a coworker sees "Claimed by Kay" instead of a plain Open
// job they could also claim.
function claimTask(code, tid){
  const rt = runningTask(myRound());
  if(rt && rt.task.id !== tid){ flash("Finish “"+rt.task.name+"” first — one job at a time keeps the timings honest."); return; }
  let claimed = null, stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || t.startedAt) return false;
    if(!s.arriveAt){
      if(r.stops.some(x => x.arriveAt && !x.departAt)) return false;
      s.arriveAt = new Date().toISOString();
    }
    t.startedAt = new Date().toISOString();
    t.claimedBy = state.me;
    claimed = {name:t.name, kind:t.kind, pool:t.pool||null, startedAt:t.startedAt, claimedBy:t.claimedBy};
    stopOutlet = s.outlet;
  }, "Couldn't claim that job. Try again.").then(() => {
    if(claimed) syncTaskToOtherRounds(stopOutlet, claimed, {startedAt:claimed.startedAt, claimedBy:claimed.claimedBy});
  });
}
// The X shown next to a job the technician just claimed -- undoes an
// accidental claim immediately, no confirmation needed (unlike reopening a
// finished job below, this can only ever throw away a job that hasn't been
// worked on). Only the technician who claimed it can cancel it: a coworker
// seeing "Claimed by Kay" can't clear Kay's claim out from under her.
function cancelClaim(code, tid){
  let reset = null, stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || s.departAt) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || !t.startedAt || t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.startedAt = null; t.claimedBy = null;
    reset = {name:t.name, kind:t.kind, pool:t.pool||null};
    stopOutlet = s.outlet;
  }, "Couldn't undo that. Try again.").then(() => {
    if(reset) syncTaskToOtherRounds(stopOutlet, reset, {startedAt:null, claimedBy:null});
  });
}
// Tapping the technician's own name (shown on a running job) marks it done.
// Only the claimer can finish their own claimed job.
function finishTask(code, tid){
  let finished = null, stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || !t.startedAt || t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.doneAt = new Date().toISOString();
    finished = {name:t.name, kind:t.kind, pool:t.pool||null, doneAt:t.doneAt};
    stopOutlet = s.outlet;
  }, "Couldn't mark that done. Try again.").then(() => {
    if(finished) syncTaskToOtherRounds(stopOutlet, finished, {doneAt:finished.doneAt});
  });
}
// Reopens a job marked Done by mistake, back to Open (unclaimed) — start,
// finish, and claim are all cleared. It does NOT go back to "In Progress":
// keeping the old start time meant the elapsed timer kept counting from
// whenever it was first claimed (possibly hours earlier), and it also sat as
// the round's one "current" job, blocking every other job from being claimed
// until this one was re-finished. Resetting to Open avoids both — it can be
// re-claimed whenever, with an accurate fresh duration, and doesn't block
// other work in the meantime. The confirm step lives in the click handler (a
// native confirm() on the Done button), so only the claimer sees a clickable
// Done button to begin with.
function undoTask(code, tid){
  let reset = null, stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || s.departAt) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || !t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.startedAt = null;
    t.doneAt = null;
    t.claimedBy = null;
    reset = {name:t.name, kind:t.kind, pool:t.pool||null};
    stopOutlet = s.outlet;
  }, "Couldn't undo that. Try again.").then(() => {
    if(reset) syncTaskToOtherRounds(stopOutlet, reset, {startedAt:null, doneAt:null, claimedBy:null});
  });
}
function addTask(code, name){
  const n = (name||"").trim(); if(!n) return;
  state.adding = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    s.tasks.push({id:uid(), name:n, kind:"adhoc", startedAt:null, doneAt:null, claimedBy:null});
  }, "Couldn't add that job. Try again.");
}
function removeTask(code, tid){
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    s.tasks = s.tasks.filter(t => t.id !== tid || t.startedAt);
  });
}

/*
 * ================= issues =================
 * A separate track from the nightly checklist: something a technician
 * notices but can't fix on the spot (a broken instant heater, a cracked
 * tile) needs a supervisor to plan and schedule a real fix, not a checkbox.
 * Issues aren't tied to a single night's round -- they live in their own
 * collection, keyed to the outlet, and stay visible (Open -> Planned ->
 * Resolved) until someone actually closes them out, however many nights
 * that takes.
 */
const issueUid = () => "iss-"+Date.now().toString(36)+"-"+uid();
const PRIORITIES = ["low","medium","urgent"];

// Every not-yet-resolved issue logged against one outlet, most recent first --
// what a technician sees on that outlet's stop card (so they don't re-report
// something already flagged) and what feeds the outlet grid on Overview.
function openIssuesFor(outlet){
  return Object.values(state.issues).filter(i => i.outlet===outlet && i.status!=="resolved")
    .sort((a,b) => a.raisedAt < b.raisedAt ? 1 : -1);
}

// A technician flags a problem they can't fix themselves, right from the
// outlet stop they're standing at -- or a supervisor gets ahead of one,
// assigning a non-urgent task to an outlet before anyone's even reported it
// (see addIssueBlock, on Overview). Either way it starts life as "open" --
// unplanned, just on the board -- until a supervisor commits to a plan.
function reportIssue(outlet, description, priority, raisedBy){
  const desc = (description||"").trim().slice(0,500);
  if(!desc || !outlet) return;
  saveIssue({
    id: issueUid(), outlet, description: desc,
    priority: PRIORITIES.includes(priority) ? priority : "medium",
    status: "open",
    raisedBy: raisedBy || state.me || "Supervisor",
    raisedAt: new Date().toISOString(),
    assignee: null, targetDate: null, notes: "", resolvedAt: null
  });
}

// Supervisor commits to a plan: who's handling it and by when, with room for
// a running note (contractor booked, parts on order, etc). Re-saving an
// already-planned issue with new details is just editing the plan in place.
function planIssue(id, patch){
  const cur = state.issues[id]; if(!cur) return;
  const next = clone(cur);
  next.status = "planned";
  if(PRIORITIES.includes(patch.priority)) next.priority = patch.priority;
  next.assignee = (patch.assignee||"").trim().slice(0,60) || null;
  next.targetDate = patch.targetDate || null;
  next.notes = (patch.notes||"").trim().slice(0,500);
  saveIssue(next);
}

// Closes it out -- fixed, whether or not it was ever formally "planned" first
// (a quick fix doesn't need the full planning form).
function resolveIssue(id){
  const cur = state.issues[id]; if(!cur) return;
  const next = clone(cur);
  next.status = "resolved";
  next.resolvedAt = new Date().toISOString();
  saveIssue(next);
}

// Back onto the board if a "resolved" problem turns out not to have stuck,
// or a planned one needs to be pulled back to square one. Assignee/target
// date/notes are left as-is rather than wiped -- they're still useful
// history for whoever picks it up again.
function reopenIssue(id){
  const cur = state.issues[id]; if(!cur) return;
  const next = clone(cur);
  next.status = "open";
  next.resolvedAt = null;
  saveIssue(next);
}

/* ================= render ================= */
function render(){
  renderConn();
  $("#hdr-date").textContent = DAYNAME[operationalNow().getDay()]+" "+todayKey();
  $("#btn-tech").setAttribute("aria-pressed", state.role==="tech");
  $("#btn-overview").setAttribute("aria-pressed", state.role==="overview");
  $("#btn-mgr").setAttribute("aria-pressed", state.role==="mgr");
  $("#btn-routes").setAttribute("aria-pressed", state.role==="routes");
  // A small red count on the Overview tab itself -- so a supervisor glancing
  // at the nav bar (not even inside Overview yet) can tell something needs
  // planning, without having to check.
  const openIssueN = Object.values(state.issues).filter(i => i.status!=="resolved").length;
  $("#btn-overview").innerHTML = "Overview" + (openIssueN ? ` <span class="nav-badge">${openIssueN}</span>` : "");
  $("#view").innerHTML = state.role==="tech" ? techView()
    : state.role==="overview" ? overviewView()
    : state.role==="routes" ? routesView() : mgrView();
  wire();
}

/* ---------- technician ---------- */
function techView(){
  if(!state.me) return pickPerson();
  const r = myRound();
  return r ? runRound(r) : buildRound();
}

function pickPerson(){
  const opts = state.roster.map(n => '<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
  return `
  <div class="card" style="padding:20px">
    <div class="eyebrow">Step 1</div>
    <h2 class="sec" style="margin:6px 0 14px">Who's doing the round?</h2>
    <div class="stack">
      <select id="who"><option value="">Select your name…</option>${opts}</select>
      <button class="btn primary big" id="who-go">Continue</button>
      <p class="note">Your name is remembered on this phone, so you only pick it once.</p>
    </div>
  </div>
  ${rosterPanel()}`;
}

function buildRound(){
  const sel = state.picking || [];
  const pills = OUTLETS.map(o => {
    const extra = (state.cfg.assigned[o.code]||[]).length;
    const others = othersOn(o.code);
    const who = others.length ? `<span class="pill-who">${esc(others.join(", "))}</span>` : "";
    return `<button class="pill ${others.length?"pill-taken":""}" data-pick="${o.code}" aria-pressed="${sel.includes(o.code)}">
      ${esc(o.code)}<small>${extra ? "+"+extra+" job"+(extra>1?"s":"") : "&nbsp;"}</small>${who}</button>`;
  }).join("");
  const anyTaken = OUTLETS.some(o => othersOn(o.code).length);
  return `
  <div class="card" style="padding:20px">
    <div class="sec-head" style="margin-bottom:4px"><h2 class="sec">Today's round</h2><span class="eyebrow">${esc(state.me)}</span></div>
    <p class="note" style="margin:0 0 14px">Tap the outlets you're covering today, then Start round.${anyTaken ? " Outlets already picked up by someone else today are marked — you can still take them too." : ""}</p>
    <div class="pill-grid">${pills}</div>
    <div class="row-2" style="margin-top:16px">
      <button class="btn" id="pick-all" style="flex:1">Select all</button>
      <button class="btn" id="pick-none" style="flex:1">Clear</button>
    </div>
    <button class="btn primary big" id="start" style="margin-top:10px" ${sel.length?"":"disabled"}>
      Start round · ${sel.length} outlet${sel.length===1?"":"s"}</button>
    <p class="note" style="margin:12px 0 0">Each outlet comes with its job list. Nothing is timed until you claim a job.</p>
  </div>
  <button class="btn" id="switch-user" style="align-self:flex-start">Not ${esc(state.me)}?</button>`;
}

// The "heading to next?" pill picker, shown once a technician has left a stop
// and hasn't arrived anywhere new yet, for every outlet still remaining —
// even just one. With a single outlet left it's less about choosing between
// options and more about confirming "yes, travelling there now," which is
// exactly what lights up the dashed anticipated-route line on the
// supervisor's Routes map instead of leaving it a plain "still to visit" ring.
function headingPicker(r, pending){
  if(!pending.length) return "";
  const pills = pending.map(s =>
    `<button class="pill" data-heading="${esc(s.outlet)}" aria-pressed="${r.headingTo===s.outlet}">${esc(s.outlet)}</button>`
  ).join("");
  const prompt = pending.length === 1
    ? `Heading to ${esc(pending[0].outlet)}? <span class="muted">Optional — shows on the Routes map.</span>`
    : `Heading to next? <span class="muted">Optional — shows on the Routes map.</span>`;
  return `<div class="card" style="padding:14px">
    <p class="note" style="margin:0 0 8px">${prompt}</p>
    <div class="pill-grid">${pills}</div>
  </div>`;
}

// A same-day, last-minute outlet a technician wasn't originally assigned —
// covering for someone stuck elsewhere (fixing a pump, say) — added directly
// from their own round rather than needing the supervisor to set it up first.
function addOutletBlock(r){
  const available = OUTLETS.filter(o => !r.stops.some(s => s.outlet === o.code));
  if(!available.length) return "";
  if(!state.pickingExtra){
    return `<button class="btn" id="open-addoutlet" style="align-self:flex-start">+ Add outlet — covering for someone</button>`;
  }
  if(state.pickingExtraFor){
    const code = state.pickingExtraFor;
    return `<div class="card" style="padding:14px">
      <p class="note" style="margin:0 0 8px">Covering <strong>${esc(code)}</strong> — add a note? <span class="muted">Optional, e.g. who you're covering for.</span></p>
      <input type="text" id="coveringnote" placeholder="e.g. Covering for Fik — pump repair at DR" autocomplete="off" maxlength="200">
      <div class="row-2" style="margin-top:10px">
        <button class="btn primary sm" id="confirm-addoutlet" style="flex:1">Add ${esc(code)}</button>
        <button class="btn sm" id="back-addoutlet" style="flex:1">Back</button>
      </div>
    </div>`;
  }
  const pills = available.map(o => `<button class="pill" data-addoutlet="${o.code}">${esc(o.code)}</button>`).join("");
  return `<div class="card" style="padding:14px">
    <p class="note" style="margin:0 0 8px">Which pool are you covering tonight?</p>
    <div class="pill-grid">${pills}</div>
    <button class="btn sm" id="cancel-addoutlet" style="margin-top:10px">Cancel</button>
  </div>`;
}

// Shown on a covering stop's own card — the note can be added or edited at
// any point while it's still on the round, not just at the moment it's added
// (a technician may only think to note who/why after the fact).
function coveringNoteBlock(s){
  if(state.notingOutlet === s.outlet){
    return `<div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
      <input type="text" id="notenote" value="${esc(s.coveringNote||"")}" placeholder="e.g. Covering for Fik — pump repair at DR" autocomplete="off" maxlength="200">
      <div class="row-2">
        <button class="btn primary sm" data-savenote="${s.outlet}" style="flex:1">Save note</button>
        <button class="btn sm" data-cancelnote="${s.outlet}" style="flex:1">Cancel</button>
      </div>
    </div>`;
  }
  if(s.coveringNote){
    return `<p class="note" style="margin:6px 0 0">“${esc(s.coveringNote)}” <button class="link" data-asknote="${s.outlet}">edit</button></p>`;
  }
  return `<button class="link" data-asknote="${s.outlet}" style="align-self:flex-start;margin-top:4px">+ Add a note</button>`;
}

function runRound(r){
  const t = totals(r), cs = crewState(r);
  // Cards are shown in the order the round actually happened, not the fixed
  // reference order the outlets were originally picked in (r.stops keeps that
  // fixed order — a technician can arrive at their picked outlets in any
  // order). Visited/active stops are sorted by real arrival time; anything
  // not yet started is appended after — the declared "heading to" outlet
  // first, if one's been picked, then the rest in their original order.
  const visited = r.stops.filter(s => s.arriveAt).sort((a,b) => a.arriveAt < b.arriveAt ? -1 : 1);
  let pending = r.stops.filter(s => !s.arriveAt);
  if(r.headingTo){
    const hi = pending.findIndex(s => s.outlet === r.headingTo);
    if(hi > 0) pending = [pending[hi], ...pending.slice(0,hi), ...pending.slice(hi+1)];
  }
  const ordered = visited.concat(pending);
  let out = [], prev = null, shownGap = false;
  ordered.forEach(s => {
    if(prev && s.arriveAt){
      out.push(`<div class="travel-gap"><span>▼ travel ${dur(mins(prev,s.arriveAt))}</span><span class="ln"></span></div>`);
    } else if(prev && !s.arriveAt && cs.k==="travel" && !shownGap){
      out.push(`<div class="travel-gap"><span>▼ travelling ${liveDur(prev)}</span><span class="ln"></span></div>`);
      out.push(headingPicker(r, pending));
      shownGap = true;
    }
    const seqIdx = visited.indexOf(s);
    out.push(stopCard(s, seqIdx, r, s.outlet === r.headingTo));
    if(s.departAt) prev = s.departAt;
  });
  return `
  <div class="kpis trio">
    <div class="kpi"><div class="v">${t.done}<span style="font-size:15px;color:var(--ink-3)">/${t.total}</span></div><div class="k eyebrow">Outlets</div></div>
    <div class="kpi"><div class="v" style="color:var(--accent)">${t.tasksDone}</div><div class="k eyebrow">Jobs done</div></div>
    <div class="kpi"><div class="v" style="color:var(--travel)">${dur(t.travel)}</div><div class="k eyebrow">Travelling</div></div>
  </div>
  <div class="route">${out.join("")}</div>
  ${addOutletBlock(r)}
  <div class="row-2">
    <button class="btn" id="switch-user" style="flex:1">Not ${esc(state.me)}?</button>
    <button class="btn" id="reset-round" style="flex:1">Reset today's round</button>
  </div>`;
}

// Most stops are a flat job list. A stop whose tasks carry a `pool` (JE
// today) instead gets a heading above each pool's own 3 jobs, so a
// technician sees "JEIP1" once and reads straight down its jobs, rather
// than re-reading "JEIP1 — " on every single line in a list of 12.
function taskListHtml(s){
  if(!s.tasks.some(t => t.pool)) return s.tasks.map(t => taskRow(s,t)).join("");
  // Group strictly by pool rather than by adjacency in the array. A job added
  // mid-round -- a shared job toggled on, or an ad-hoc job for one pool -- is
  // pushed onto the END of an already-open round's task list (see
  // syncExtraToLiveRounds), not spliced back in next to its pool's other jobs,
  // so grouping can't assume same-pool tasks already sit together.
  const whole = [], byPool = new Map();
  s.tasks.forEach(t => {
    if(!t.pool){ whole.push(t); return; }
    if(!byPool.has(t.pool)) byPool.set(t.pool, []);
    byPool.get(t.pool).push(t);
  });
  // Each pool gets one of 4 colors, cycled in the order its jobs first show up,
  // so a technician can tell "am I still under JEIP1 or did I move to JEIP2"
  // at a glance instead of re-reading the heading text every time.
  let out = whole.map(t => taskRow(s,t)).join("");
  let ix = 0;
  for(const [pool, tasks] of byPool){
    out += `<div class="pool-head pool-c${(ix++ % 4) + 1}">${esc(pool)}</div>`;
    out += tasks.map(t => taskRow(s,t)).join("");
  }
  return out;
}

function taskRow(s, t){
  const running = t.startedAt && !t.doneAt, finished = !!t.doneAt;
  // A finished job whose claim is contradicted by another round's copy of
  // the same job can't be trusted as this round's alone to edit, no matter
  // whose name is on it here -- see conflictingTask.
  const conflict = finished ? conflictingTask(s.outlet, t) : null;
  // Whether the technician looking at this screen is the one who claimed it.
  // Only the claimer gets a live action button on their own claim; a
  // teammate at the same outlet sees who has it, but can't act on it.
  const mine = !!t.claimedBy && t.claimedBy === state.me && !conflict;
  const status = finished ? '<span class="tag st-done">Done</span>'
               : running  ? '<span class="tag st-prog">In Progress</span>'
                          : '<span class="tag st-open">Open</span>';
  const tag = t.kind==="required" ? '<span class="tag req">Must do</span>'
            : t.kind==="optional" ? '<span class="tag opt">If time allows</span>'
            : '<span class="tag add">Added</span>';
  let time = "", act = "", conflictNote = "";
  const key = s.outlet+"|"+t.id;
  const rangeOf = x => (x.startedAt && x.doneAt) ? `${clockOf(x.startedAt)}–${clockOf(x.doneAt)}` : "";
  const range = rangeOf(t);
  if(finished){
    if(mine){
      time = `<span class="task-time" style="color:var(--ok)">${dur(mins(t.startedAt,t.doneAt))}${range?" · "+range:""}</span>`;
    } else if(!conflict){
      // Someone else's finished job, no dispute: say who and when.
      time = `<span class="task-time muted">${t.claimedBy?esc(t.claimedBy)+" · ":""}${range||dur(mins(t.startedAt,t.doneAt))}</span>`;
    } else {
      // Conflicting copies: showing this round's own name/time next to it
      // would misattribute the other round's real timing to this one, so
      // just flag the dispute here -- both sides' details are in the note.
      time = `<span class="task-time muted">Disputed</span>`;
    }
    if(!s.departAt){
      // Tapping Done again is the reopen action -- a native confirm() prompt
      // guards it (wired in wire()), same two-step feel as before without a
      // second row of buttons crowding an already tight task row. A job
      // that isn't mine (including a conflicted one) renders as a plain,
      // greyed-out span -- same "Done" label, but visibly not a button and
      // wired to nothing, so it can't be mistaken for something tappable.
      act = mine
        ? `<button class="btn sm act done" data-taskreopen="${key}">Done</button>`
        : `<span class="btn sm act done locked" aria-hidden="true">Done</span>`;
    }
    if(conflict){
      const mineRange = range || dur(mins(t.startedAt,t.doneAt));
      const otherRange = rangeOf(conflict) || dur(mins(conflict.startedAt,conflict.doneAt));
