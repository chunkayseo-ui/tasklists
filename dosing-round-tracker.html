// A one-off alert (blocked action, save failure) — shown as a toast fixed to the
// bottom of the viewport so it's seen no matter where the page is scrolled to,
// with its own timer so an unrelated re-render can't wipe it out early.
let toastTimer = null;
function flash(msg){
  const el = $("#toast"); if(!el) return;
  el.innerHTML = '<div class="bubble" role="alert">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; }, 4500);
}
function renderConn(){
  const el = $("#conn"); if(!el) return;
  const pendingN = Object.keys(state.pending).length;
  if(state.dbTried && !state.db){
    el.innerHTML = '<div class="banner"><strong>Local mode.</strong> Shared storage isn\'t available in this view, so entries stay on this device and the supervisor board won\'t show other people.</div>';
  } else if(pendingN){
    const stuck = Object.values(state.pending).some(p => p.tries >= 3);
    el.innerHTML = '<div class="banner"><strong>'+(stuck?"Still trying to sync.":"Saving…")+'</strong> '
      + (stuck
        ? "Your change is kept on this phone, but hasn't reached the team yet — check your signal. It'll keep retrying on its own."
        : "This will only take a moment.")
      + '</div>';
  } else {
    el.innerHTML = "";
  }
}

/* ================= location (recorded, never blocking) ================= */
function getFix(){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(null);
    let settled=false; const done = v => { if(!settled){ settled=true; resolve(v); } };
    setTimeout(()=>done(null), 8000);
    navigator.geolocation.getCurrentPosition(
      p => done({lat:+p.coords.latitude.toFixed(5), lng:+p.coords.longitude.toFixed(5), acc:Math.round(p.coords.accuracy)}),
      () => done(null), {enableHighAccuracy:true, timeout:7500, maximumAge:20000});
  });
}

/* ================= round mechanics ================= */
function scheduledToday(){
  const d = operationalNow().getDay();
  const list = OUTLETS.filter(o => o.day === d).map(o => o.code);
  return list.length ? list : OUTLETS.map(o => o.code);
}
function tasksFor(outlet){
  // Most outlets are a single pool, so the branch's jobs apply as-is. An outlet
  // with named pools (JE today) needs the must-do list AND any shared "if time
  // allows" job repeated once per pool -- every physical pool needs its own
  // water test, its own vacuuming -- labelled with the pool it's for instead of
  // one task that doesn't say which of several physical pools it covers.
  const pools = (OUTLETS.find(o => o.code===outlet) || {}).pools;
  // One-time extras only feed NEW rounds on the day they were added — a last-minute
  // job shouldn't need to be remembered and removed by hand before the next visit.
  // Recurring extras can also be limited to specific nights (`days`) -- e.g. an
  // outlet that only needs an extra job on Fridays -- same as the shared
  // "if time allows" assignment below; no `days` (or an empty list) means every
  // night, same as before this existed.
  const today = todayKey(), dow = operationalNow().getDay();
  const onDay = e => !e.days || !e.days.length || e.days.includes(dow);
  const extraList = (state.cfg.extra[outlet] || []).filter(e => (!e.oneTime || e.addedDate === today) && onDay(e));
  const asgNames = assignedFor(outlet, dow);
  const issueTasks = issueTasksFor(outlet);

  if(!pools){
    const req = state.cfg.required.map(n => ({id:uid(), name:n, kind:"required", startedAt:null, doneAt:null, claimedBy:null}));
    const asg = asgNames.map(n => ({id:uid(), name:n, kind:"optional", startedAt:null, doneAt:null, claimedBy:null}));
    const ex  = extraList.map(e => ({id:uid(), name:e.name, kind:e.kind==="required"?"required":"optional", startedAt:null, doneAt:null, claimedBy:null, addedBy:e.addedBy||null}));
    return req.concat(asg).concat(ex).concat(issueTasks);
  }

  // A pooled outlet can also get an ad-hoc job that isn't tied to any one pool
  // (e.g. "restock chemical shed") — those are added with no e.pool and are
  // listed first, unheaded, same as the flat list above. Every pool-tagged job
  // (required, shared "if time allows", and any extra added for that specific
  // pool) is then grouped together in pool order, so each pool's jobs land
  // under exactly one heading instead of getting split if an ad-hoc job for
  // that pool was added after the standing ones.
  const wholeOutlet = extraList
    .filter(e => !e.pool)
    .map(e => ({id:uid(), name:e.name, kind:e.kind==="required"?"required":"optional", startedAt:null, doneAt:null, claimedBy:null, addedBy:e.addedBy||null}));
  const perPool = pools.flatMap(p => {
    const req = state.cfg.required.map(n => ({id:uid(), name:n, pool:p, kind:"required", startedAt:null, doneAt:null, claimedBy:null}));
    const asg = asgNames.map(n => ({id:uid(), name:n, pool:p, kind:"optional", startedAt:null, doneAt:null, claimedBy:null}));
    const ex  = extraList.filter(e => e.pool === p)
      .map(e => ({id:uid(), name:e.name, pool:p, kind:e.kind==="required"?"required":"optional", startedAt:null, doneAt:null, claimedBy:null, addedBy:e.addedBy||null}));
    return req.concat(asg).concat(ex);
  });
  return wholeOutlet.concat(issueTasks).concat(perPool);
}

// A technician can pick an outlet someone else is already covering today (see
// othersOn, which highlights this on the outlet picker), add one mid-round to
// cover for a teammate, or simply be the second (or third) person to reach an
// outlet someone else already finished and left earlier the same day. In
// every case, if a job there has already been claimed, started or finished,
// the fresh copy this technician gets must start from that real state -- not
// blank. This isn't just a display nicety: a must-do job here is a physical
// dosing action (chlorine, acid), and a technician whose screen wrongly shows
// it as Open has every reason to do it again, stacking a second real dose on
// top of one already given. So this looks at EVERY one of today's visits to
// this outlet -- departed or still active -- not only a currently-active one,
// and for each job takes whichever visit got furthest with it (done beats
// started beats untouched). "Today" already accounts for a technician
// arriving after midnight (see DAY_CUTOFF_HOUR/todayKey) -- a 1am arrival is
// still the same operational day as the evening before, so it still finds an
// earlier visit correctly. tasksFor() gives the canonical job list (ids,
// pools); this overlays whatever progress has already happened, matched the
// same way syncTaskToOtherRounds matches tasks, so every copy agrees from the
// moment this one is created.
function seedTasksFor(outlet){
  const fresh = tasksFor(outlet);
  const today = todayKey();
  const stops = [];
  Object.values(state.rounds).forEach(r => {
    if(r.date !== today || !r.stops) return;
    const s = r.stops.find(x => x.outlet === outlet);
    if(s) stops.push(s);
  });
  if(!stops.length) return fresh;
  const rank = m => m.doneAt ? 2 : (m.startedAt ? 1 : 0);
  return fresh.map(t => {
    let best = null;
    for(const s of stops){
      const m = s.tasks.find(x => x.name === t.name && x.kind === t.kind && (x.pool||null) === (t.pool||null));
      if(m && (!best || rank(m) > rank(best))) best = m;
    }
    if(!best) return t;
    // Carry the water-test reading, the measured dose and the planned dose
    // across too -- a later arrival's Manual Dosing job must show what was
    // already dosed (and what the plan was), not just a bare "Done".
    const carried = {claimedBy: best.claimedBy||null, startedAt: best.startedAt||null, doneAt: best.doneAt||null};
    ["reading","dosed","plannedDose"].forEach(k => { if(best[k]) carried[k] = best[k]; });
    return Object.assign({}, t, carried);
  });
}

// Drops one-time extras whose day has passed, so the supervisor never has to
// remember to remove a last-minute job manually. Recurring extras (oneTime
// false/undefined) and today's one-time extras are left untouched.
function pruneExpiredExtras(extra){
  const today = todayKey();
  const out = {}; let changed = false;
  Object.keys(extra||{}).forEach(outlet => {
    const list = extra[outlet] || [];
    const kept = list.filter(e => !e.oneTime || e.addedDate === today);
    if(kept.length !== list.length) changed = true;
    if(kept.length) out[outlet] = kept;
  });
  return {extra: out, changed};
}

// Repairs a round saved by an earlier version of the app (before jobs existed —
// stops only had chlorine/pH fields). Without this, one old round can throw on
// render and stall the whole page for whoever it belongs to. Never destructive:
// arrival/departure times are kept; a missing job list is filled in fresh.
function normalizeRound(r){
  if(!r || !Array.isArray(r.stops)) return r;
  if(r.headingTo === undefined) r.headingTo = null;
  r.stops = r.stops.map(s => Object.assign(
    {outlet:s.outlet, arriveAt:null, departAt:null, fixIn:null, fixOut:null, covering:false, coveringNote:""},
    s,
    {tasks: (Array.isArray(s.tasks) ? s.tasks : tasksFor(s.outlet)).map(t =>
      // Rounds saved before per-technician claiming existed have no
      // `claimedBy`. A task that was already started under the old
      // single-technician-per-round model was implicitly "claimed" by the
      // round's own owner, so that's the safe default to backfill -- an
      // untouched (never-started) task just gets an explicit null.
      Object.assign({claimedBy: t.startedAt ? r.person : null}, t))}
  ));
  return r;
}
function normalizeRounds(map){ Object.keys(map).forEach(k => normalizeRound(map[k])); return map; }

/*
 * The live subscription only tracks TODAY's rounds (so "Crew right now" stays fast
 * and cheap). A past day is fetched once, on demand, and cached — nothing is lost,
 * it just isn't loaded until the supervisor asks to see it.
 */
function roundsForDate(date){
  if(date === todayKey() || !state.db) return Object.values(state.rounds).filter(r => r.date === date);
  const c = state.historyCache[date];
  return (c && c.rounds) ? c.rounds : [];
}
async function loadHistory(date){
  if(date === todayKey() || !state.db) return;
  if(state.historyCache[date]) return;   // already loaded or in flight
  state.historyCache[date] = {rounds:[], loading:true};
  render();
  try{
    const snap = await state.db.collection("dosing_rounds").where("date","==",date).get();
    const rounds = snap.docs.map(d => normalizeRound(clone(Object.assign({id:d.id}, d.data()))));
    state.historyCache[date] = {rounds, loading:false};
  } catch(e){
    state.historyCache[date] = {rounds:[], loading:false, error:true};
  }
  render();
}
function activeStop(r){ return r ? r.stops.find(s => s.arriveAt && !s.departAt) : null; }
function nextStop(r){ return r ? r.stops.find(s => !s.arriveAt) : null; }
function lastDeparture(r){ const d = r ? r.stops.filter(s=>s.departAt) : []; return d.length ? d[d.length-1].departAt : null; }
// The task THIS round's own owner currently has running -- not just any task
// that happens to be mid-claim in r.stops. Two technicians can now cover the
// same outlet, and a claim either of them makes gets mirrored into the
// other's round too (see syncTaskToOtherRounds) so they can each see it's
// taken; without the claimedBy check here, a teammate's claim showing up in
// my own round would look like MY current job and wrongly block me from
// claiming something else of my own.
function runningTask(r){
  if(!r) return null;
  for(const s of r.stops){ const t = s.tasks.find(x => x.startedAt && !x.doneAt && x.claimedBy === r.person); if(t) return {stop:s, task:t}; }
  return null;
}
function crewState(r){
  if(!r || !r.stops.some(s => s.arriveAt)) return {k:"idle", label:"Not started"};
  const a = activeStop(r);
  if(a){
    const rt = a.tasks.find(t => t.startedAt && !t.doneAt && t.claimedBy === r.person);
    const aLabel = stopLabel(a);
    return {k:"onsite", label: rt ? aLabel+" · "+rt.name : "At "+aLabel, since: rt ? rt.startedAt : a.arriveAt};
  }
  const upNext = nextStop(r);
  if(upNext){
    // Show where they're headed, not just "Travelling" -- Chun Kay wants a
    // supervisor glancing at the crew list to see the destination without
    // opening the technician's route. r.headingTo is the outlet they've
    // explicitly tapped as next (see the pill buttons in stopCard); if they
    // haven't picked one yet, fall back to the next stop in their original
    // pick order, same as the route view's own default ordering.
    const destStop = (r.headingTo && r.stops.find(s => s.outlet === r.headingTo)) || upNext;
    return {k:"travel", label:"Travelling to "+stopLabel(destStop), since:lastDeparture(r)};
  }
  return {k:"done", label:"Round complete"};
}
function totals(r){
  let on=0, tr=0, prev=null;
  const tdone = r.stops.reduce((n,s) => n + s.tasks.filter(t => t.doneAt).length, 0);
  // r.stops keeps the order outlets were PICKED at the start of the round, not
  // the order they were actually visited -- a technician can tap Arrive on any
  // of their selected outlets in any order (see routeCard's own `visited`
  // sort, which this must match). Walking r.stops in its stored order paired
  // up whichever stop happened to sit next to another in that list, not the
  // stop actually visited right before it -- producing travel gaps between
  // outlets that were nowhere near each other in time, and a whole-round total
  // that didn't match the sum of the real leg-by-leg gaps shown elsewhere.
  const chron = r.stops.filter(s => s.arriveAt).sort((a,b) => a.arriveAt < b.arriveAt ? -1 : 1);
  chron.forEach(s => {
    if(prev) tr += mins(prev, s.arriveAt);
    if(s.departAt){ on += mins(s.arriveAt, s.departAt); prev = s.departAt; } else prev = null;
  });
  return {onSite:on, travel:tr, done:r.stops.filter(s=>s.departAt).length, total:r.stops.length, tasksDone:tdone};
}
function requiredLeft(s){ return s.tasks.filter(t => t.kind==="required" && !t.doneAt).length; }

async function startRound(codes){
  state.picking = null;
  await saveRound({
    id: myId(), date: todayKey(), person: state.me, personSlug: slug(state.me),
    createdAt: new Date().toISOString(), headingTo: null,
    stops: codes.map(c => ({outlet:c, arriveAt:null, departAt:null, fixIn:null, fixOut:null, tasks: seedTasksFor(c)}))
  });
}
function withRound(fn, errMsg){
  return (async () => {
    try{
      const r = clone(myRound() || {}); if(!r.stops) return;
      const changed = fn(r); if(changed === false) return;
      await saveRound(r);
    } catch(e){ flash(errMsg || "Something didn't save. Try again."); }
  })();
}

/*
 * Supervisor-side push: whenever Job Setup changes what an outlet's job list
 * should look like — a per-branch job added/removed, a shared job toggled
 * on/off for that outlet, or the must-do/optional master lists edited —
 * reach into any of TODAY's rounds that still have that outlet open (not yet
 * departed) and add/remove the matching task there too, so nothing has to
 * wait for the next round to be noticed. A job the technician has already
 * started or finished is never touched, so nobody's real timing data gets
 * rewritten out from under them.
 */
// job may carry a `pool` field (the physical pool it's tagged to, e.g. "JEIP1")
// -- add/remove matches on name+kind+pool so a job scoped to one pool never
// touches another pool's identical-looking task.
async function syncExtraToLiveRounds(outlet, job, action){
  const today = todayKey();
  const jobs = Object.values(state.rounds).filter(r => r.date === today);
  const matches = t => t.name === job.name && t.kind === job.kind && (t.pool||null) === (job.pool||null);
  for(const orig of jobs){
    const r = clone(orig);
    const s = r.stops.find(x => x.outlet === outlet && !x.departAt);
    if(!s) continue;
    let changed = false;
    if(action === "add"){
      if(!s.tasks.some(matches)){
        s.tasks.push(Object.assign({id:uid(), name:job.name, kind:job.kind, startedAt:null, doneAt:null, claimedBy:null, addedBy:job.addedBy||null}, job.pool ? {pool:job.pool} : {}));
        changed = true;
      }
    } else {
      const before = s.tasks.length;
      s.tasks = s.tasks.filter(t => !(matches(t) && !t.startedAt));
      changed = s.tasks.length !== before;
    }
    if(changed){ try{ await saveRound(r); }catch(e){} }
  }
}

/*
 * Technician-side push, the counterpart to syncExtraToLiveRounds above: when
 * a technician claims, cancels a claim on, finishes, or reopens ONE task,
 * mirror that same change into every OTHER technician's round covering the
 * same outlet today (matched by name+kind+pool, same key as the sync above).
 * This is what lets two technicians working the same outlet see each other's
 * claims live -- Kay claiming a job shows up as "Kay" on Fik's copy of that
 * outlet too, and Fik can't also claim it -- without merging their rounds
 * into one shared document. Only reaches a stop that hasn't been departed in
 * the OTHER round; a technician's own already-finished visit is never
 * rewritten by someone else's action elsewhere.
 */
async function syncTaskToOtherRounds(outlet, task, patch){
  const mine = myId(), today = todayKey();
  const matches = t => t.name === task.name && t.kind === task.kind && (t.pool||null) === (task.pool||null);
  const others = Object.values(state.rounds).filter(r => r.id !== mine && r.date === today);
  for(const orig of others){
    const r = clone(orig);
    const s = r.stops.find(x => x.outlet === outlet && !x.departAt);
    if(!s) continue;
    const t = s.tasks.find(matches);
    if(!t) continue;
    Object.assign(t, patch);
    try{ await saveRound(r); }catch(e){}
  }
}

// The must-do list and the shared optional pool of jobs aren't per-outlet, so a
// single edit (rename, delete, or a per-outlet toggle) can add/drop a job at
// several outlets at once. This diffs the config before vs. after an edit and
// pushes each individual add/remove into today's open rounds via the same
// function per-branch jobs use above, so shared-job edits get the same "takes
// effect immediately" treatment instead of only applying to rounds started
// later. For an outlet with physical pools, both the must-do list and any
// toggled "if time allows" job always apply to every pool, so the diff is
// expanded to one entry per pool -- matching how tasksFor() builds them.
function poolTasksFor(c, outletCode){
  // Only today's day-of-week assignment can be "live" in an open round, so
  // that's what a before/after diff needs to compare -- an edit to some other
  // day's list shouldn't touch tonight's round at all.
  const dow = operationalNow().getDay();
  const req = c.required.map(n => ({name:n, kind:"required"}));
  const opt = ((c.assigned[outletCode] || {})[dow] || []).map(n => ({name:n, kind:"optional"}));
  const flat = req.concat(opt);
  const pools = (OUTLETS.find(o => o.code===outletCode) || {}).pools;
  return pools ? pools.flatMap(p => flat.map(j => Object.assign({pool:p}, j))) : flat;
}
async function syncPoolChangeToLiveRounds(before, after){
  const key = j => j.kind+"|"+j.name+"|"+(j.pool||"");
  for(const o of OUTLETS){
    const b = poolTasksFor(before, o.code), a = poolTasksFor(after, o.code);
    const bKeys = new Set(b.map(key)), aKeys = new Set(a.map(key));
    for(const j of a){ if(!bKeys.has(key(j))) await syncExtraToLiveRounds(o.code, j, "add"); }
    for(const j of b){ if(!aKeys.has(key(j))) await syncExtraToLiveRounds(o.code, j, "remove"); }
  }
}

function arrive(code){
  const open = activeStop(myRound());
  if(open && open.outlet !== code){
    flash("You're still checked in at "+open.outlet+". Tap “Leave "+open.outlet+"” before arriving somewhere else.");
    return;
  }
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || s.arriveAt) return false;
    if(r.stops.some(x => x.arriveAt && !x.departAt)) return false;   // one outlet at a time
    s.arriveAt = new Date().toISOString();
    r.headingTo = null;   // "next" is resolved the moment you actually arrive somewhere
  }, "Couldn't record the arrival. Try again.").then(async () => {
    const fix = await getFix(); if(!fix) return;
    withRound(r => { const s = r.stops.find(x=>x.outlet===code); if(!s || s.fixIn) return false; s.fixIn = fix; });
  });
}
function depart(code){
  let autoClosed = [], stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || !s.arriveAt || s.departAt) return false;
    // Only auto-close jobs the departing technician themselves claimed. A
    // coworker also covering this outlet may still be mid-job on something
    // that got mirrored into this round too (see syncTaskToOtherRounds) --
    // leaving here must never silently finish someone else's still-running work.
    s.tasks.forEach(t => {
      if(t.startedAt && !t.doneAt && t.claimedBy === r.person){
        t.doneAt = new Date().toISOString();
        autoClosed.push({name:t.name, kind:t.kind, pool:t.pool||null, doneAt:t.doneAt});
      }
    });
    s.departAt = new Date().toISOString();
    stopOutlet = s.outlet;
  }, "Couldn't record the departure. Try again.").then(async () => {
    for(const task of autoClosed) await syncTaskToOtherRounds(stopOutlet, task, {doneAt:task.doneAt});
    const fix = await getFix(); if(!fix) return;
    withRound(r => { const s = r.stops.find(x=>x.outlet===code); if(!s || s.fixOut) return false; s.fixOut = fix; });
  });
}
function skipStop(code){ withRound(r => { r.stops = r.stops.filter(s => s.outlet !== code); if(r.headingTo === code) r.headingTo = null; }); }

// Lets a technician add an outlet to their own round after it's already
// started — e.g. another technician is stuck fixing something at their own
// pool and can't get to their assigned outlet, so someone else covers it
// instead. Reuses the same job list a fresh round would give that outlet
// (must-do, shared optional pool, any per-branch extras) and is tagged
// "covering" so the supervisor can tell it apart from the technician's
// originally-planned outlets, without this turning into an OT/payroll record —
// it's the same coverage visibility the rest of the app gives, just for a
// same-day reassignment instead of a full day.
function addOutlet(code, note){
  withRound(r => {
    if(r.stops.some(x => x.outlet === code)) return false;   // already on this round
    r.stops.push({outlet:code, arriveAt:null, departAt:null, fixIn:null, fixOut:null,
      covering:true, coveringNote:(note||"").trim().slice(0,200), tasks: seedTasksFor(code)});
  }, "Couldn't add that outlet. Try again.");
}

// Lets a technician add an unplanned stop of their own to tonight's round —
// a hardware shop, the office, anywhere that isn't one of the ten pool
// branches — between two real stops. Unlike addOutlet above (a known pool
// picked from a fixed list) this is a free-text place with no ready-made
// coordinates, so it gets a synthetic id (never collides with a real
// outlet code) and its own lat/lng filled in afterwards by geocodeAndSave,
// once we know Singapore's OneMap can find it. No job list — there's
// nothing to dose or vacuum at a hardware shop — just why they went.
function addCustomStop(name, address, postal, remark){
  name = (name||"").trim().slice(0,80);
  if(!name) { flash("Give this stop a name."); return; }
  const code = "CUSTOM-"+uid();
  const stop = {outlet:code, custom:true,
    customName:name, customAddress:(address||"").trim().slice(0,200),
    customPostal:(postal||"").trim().slice(0,10), customRemark:(remark||"").trim().slice(0,200),
    lat:null, lng:null, geoFailed:false,
    arriveAt:null, departAt:null, fixIn:null, fixOut:null, tasks:[]};
  state.addingCustomStop = false;
  withRound(r => { r.stops.push(stop); }, "Couldn't add that stop. Try again.")
    .then(() => geocodeAndSave(code, stop));
}

// Singapore-only geocoding via OneMap's public search API (no key needed,
// free, and it's what every address/postal-code field in this app already
// implicitly assumes given the ten branches are all Singapore addresses).
// Tries the postal code first (most reliable when given), then the address
// text, then the place name as a last resort -- returns the first hit that
// actually parses to a coordinate, or null if nothing was found/reachable.
async function geocodeSG(query){
  if(!query || !query.trim()) return null;
  try{
    const url = "https://www.onemap.gov.sg/api/common/elastic/search?searchVal="
      + encodeURIComponent(query.trim()) + "&returnGeom=Y&getAddrDetails=Y&pageNum=1";
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const hit = data && Array.isArray(data.results) && data.results[0];
    if(!hit) return null;
    const lat = parseFloat(hit.LATITUDE), lng = parseFloat(hit.LONGITUDE);
    return (isFinite(lat) && isFinite(lng)) ? {lat, lng} : null;
  } catch(e){ return null; }
}
async function geocodeCustomStop(s){
  const postal = (s.customPostal||"").trim();
  const queries = [];
  if(/^\d{6}$/.test(postal)) queries.push(postal);
  if(s.customAddress) queries.push(s.customAddress);
  if(s.customName) queries.push(s.customName + " Singapore");
  for(const q of queries){
    const pt = await geocodeSG(q);
    if(pt) return pt;
  }
  return null;
}
// Runs after the stop is already saved and visible, so a slow or failed
// lookup never blocks the technician from moving on -- it just quietly
// patches the map pin in once (or if) a coordinate is found. Marked
// geoFailed on a miss so the stop card can offer a manual retry instead of
// silently never showing on the Routes map with no explanation.
async function geocodeAndSave(code, stopSeed){
  const pt = await geocodeCustomStop(stopSeed);
  withRound(r => {
    const s = r.stops.find(x => x.outlet === code); if(!s) return false;
    if(pt){ s.lat = pt.lat; s.lng = pt.lng; s.geoFailed = false; }
    else s.geoFailed = true;
  });
}
function retryGeocodeStop(code){
  const r = myRound(); const s = r && r.stops.find(x => x.outlet === code);
  if(!s) return;
  withRound(r2 => { const s2 = r2.stops.find(x=>x.outlet===code); if(!s2) return false; s2.geoFailed = false; })
    .then(() => geocodeAndSave(code, s));
}

// Lets a technician add or edit a short free-text note on a covering stop —
// who they're covering for, why, anything worth a supervisor knowing later.
// Never required, and available any time the stop is still on the round,
// whether it's been visited yet or not.
function setCoveringNote(code, note){
  withRound(r => {
    const s = r.stops.find(x => x.outlet===code); if(!s || !s.covering) return false;
    s.coveringNote = (note||"").trim().slice(0,200);
  }, "Couldn't save that note. Try again.");
}

// Lets a technician flag which pool they're headed to next, once they've left
// a stop and before they've arrived anywhere new. Purely informational — it
// reorders this device's own list and lights up the Routes map, but never
// blocks arriving somewhere else instead if plans change; arriving anywhere
// resolves it either way (see arrive()). Tapping the already-picked outlet
// again clears it.
function setHeading(code){
  withRound(r => {
    if(activeStop(r)) return false;
    const s = r.stops.find(x => x.outlet===code);
    if(!s || s.arriveAt) return false;
    r.headingTo = (r.headingTo === code) ? null : code;
  }, "Couldn't save that. Try again.");
}

// Undo a mis-tapped arrival, while nothing has been claimed yet.
function unarrive(code){
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || !s.arriveAt || s.departAt) return false;
    if(s.tasks.some(t => t.startedAt)) return false;
    s.arriveAt = null; s.fixIn = null;
  }, "Couldn't undo that. Try again.");
}

// Reopens a stop that was already departed — for "Leave" tapped by mistake before
// a must-do job was even claimed, with no confirmation to catch it. Only the
// departure itself is undone: arrival time and any already-timed jobs are left
// exactly as they were, so nothing about the real work gets rewritten. Same
// one-outlet-at-a-time rule as arriving: blocked if a different stop is
// currently checked into.
function reopenStop(code){
  const open = activeStop(myRound());
  if(open && open.outlet !== code){
    flash("You're still checked in at "+open.outlet+". Leave there before reopening "+code+".");
    return;
  }
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || !s.departAt) return false;
    s.departAt = null; s.fixOut = null;
  }, "Couldn't reopen that. Try again.");
}

// Claiming stamps the technician's own name onto the job (t.claimedBy), then
// mirrors that claim into any other technician's round covering the same
// outlet today, so a coworker sees "Claimed by Kay" instead of a plain Open
// job they could also claim.
function claimTask(code, tid){
  const rt = runningTask(myRound());
  if(rt && rt.task.id !== tid){ flash("Finish “"+rt.task.name+"” first — one job at a time keeps the timings honest."); return; }
  let claimed = null, stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || t.startedAt) return false;
    if(!s.arriveAt){
      if(r.stops.some(x => x.arriveAt && !x.departAt)) return false;
      s.arriveAt = new Date().toISOString();
    }
    t.startedAt = new Date().toISOString();
    t.claimedBy = state.me;
    claimed = {name:t.name, kind:t.kind, pool:t.pool||null, startedAt:t.startedAt, claimedBy:t.claimedBy};
    stopOutlet = s.outlet;
  }, "Couldn't claim that job. Try again.").then(() => {
    if(claimed) syncTaskToOtherRounds(stopOutlet, claimed, {startedAt:claimed.startedAt, claimedBy:claimed.claimedBy});
  });
}
// The X shown next to a job the technician just claimed -- undoes an
// accidental claim immediately, no confirmation needed (unlike reopening a
// finished job below, this can only ever throw away a job that hasn't been
// worked on). Only the technician who claimed it can cancel it: a coworker
// seeing "Claimed by Kay" can't clear Kay's claim out from under her.
function cancelClaim(code, tid){
  let reset = null, stopOutlet = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || s.departAt) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || !t.startedAt || t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.startedAt = null; t.claimedBy = null;
    reset = {name:t.name, kind:t.kind, pool:t.pool||null};
    stopOutlet = s.outlet;
  }, "Couldn't undo that. Try again.").then(() => {
    if(reset) syncTaskToOtherRounds(stopOutlet, reset, {startedAt:null, claimedBy:null});
  });
}
// Tapping the technician's own name (shown on a running job) marks it done.
// Only the claimer can finish their own claimed job.
function finishTask(code, tid){
  // A water-test job finishes through its reading panel, so the FC/pH and
  // the dose come with it -- tapping the name button just says so. Only once
  // the dosing table is actually here, though: if it couldn't be loaded (no
  // signal in the plant room) or hasn't arrived yet, a plain finish is still
  // allowed rather than trapping the technician behind a spinner.
  const r0 = myRound(), s0 = r0 && r0.stops.find(x => x.outlet === code), t0 = s0 && s0.tasks.find(x => x.id === tid);
  if(t0 && isWaterTestTask(t0) && t0.claimedBy === state.me && dosingData.tables){
    const w = wtState(code+"|"+tid);
    if(w.fc === null || w.ph === null){ flash("Enter the water test reading below first — tap FC and pH, then Save."); return; }
    finishWaterTest(code, tid); return;
  }
  if(t0 && isDosingTask(t0) && t0.claimedBy === state.me){
    const d = dmState(code+"|"+tid, t0);
    if(d.chlorine === "" || isNaN(Number(d.chlorine))){ flash("Enter the chlorine measured below first, then Save."); return; }
    finishDosing(code, tid); return;
  }
  let finished = null, stopOutlet = null, issueId = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || !t.startedAt || t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.doneAt = new Date().toISOString();
    finished = {name:t.name, kind:t.kind, pool:t.pool||null, doneAt:t.doneAt};
    stopOutlet = s.outlet;
    issueId = t.issueId || null;
  }, "Couldn't mark that done. Try again.").then(() => {
    if(finished) syncTaskToOtherRounds(stopOutlet, finished, {doneAt:finished.doneAt});
    // A job that started life as a reported issue closes the loop on the
    // Overview board the moment it's actually finished — no separate
    // "mark resolved" step for the supervisor to remember.
    if(issueId) resolveIssue(issueId);
  });
}
// Reopens a job marked Done by mistake, back to Open (unclaimed) — start,
// finish, and claim are all cleared. It does NOT go back to "In Progress":
// keeping the old start time meant the elapsed timer kept counting from
// whenever it was first claimed (possibly hours earlier), and it also sat as
// the round's one "current" job, blocking every other job from being claimed
// until this one was re-finished. Resetting to Open avoids both — it can be
// re-claimed whenever, with an accurate fresh duration, and doesn't block
// other work in the meantime. The confirm step lives in the click handler (a
// native confirm() on the Done button), so only the claimer sees a clickable
// Done button to begin with.
function undoTask(code, tid){
  let reset = null, stopOutlet = null, issueId = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s || s.departAt) return false;
    const t = s.tasks.find(x=>x.id===tid); if(!t || !t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.startedAt = null;
    t.doneAt = null;
    t.claimedBy = null;
    reset = {name:t.name, kind:t.kind, pool:t.pool||null};
    stopOutlet = s.outlet;
    issueId = t.issueId || null;
  }, "Couldn't undo that. Try again.").then(() => {
    if(reset) syncTaskToOtherRounds(stopOutlet, reset, {startedAt:null, doneAt:null, claimedBy:null});
    // Mirror finishTask's auto-resolve: reopening a job that was actually a
    // converted issue puts the issue back on the board too, so the two never
    // fall out of sync (a "Resolved" issue whose job is Open again would be
    // misleading either way).
    if(issueId) reopenIssue(issueId);
  });
}
// A quick on-site job ("+ Add another job") used to stay private to whoever
// added it -- a teammate already covering the same outlet right now had no
// way to know about it, unlike a formally reported issue (always visible
// outlet-wide) or a supervisor's Task Setting extra (already pushed live).
// Reuses syncExtraToLiveRounds, which already does exactly this: push into
// any other round already open for this outlet today that hasn't departed,
// matched by name+kind so it's never duplicated.
function addTask(code, name){
  const n = (name||"").trim(); if(!n) return;
  state.adding = null;
  // Who typed this in matters even before anyone claims it -- a supervisor
  // (or a teammate sharing the outlet) seeing an unclaimed ad-hoc job has no
  // other way to ask "what's this for?" until it's shown on-screen.
  const addedBy = state.me || null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    s.tasks.push({id:uid(), name:n, kind:"adhoc", startedAt:null, doneAt:null, claimedBy:null, addedBy});
  }, "Couldn't add that job. Try again.").then(() => {
    syncExtraToLiveRounds(code, {name:n, kind:"adhoc", addedBy}, "add");
  });
}
function removeTask(code, tid){
  let removedName = null;
  withRound(r => {
    const s = r.stops.find(x=>x.outlet===code); if(!s) return false;
    const t = s.tasks.find(x=>x.id===tid);
    if(t && !t.startedAt) removedName = t.name;
    s.tasks = s.tasks.filter(t => t.id !== tid || t.startedAt);
  }).then(() => {
    // Only an unstarted job was actually removable above -- mirror that same
    // removal into a teammate's copy so a mistaken add doesn't linger there.
    if(removedName) syncExtraToLiveRounds(code, {name:removedName, kind:"adhoc"}, "remove");
  });
}

/*
 * ================= issues =================
 * A separate track from the nightly checklist: something a technician
 * notices but can't fix on the spot (a broken instant heater, a cracked
 * tile) needs a supervisor to plan and schedule a real fix, not a checkbox.
 * Issues aren't tied to a single night's round -- they live in their own
 * collection, keyed to the outlet, and stay visible (Open -> Planned ->
 * Resolved) until someone actually closes them out, however many nights
 * that takes.
 */
const issueUid = () => "iss-"+Date.now().toString(36)+"-"+uid();
const PRIORITIES = ["low","medium","urgent"];

// Every not-yet-resolved issue logged against one outlet, most recent first --
// what a technician sees on that outlet's stop card (so they don't re-report
// something already flagged) and what feeds the outlet grid on Overview.
function openIssuesFor(outlet){
  return Object.values(state.issues).filter(i => i.outlet===outlet && i.status!=="resolved")
    .sort((a,b) => a.raisedAt < b.raisedAt ? 1 : -1);
}

// An issue that's been turned into a job (see convertIssueToTask) shows up in
// that outlet's own job list — Open, claimable by whoever's covering the
// outlet, same as an ad-hoc job — instead of sitting only on the Overview
// board waiting for a supervisor to plan and schedule it. Matched back to its
// issue by `issueId` (not name), so it can never collide with an unrelated
// job that happens to share the same wording.
function issueTasksFor(outlet){
  return openIssuesFor(outlet).filter(i => i.convertedToTask)
    .map(i => ({id:uid(), name:i.description, kind:"issue", issueId:i.id, startedAt:null, doneAt:null, claimedBy:null, addedBy:i.raisedBy||null}));
}

// Who to credit an unclaimed job to. Reads the task's own `addedBy` first
// (every job created since that field existed carries it), but a converted
// issue's stored task can predate that field -- its underlying issue has
// always recorded `raisedBy`, though, so a converted issue can always be
// traced this way even if it was converted before `addedBy` existed. An
// ad-hoc job or Task Setting extra added before this all existed has no such
// fallback -- that information was genuinely never captured for those.
function addedByOf(t){
  if(t.addedBy) return t.addedBy;
  if(t.kind === "issue" && t.issueId){
    const iss = state.issues[t.issueId];
    if(iss) return iss.raisedBy || null;
  }
  return null;
}

// A technician flags a problem they can't fix themselves, right from the
// outlet stop they're standing at -- or a supervisor gets ahead of one,
// assigning a non-urgent task to an outlet before anyone's even reported it
// (see addIssueBlock, on Overview). Either way it starts life as "open" --
// unplanned, just on the board -- until a supervisor commits to a plan.
function reportIssue(outlet, description, priority, raisedBy){
  const desc = (description||"").trim().slice(0,500);
  if(!desc || !outlet) return;
  saveIssue({
    id: issueUid(), outlet, description: desc,
    priority: PRIORITIES.includes(priority) ? priority : "medium",
    status: "open",
    raisedBy: raisedBy || state.me || "Supervisor",
    raisedAt: new Date().toISOString(),
    assignee: null, targetDate: null, notes: "", resolvedAt: null, resolvedBy: null,
    convertedToTask: false
  });
}

// Turns an issue into an actual job in that outlet's list — anyone covering
// the outlet tonight (or the next time it's covered) can claim it, work it,
// and mark it done, exactly like an ad-hoc job. Either a supervisor (from
// Overview) or a technician standing at the outlet can do this; either way
// it stays open-claim rather than pinned to one assignee, so whoever's
// actually there can just pick it up. New rounds pick it up automatically
// via tasksFor(); any round already open for that outlet tonight gets it
// pushed in immediately by syncIssueTaskToLiveRounds so nobody has to leave
// and re-arrive to see it.
function convertIssueToTask(id){
  const cur = state.issues[id]; if(!cur || cur.status==="resolved" || cur.convertedToTask) return;
  const next = clone(cur);
  next.convertedToTask = true;
  saveIssue(next);
  syncIssueTaskToLiveRounds(next.outlet, next);
}

// Counterpart to syncExtraToLiveRounds, for the one issue just converted —
// pushes it into every round already open for that outlet today that hasn't
// departed yet. Matched by issueId so it's never added twice.
async function syncIssueTaskToLiveRounds(outlet, issue){
  const today = todayKey();
  const jobs = Object.values(state.rounds).filter(r => r.date === today);
  for(const orig of jobs){
    const r = clone(orig);
    const s = r.stops.find(x => x.outlet === outlet && !x.departAt);
    if(!s) continue;
    if(s.tasks.some(t => t.issueId === issue.id)) continue;
    s.tasks.push({id:uid(), name:issue.description, kind:"issue", issueId:issue.id, startedAt:null, doneAt:null, claimedBy:null, addedBy:issue.raisedBy||null});
    try{ await saveRound(r); }catch(e){}
  }
}

// Supervisor commits to a plan: who's handling it and by when, with room for
// a running note (contractor booked, parts on order, etc). Re-saving an
// already-planned issue with new details is just editing the plan in place.
function planIssue(id, patch){
  const cur = state.issues[id]; if(!cur) return;
  const next = clone(cur);
  next.status = "planned";
  if(PRIORITIES.includes(patch.priority)) next.priority = patch.priority;
  next.assignee = (patch.assignee||"").trim().slice(0,60) || null;
  next.targetDate = patch.targetDate || null;
  next.notes = (patch.notes||"").trim().slice(0,500);
  saveIssue(next);
}

// Closes it out -- fixed, whether or not it was ever formally "planned" first
// (a quick fix doesn't need the full planning form). Credited to whoever this
// device is currently set to -- the technician who just finished the
// converted job, or the supervisor who tapped "Mark resolved" -- same
// fallback as reportIssue when no identity is set on this device.
function resolveIssue(id){
  const cur = state.issues[id]; if(!cur) return;
  const next = clone(cur);
  next.status = "resolved";
  next.resolvedAt = new Date().toISOString();
  next.resolvedBy = state.me || "Supervisor";
  saveIssue(next);
}

// Back onto the board if a "resolved" problem turns out not to have stuck,
// or a planned one needs to be pulled back to square one. Assignee/target
// date/notes are left as-is rather than wiped -- they're still useful
// history for whoever picks it up again. resolvedAt/resolvedBy are tied to
// the resolution event itself, so those clear along with the status.
function reopenIssue(id){
  const cur = state.issues[id]; if(!cur) return;
  const next = clone(cur);
  next.status = "open";
  next.resolvedAt = null;
  next.resolvedBy = null;
  saveIssue(next);
}

function render(){
  renderConn();
  $("#hdr-date").textContent = DAYNAME[operationalNow().getDay()]+" "+todayKey();
  $("#btn-tech").setAttribute("aria-pressed", state.role==="tech");
  $("#btn-overview").setAttribute("aria-pressed", state.role==="overview");
  $("#btn-mgr").setAttribute("aria-pressed", state.role==="mgr");
  $("#btn-routes").setAttribute("aria-pressed", state.role==="routes");
  $("#btn-tasksetting").setAttribute("aria-pressed", state.role==="tasksetting");
  // A small red count on the Overview tab itself -- so a supervisor glancing
  // at the nav bar (not even inside Overview yet) can tell something needs
  // planning, without having to check.
  const openIssueN = Object.values(state.issues).filter(i => i.status!=="resolved").length;
  $("#btn-overview").innerHTML = "Overview" + (openIssueN ? ` <span class="nav-badge">${openIssueN}</span>` : "");
  $("#view").innerHTML = state.role==="tech" ? techView()
    : state.role==="overview" ? overviewView()
    : state.role==="routes" ? routesView()
    : state.role==="tasksetting" ? taskSettingView() : mgrView();
  wire();
}

// Real-time updates arrive constantly while the app is open -- another
// technician claiming a job, arriving/departing an outlet, a supervisor
// editing config on a different device -- and each one used to force a full
// render() no matter what. That's fine everywhere the screen only ever shows
// saved state, but Task Setting's per-outlet "add a job" forms (job name,
// Must do, One-time, which nights) aren't written into `state` until Add is
// actually clicked, so any of these background refreshes arriving mid-edit
// silently wiped them back to their defaults -- "Must do" unchecked, "One-time"
// re-checked -- which is exactly the bug Chun Kay hit: with several
// technicians actively working, a round update lands every few seconds, so a
// checkbox rarely survived long enough to reach the Add click. Task Setting
// used to be a collapsible panel, which the old guard already protected
// (see the "configuring" check below); now that it's its own tab, the same
// protection has to key off the tab itself instead. Nothing is lost by
// skipping these -- the moment the supervisor's own next click calls render()
// directly, they see the latest data anyway.
function externalUpdate(){
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  const adding = state.adding !== null;
  const configuring = document.querySelector("details.panel[open]") || state.role === "tasksetting";
  if(typing || adding || configuring) return;
  render();
}

/* ================= water test & dosing calculator (inside the tracker) =================
 * The dosing calculator (chunkayseo-ui.github.io/dosing-app) is a lookup table:
 * outlet x weekday/weekend x FC x pH -> chlorine + acid. The technician used to
 * open it as a separate app, read the dose off it, screenshot it, and post that
 * to Telegram. This brings the same lookup -- and the same reference panels
 * (today's earlier readings, expected/attended, past same-weekday dosing, the
 * dosing route) -- into the water-test job itself, so the reading, the dose and
 * the job's Done all happen on one screen. The amounts still come from the
 * calculator's own data.csv, so Chun Kay keeps editing dosing in one place.
 */
const DOSING_APP_BASE = "https://chunkayseo-ui.github.io/dosing-app/";
const DOSING_HISTORY_API = "https://script.google.com/macros/s/AKfycbwYJLfkw5lwKnjwqmEtuRiREzbahnf2l63YhmX_7jMR9uqM9MpeqoxeVTTVw5rc76eZ6g/exec";
// The tracker's outlet codes are uppercase; the calculator's data.csv and the
// water-test sheet spell two of them in title case. JE has no table of its own
// -- its four pools each have one, so a JE job's `pool` is the key there.
const DOSING_KEY_MAP = {LENTOR:"Lentor", TENGAH:"Tengah"};
const UNIT_LABEL = {g:"g", kg:"kg", ml:"ml", l:"L"};
const dosingData = {tables:null, tablesP:null, tablesErr:false, hist:{}, histP:{}, routeDoc:undefined, routeP:null};

function dosingKeyFor(outletCode, pool){ return pool || DOSING_KEY_MAP[outletCode] || outletCode; }
// Which must-do job is "the water test" and which is "the dosing" is decided
// by name, since the job names are whatever Task Setting says they are
// ("Water Test and Night Report", "Manual Dosing (Chlorine and Acid)"...).
// The stock default "Water test & dosing" is one combined job and counts as
// the water test.
const isWaterTestTask = t => /water\s*test/i.test(t.name || "");
const isDosingTask = t => /dosing/i.test(t.name || "") && !isWaterTestTask(t);
const autoSchedule = () => [0,6].includes(operationalNow().getDay()) ? "weekend" : "weekday";
function fmtAmt(v, unit){ return ((v % 1 === 0) ? v.toFixed(0) : String(v)) + " " + (UNIT_LABEL[unit] || unit); }

function parseCSV(text){
  const rows = []; let row = [], field = "", q = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; } else field += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(field); field = ""; }
    else if(c === "\r"){ /* skip */ }
    else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
// Same shape the calculator builds: {key: {name, weekday:{fc:[],ph:[],grid:{fc:[dose per ph]}}, weekend:{...}}}
function buildDosingTables(rows){
  const idx = {}; rows[0].forEach((h,i) => idx[h.trim()] = i);
  const out = {};
  for(let i=1; i<rows.length; i++){
    const r = rows[i]; if(!r || r.length < 9 || !r[idx.outlet]) continue;
    const key = r[idx.outlet].trim(), sched = r[idx.schedule].trim();
    const fc = parseFloat(r[idx.fc]), ph = parseFloat(r[idx.ph]), cl = parseFloat(r[idx.chlorine]), acid = parseFloat(r[idx.acid]);
    if([fc,ph,cl,acid].some(isNaN)) continue;
    if(!out[key]) out[key] = {name:r[idx.name].trim()};
    if(!out[key][sched]) out[key][sched] = {fc:[], ph:[], grid:{}};
    const t = out[key][sched];
    if(!t.fc.includes(fc)) t.fc.push(fc);
    if(!t.ph.includes(ph)) t.ph.push(ph);
    (t.grid[String(fc)] = t.grid[String(fc)] || {})[ph] = {cl, clUnit:r[idx.chlorine_unit].trim(), acid, acidUnit:r[idx.acid_unit].trim()};
  }
  Object.values(out).forEach(o => ["weekday","weekend"].forEach(s => {
    const t = o[s]; if(!t) return;
    t.fc.sort((a,b)=>a-b); t.ph.sort((a,b)=>a-b);
    const g = {}; Object.keys(t.grid).forEach(k => { g[k] = t.ph.map(p => t.grid[k][p] || null); }); t.grid = g;
  }));
  return out;
}
// Each loader re-renders once its data lands, but only if a water-test panel
// is actually on screen waiting for it -- nobody else cares.
function rerenderIfPanelOpen(){ if(document.querySelector(".wt")) render(); }
function loadDosingTables(){
  // A failed load stays failed until the Retry button clears tablesErr --
  // otherwise the re-render after a failure would kick off another load,
  // whose failure re-renders again, forever (with no signal, that's a
  // request every few hundred ms and a screen that never settles).
  if(dosingData.tables || dosingData.tablesP || dosingData.tablesErr) return;
  dosingData.tablesP = fetch(DOSING_APP_BASE + "data.csv?_=" + Date.now()).then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(txt => { dosingData.tables = buildDosingTables(parseCSV(txt)); dosingData.tablesErr = false; })
    .catch(() => { dosingData.tablesErr = true; })
    .finally(() => { dosingData.tablesP = null; rerenderIfPanelOpen(); });
}
// The sheet API is an Apps Script that scans a sheet on a cold call -- it can
// take 10-20 s and occasionally fails outright the first time, then answers
// fine a moment later. So a failure isn't final: it retries itself a couple
// of times with a growing pause, and the panel offers a manual Retry too.
const histAttempts = {};
function loadPoolHistory(key, force){
  if(force){ delete dosingData.hist[key]; histAttempts[key] = 0; }
  if(dosingData.hist[key] !== undefined || dosingData.histP[key]) return;
  histAttempts[key] = (histAttempts[key] || 0) + 1;
  dosingData.histP[key] = fetch(DOSING_HISTORY_API + "?pool=" + encodeURIComponent(key)).then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j => { dosingData.hist[key] = j[key] || []; histAttempts[key] = 0; })
    .catch(() => {
      dosingData.hist[key] = false;
      if(histAttempts[key] < 3) setTimeout(() => {
        if(dosingData.hist[key] === false){ delete dosingData.hist[key]; rerenderIfPanelOpen(); }
      }, 5000 * histAttempts[key]);
    })
    .finally(() => { delete dosingData.histP[key]; rerenderIfPanelOpen(); });
}
function loadRouteDoc(){
  if(dosingData.routeDoc !== undefined || dosingData.routeP) return;
  dosingData.routeP = fetch(DOSING_APP_BASE + "dosing-route.html").then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(txt => { dosingData.routeDoc = new DOMParser().parseFromString(txt, "text/html"); })
    .catch(() => { dosingData.routeDoc = null; })
    .finally(() => { dosingData.routeP = null; rerenderIfPanelOpen(); });
}
function dosingTable(key, schedule){
  const o = dosingData.tables && dosingData.tables[key]; if(!o) return null;
  return o[schedule] || o.weekday || o.weekend || null;
}
function doseFor(key, schedule, fc, ph){
  const t = dosingTable(key, schedule); if(!t || fc === null || ph === null) return null;
  const row = t.grid[String(fc)]; const i = t.ph.indexOf(ph);
  return (row && i >= 0 && row[i]) ? row[i] : null;
}
function wtState(key){
  if(!state.wt[key]) state.wt[key] = {schedule:autoSchedule(), fc:null, ph:null, showNeg:false, chlorinator:"on"};
  return state.wt[key];
}
function readingSummary(rd){
  const bits = [`FC ${rd.fc}`, `pH ${Number(rd.ph).toFixed(1)}`];
  if(rd.chlorinator) bits.push(`chlorinator ${rd.chlorinator.toUpperCase()}`);
  return `${bits.join(" · ")} → <b>${fmtAmt(rd.chlorine, rd.chlorineUnit)} chlorine · ${fmtAmt(rd.acid, rd.acidUnit)} acid</b>`;
}
function plannedDoseSummary(pd){
  return `Dose tonight: <b>${fmtAmt(pd.chlorine, pd.chlorineUnit)} chlorine · ${fmtAmt(pd.acid, pd.acidUnit)} acid</b> (from FC ${pd.fc} · pH ${Number(pd.ph).toFixed(1)})`;
}

// --- the reference panels, same content the calculator shows under its readout ---
function wtTodayHtml(key){
  const recs = dosingData.hist[key];
  if(recs === undefined){ loadPoolHistory(key); return '<div class="muted">Loading today\'s readings… (the sheet can take 10–20 s)</div>'; }
  if(recs === false) return `<div class="muted">Couldn't load today's readings right now. <button class="link" data-wthistretry="${esc(key)}">Retry</button></div>`;
  const rec = recs.find(r => r.date === todayKey());
  if(!rec) return `<div class="muted">No morning or afternoon reading logged yet today for ${esc(key)}.</div>`;
  const val = (v, suf="") => (v === null || v === undefined) ? '<span class="none">not logged</span>' : `<span>${esc(String(v))}${suf}</span>`;
  const block = (label, fc, ph, temp) => `<div><b>${label}</b>FC ${val(fc)}pH ${val(ph === null || ph === undefined ? null : Number(ph).toFixed(1))}Temp ${val(temp, "°C")}</div>`;
  return `<div class="wt-tc">
    ${block("Morning", rec.fc.morning, rec.ph.morning, rec.temp ? rec.temp.morning : null)}
    ${block("Afternoon", rec.fc.afternoon, rec.ph.afternoon, rec.temp ? rec.temp.afternoon : null)}
    <div><b>Expected (7am)</b>${val(rec.expected7am)}</div>
    <div><b>Attended (8pm)</b>${val(rec.attended8pm)}</div>
  </div>`;
}
function wtHistoryHtml(key){
  const recs = dosingData.hist[key];
  if(recs === undefined){ loadPoolHistory(key); return '<div class="muted">Loading history… (the sheet can take 10–20 s)</div>'; }
  if(recs === false) return `<div class="muted">Couldn't load history right now. <button class="link" data-wthistretry="${esc(key)}">Retry</button></div>`;
  const dow = operationalNow().getDay();
  const rows = recs.filter(r => new Date(r.date+"T00:00:00").getDay() === dow).slice(0, 8);
  if(!rows.length) return `<div class="muted">No past ${DAYNAME_FULL[dow]} records yet for ${esc(key)}.</div>`;
  const f = v => (v === null || v === undefined) ? "–" : esc(String(v));
  const fp = v => (v === null || v === undefined) ? "–" : Number(v).toFixed(1);
  return `<div class="wt-hist"><table>
    <thead><tr><th>Date</th><th>FC AM</th><th>FC PM</th><th>FC Night</th><th>pH Night</th><th>Chlorine</th><th>Acid</th><th>Attended</th></tr></thead>
    <tbody>${rows.map(r => {
      const d = new Date(r.date+"T00:00:00");
      const drop = r.fc.night !== null && r.fc.afternoon !== null && r.fc.night > r.fc.afternoon;
      return `<tr><td>${d.getDate()} ${MONTH_ABBR[d.getMonth()]}</td><td>${f(r.fc.morning)}</td><td>${f(r.fc.afternoon)}</td>
        <td>${drop ? `<span class="flag" title="Night FC higher than afternoon — worth a retest">${f(r.fc.night)} ⚠</span>` : f(r.fc.night)}</td>
        <td>${fp(r.ph.night)}</td><td>${f(r.dosing.chlorine)}</td><td>${f(r.dosing.acid)}</td><td>${f(r.attended)}</td></tr>`;
    }).join("")}</tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:6px">⚠ night FC above the afternoon reading — worth a retest before dosing off it.</div>`;
}
function wtRouteHtml(code){
  const doc = dosingData.routeDoc;
  if(doc === undefined){ loadRouteDoc(); return '<div class="muted">Loading dosing route…</div>'; }
  if(doc === null) return `<div class="muted">Couldn't load the route. <a class="link" href="${DOSING_APP_BASE}dosing-route.html" target="_blank" rel="noopener">Open the route page</a></div>`;
  let card = null;
  doc.querySelectorAll(".card").forEach(c => { const el = c.querySelector(".card-head .code"); if(!card && el && el.textContent.trim().toUpperCase() === code.toUpperCase()) card = c.outerHTML; });
  if(!card) return `<div class="muted">No dosing route on file yet for ${esc(code)}.</div>`;
  const css = [...doc.querySelectorAll("style")].map(s => s.textContent).join("\n");
  const srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>${css}
    body{padding:0;margin:0;background:transparent}.card{margin:0}.plan{overflow-x:auto;-webkit-overflow-scrolling:touch}.plan svg{width:170%;max-width:none}</style></head>
    <body><div style="font:11px 'IBM Plex Sans',sans-serif;color:#7b8a91;text-align:center;padding:6px 0 2px">Swipe left/right on the diagram to see the full pool ↔</div>${card}</body></html>`;
  return `<div class="wt-route"><iframe title="Dosing route for ${esc(code)}" scrolling="no" data-wtroute srcdoc="${esc(srcdoc)}"></iframe>
    <a class="link" href="${DOSING_APP_BASE}dosing-route.html" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px">Open full-size route</a></div>`;
}
const DAYNAME_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

// The panel itself: rendered right under a water-test job the current
// technician has claimed and not yet finished.
function waterTestPanel(s, t){
  const key = s.outlet+"|"+t.id, w = wtState(key), poolKey = dosingKeyFor(s.outlet, t.pool);
  const routeCode = (t.pool || s.outlet).toUpperCase();
  if(!dosingData.tables){
    loadDosingTables();
    return `<div class="wt"><div class="wt-head"><span class="wt-title">Water test · ${esc(poolKey)}</span></div>
      <div class="wt-dose empty">${dosingData.tablesErr ? "Couldn't load the dosing table — check your signal, then tap to retry." : "Loading dosing table…"}</div>
      ${dosingData.tablesErr ? `<button class="btn" data-wtretry>Retry</button>` : ""}</div>`;
  }
  const table = dosingTable(poolKey, w.schedule);
  if(!table) return `<div class="wt"><div class="wt-head"><span class="wt-title">Water test · ${esc(poolKey)}</span></div>
    <div class="wt-dose empty">No dosing table for ${esc(poolKey)} in the calculator's data.csv.</div></div>`;
  const o = dosingData.tables[poolKey];
  const hasNeg = table.fc.some(v => v < 0);
  const fcChips = table.fc.filter(v => v >= 0 || w.showNeg || v === w.fc).map(v =>
    `<button class="tog ${v<0?"neg":""}" aria-pressed="${w.fc===v}" data-wtfc="${key}|${v}">${v}</button>`).join("");
  const phChips = table.ph.map(v => `<button class="tog" aria-pressed="${w.ph===v}" data-wtph="${key}|${v}">${v.toFixed(1)}</button>`).join("");
  const dose = doseFor(poolKey, w.schedule, w.fc, w.ph);
  // The result card names the pool and stamps the moment, the way the
  // calculator's own readout did -- so a screenshot or a glance over a
  // shoulder says which pool and when, not just two numbers.
  const now = new Date();
  const stampNow = `${now.getDate()} ${MONTH_ABBR[now.getMonth()]} ${now.getFullYear()}, ${DAYNAME_FULL[now.getDay()]}, ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const doseHtml = dose
    ? `<div class="wt-dose"><div class="head"><span class="pool">${esc(poolKey)}</span><span class="when">${stampNow}</span></div>
       <div><div class="k">Chlorine</div><div class="v">${fmtAmt(dose.cl, dose.clUnit)}</div></div>
       <div><div class="k">Acid</div><div class="v">${fmtAmt(dose.acid, dose.acidUnit)}</div></div>
       <div class="foot">${w.schedule==="weekday"?"Weekday (Mon–Fri)":"Weekend"} dosing · FC ${w.fc} · pH ${w.ph.toFixed(1)}</div></div>`
    : `<div class="wt-dose empty">Tap FC and pH to see tonight's dose</div>`;
  const onoff = (field, val) => `<div class="wt-chips">
      <button class="tog" aria-pressed="${val==="on"}" data-wtset="${key}|${field}|on">ON</button>
      <button class="tog" aria-pressed="${val==="off"}" data-wtset="${key}|${field}|off">OFF</button></div>`;
  const pOpen = k => state.panelsOpen[k] ? "open" : "";
  const kToday = "wt-today-"+key, kHist = "wt-hist-"+key, kRoute = "wt-route-"+key;
  return `<div class="wt" data-wtpanel="${key}">
    <div class="wt-head">
      <span class="wt-title">Water test · ${esc(poolKey)}</span>
      <div class="seg" role="group" aria-label="Dosing schedule">
        ${o.weekday ? `<button aria-pressed="${w.schedule==="weekday"}" data-wtsched="${key}|weekday">Weekday</button>` : ""}
        ${o.weekend ? `<button aria-pressed="${w.schedule==="weekend"}" data-wtsched="${key}|weekend">Weekend</button>` : ""}
      </div>
    </div>
    <div>
      <div class="wt-lbl"><span>Free chlorine</span>${hasNeg ? `<button class="link" data-wtneg="${key}">${w.showNeg ? "Hide below 0" : "Show below 0"}</button>` : ""}</div>
      <div class="wt-chips">${fcChips}</div>
    </div>
    <div>
      <div class="wt-lbl"><span>pH</span></div>
      <div class="wt-chips">${phChips}</div>
    </div>
    ${doseHtml}
    <div class="wt-grid">
      <div class="wt-field"><span class="wt-lbl">Salt chlorinator</span>${onoff("chlorinator", w.chlorinator)}</div>
    </div>
    <details class="panel" data-panel="${kToday}" ${pOpen(kToday)}><summary>Today's earlier readings</summary><div class="wt-ref-body">${state.panelsOpen[kToday] ? wtTodayHtml(poolKey) : ""}</div></details>
    <details class="panel" data-panel="${kHist}" ${pOpen(kHist)}><summary>Past ${DAYNAME_FULL[operationalNow().getDay()]}s</summary><div class="wt-ref-body">${state.panelsOpen[kHist] ? wtHistoryHtml(poolKey) : ""}</div></details>
    <details class="panel" data-panel="${kRoute}" ${pOpen(kRoute)}><summary>Dosing route</summary><div class="wt-ref-body">${state.panelsOpen[kRoute] ? wtRouteHtml(routeCode) : ""}</div></details>
    <button class="btn primary big" data-wtsave="${key}" ${dose ? "" : "disabled"}>${dose ? "Save reading · job done" : "Tap FC and pH first"}</button>
  </div>`;
}

// Finishing a water-test job goes through here rather than finishTask, so the
// reading and the looked-up dose travel with the Done: stamped on the job
// (and mirrored to a teammate's copy), pre-filled onto the same pool's dosing
// job, and written to water_tests as the tracker's own record of the test.
function finishWaterTest(code, tid){
  const r0 = myRound(); if(!r0) return;
  const s0 = r0.stops.find(x => x.outlet === code); const t0 = s0 && s0.tasks.find(x => x.id === tid); if(!t0) return;
  const key = code+"|"+tid, w = wtState(key), poolKey = dosingKeyFor(code, t0.pool);
  const dose = doseFor(poolKey, w.schedule, w.fc, w.ph);
  if(!dose){ flash("Tap the FC and pH readings first."); return; }
  // Just what confirms the dose: the reading, the chlorinator state, the
  // looked-up amounts. (Temperature, clarity, pump and attendance were here
  // at first; Chun Kay dropped them -- not needed to confirm the result.)
  const reading = {pool:poolKey, schedule:w.schedule, fc:w.fc, ph:w.ph, chlorinator:w.chlorinator,
    chlorine:dose.cl, chlorineUnit:dose.clUnit, acid:dose.acid, acidUnit:dose.acidUnit,
    takenAt:new Date().toISOString(), takenBy:state.me};
  let finished = null, dosingSync = null;
  withRound(r => {
    const s = r.stops.find(x => x.outlet === code); if(!s) return false;
    const t = s.tasks.find(x => x.id === tid); if(!t || !t.startedAt || t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.doneAt = new Date().toISOString(); t.reading = reading;
    finished = {name:t.name, kind:t.kind, pool:t.pool||null, doneAt:t.doneAt};
    const d = s.tasks.find(x => isDosingTask(x) && (x.pool||null) === (t.pool||null));
    if(d){
      d.plannedDose = {chlorine:dose.cl, chlorineUnit:dose.clUnit, acid:dose.acid, acidUnit:dose.acidUnit, fc:w.fc, ph:w.ph};
      dosingSync = {match:{name:d.name, kind:d.kind, pool:d.pool||null}, patch:{plannedDose:d.plannedDose}};
    }
  }, "Couldn't save the reading. Try again.").then(() => {
    if(!finished) return;
    syncTaskToOtherRounds(code, finished, {doneAt:finished.doneAt, reading});
    if(dosingSync) syncTaskToOtherRounds(code, dosingSync.match, dosingSync.patch);
    persist("water_tests/"+todayKey()+"__"+poolKey+"__night", Object.assign({outlet:code, date:todayKey(), slot:"night", source:"app"}, reading), () => {});
    delete state.wt[key];
  });
}

/* ---------- manual dosing: what was actually measured out ----------
 * The calculator screenshot used to be the proof that the dose was looked
 * up; the tracker now holds the dose itself, so what's left to record is
 * what was actually measured out. The team's own convention: 1 ml = 1 g,
 * so a measuring jug stands in for the digital scale when the scale is
 * playing up -- the amount is typed in grams either way, and "Scale / Jug"
 * says which tool it came off, which over time shows where the scales are
 * failing. The planned amounts from the water test are pre-filled, so the
 * common case is a glance and a tap; only a real difference needs typing.
 */
// The team's own convention: one full 1 L jar of chlorine = 1 kg. So a jug
// dose is counted in fills, not read off the jar -- the gradation lines are
// invisible behind white granules, so a jar photo can honestly prove that a
// fill happened, but never how full it was. Only a part fill (a jar that
// isn't packed) has a readable level, and that one number is typed.
const JUG_ML = 1000;
function jugTotal(d){
  const part = (d.jugPart === "" || isNaN(Number(d.jugPart))) ? 0 : Math.max(0, Number(d.jugPart));
  return (Number(d.jugFills) || 0) * JUG_ML + part;
}
// How many photos a jug dose owes: one per full fill, plus one for a part fill.
function jugPhotosExpected(d){
  const part = (d.jugPart === "" || isNaN(Number(d.jugPart))) ? 0 : Number(d.jugPart);
  return Math.max(1, (Number(d.jugFills) || 0) + (part > 0 ? 1 : 0));
}
const toGrams = (v,u) => u === "kg" ? v*1000 : v;
const toMl = (v,u) => u === "l" ? v*1000 : v;
const fmtG = g => (g >= 1000 && g % 100 === 0) ? (g/1000).toFixed(g % 1000 === 0 ? 0 : 1)+" kg" : g+" g";
const fmtMl = ml => (ml >= 1000 && ml % 100 === 0) ? (ml/1000).toFixed(ml % 1000 === 0 ? 0 : 1)+" L" : ml+" ml";
// More than 10% off the plan (or anything at all when the plan was zero).
const offPlan = (dosed, planned) => (planned === null || planned === undefined) ? false : planned > 0 ? Math.abs(dosed-planned)/planned > 0.1 : dosed > 0;
function dmState(key, t){
  if(!state.dm[key]) state.dm[key] = {chlorine:"", acid:"", tool:"scale", seeded:false, touched:false, jugFills:0, jugPart:""};
  const d = state.dm[key], pd = t && t.plannedDose;
  // Pre-fill from the water test's plan -- including when the plan only
  // arrives after this job was already claimed -- unless the technician has
  // already typed something of their own.
  if(!d.seeded && pd && !d.touched){
    d.chlorine = String(toGrams(pd.chlorine, pd.chlorineUnit)); d.acid = String(toMl(pd.acid, pd.acidUnit)); d.seeded = true;
  }
  return d;
}
function dosedSummary(d){
  const flag = offPlan(d.chlorineG, d.plannedChlorineG) || offPlan(d.acidMl, d.plannedAcidMl);
  const plan = (d.plannedChlorineG !== null && d.plannedChlorineG !== undefined) ? ` · planned ${fmtG(d.plannedChlorineG)} / ${fmtMl(d.plannedAcidMl)}` : "";
  const photos = d.photos || (d.photo ? [d.photo] : []);
  const src = d.chlorineSource === "photo" ? " · read from photo"
            : d.chlorineSource === "jug-fills" ? ` · ${d.jugFills || 0} × 1 L jar${(d.jugFills||0)===1?"":"s"}${d.jugPartMl ? " + "+d.jugPartMl+" ml" : ""}`
            : (photos.length ? " · typed" : "");
  const links = photos.filter(x => x.url).map((x, i) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">📷 ${photos.length > 1 ? "photo "+(i+1) : "photo"}</a>`);
  const pending = photos.filter(x => x.pending).length;
  const photo = (links.length ? " · " + links.join(" ") : "") + (pending ? ` · <span class="muted">📷 ${pending} upload${pending>1?"s":""} pending</span>` : "");
  return `Dosed <b>${fmtG(d.chlorineG)} chlorine · ${fmtMl(d.acidMl)} acid</b> (${d.tool === "jug" ? "jug" : "scale"})${plan}${src}${photo}${flag ? ' <span class="dev">⚠ off plan</span>' : ""}`;
}
function dosingPanel(s, t){
  const key = s.outlet+"|"+t.id, d = dmState(key, t), pd = t.plannedDose;
  const poolKey = dosingKeyFor(s.outlet, t.pool);
  const planHtml = pd
    ? `<div class="wt-dose"><div class="head"><span class="pool">${esc(poolKey)}</span><span class="when">to dose · from water test FC ${pd.fc} · pH ${Number(pd.ph).toFixed(1)}</span></div>
       <div><div class="k">Chlorine</div><div class="v">${fmtG(toGrams(pd.chlorine, pd.chlorineUnit))}</div></div>
       <div><div class="k">Acid</div><div class="v">${fmtMl(toMl(pd.acid, pd.acidUnit))}</div></div></div>`
    : `<div class="wt-dose empty">No water test saved for ${esc(poolKey)} yet tonight — do the water test first to get tonight's dose, or enter what you measured below.</div>`;
  const ok = d.chlorine !== "" && !isNaN(Number(d.chlorine)) && Number(d.chlorine) >= 0 && (d.acid === "" || (!isNaN(Number(d.acid)) && Number(d.acid) >= 0));
  return `<div class="wt" data-dmpanel="${key}">
    <div class="wt-head"><span class="wt-title">Manual dosing · ${esc(poolKey)}</span></div>
    ${planHtml}
    <div class="wt-grid">
      ${d.tool === "jug" ? jugFieldsHtml(key, d) : `
      <label class="wt-field" style="grid-column:1/-1"><span class="wt-lbl">Chlorine measured</span><span class="num"><input type="number" inputmode="numeric" min="0" step="1" data-dmin="${key}|chlorine" value="${esc(d.chlorine)}" placeholder="0"><span>g</span></span>${d.chlorineSource === "photo" && !d.touched ? `<span class="wt-src photo">read from the photo</span>` : ""}</label>`}
      <label class="wt-field" style="grid-column:1/-1"><span class="wt-lbl">Acid measured</span><span class="num"><input type="number" inputmode="numeric" min="0" step="1" data-dmin="${key}|acid" value="${esc(d.acid)}" placeholder="0"><span>ml</span></span></label>
      <div class="wt-field" style="grid-column:1/-1"><span class="wt-lbl">Measured with</span><div class="wt-chips">
        <button class="tog" aria-pressed="${d.tool==="scale"}" data-dmset="${key}|tool|scale">Digital scale</button>
        <button class="tog" aria-pressed="${d.tool==="jug"}" data-dmset="${key}|tool|jug">Measuring jug</button></div></div>
    </div>
