    <button class="btn primary big" data-dmsave="${key}" ${dmSaveState(d).ok ? "" : "disabled"}>${dmSaveState(d).label}</button>
  </div>`;
}
// The jug entry: count the full jars, type only the part fill. The total is
// computed, never typed -- so nobody has to read a level off a packed jar.
function jugFieldsHtml(key, d){
  const fills = Number(d.jugFills) || 0, total = jugTotal(d);
  const partN = (d.jugPart === "" || isNaN(Number(d.jugPart))) ? 0 : Number(d.jugPart);
  const sum = [fills ? `${fills} × 1 L` : null, partN ? `${partN} ml` : null].filter(Boolean).join(" + ") || "nothing yet";
  return `<div class="wt-field" style="grid-column:1/-1">
      <span class="wt-lbl">Full 1 L jars</span>
      <div class="jug-row">
        <button class="step" type="button" data-dmjug="${key}|-1" ${fills ? "" : "disabled"} aria-label="One less jar">−</button>
        <span class="count">${fills}<small>full jars</small></span>
        <button class="step" type="button" data-dmjug="${key}|1" aria-label="One more jar">+</button>
      </div>
    </div>
    <label class="wt-field" style="grid-column:1/-1"><span class="wt-lbl">Part fill (the jar that isn't full)</span>
      <span class="num"><input type="number" inputmode="numeric" min="0" step="10" data-dmin="${key}|jugPart" value="${esc(d.jugPart)}" placeholder="0"><span>ml</span></span>
      <span class="wt-src">Leave at 0 if every jar was full.</span></label>
    <div class="jug-total" style="grid-column:1/-1"><span class="sum">${sum}</span><span class="big">${fmtG(total)}</span></div>`;
}

// What the Save button should say/do given the amount and (if a relay is
// configured) the photo: needs both; a photo that failed to upload can still
// be saved now and uploaded later from the queue.
function dmSaveState(d){
  const acidOk = d.acid === "" || (!isNaN(Number(d.acid)) && Number(d.acid) >= 0);
  const amountOk = d.tool === "jug"
    ? jugTotal(d) > 0 && acidOk
    : (d.chlorine !== "" && !isNaN(Number(d.chlorine)) && Number(d.chlorine) >= 0 && acidOk);
  if(!amountOk) return {ok:false, label: d.tool === "jug" ? "Count the jars first" : "Enter the chlorine measured first"};
  if(!relayCfg()) return {ok:true, label:"Save amounts · job done"};
  const photos = d.photos || [];
  if(photos.some(ph => ph.status === "preparing" || ph.status === "uploading")) return {ok:false, label:"Wait for the photo…"};
  if(!photos.length) return {ok:false, label:"Take the photo first"};
  // One photo per fill: a jar photo can't show how full it was, so the count
  // of photos is what stands behind the count of fills.
  if(d.tool === "jug"){
    const want = jugPhotosExpected(d);
    if(photos.length < want) return {ok:false, label:`One photo per fill — ${photos.length} of ${want}`};
  }
  if(photos.some(ph => ph.status === "failed")) return {ok:true, label:"Save now · photo uploads later", queue:true};
  return {ok:true, label:"Save amounts · job done"};
}
function finishDosing(code, tid){
  const r0 = myRound(); if(!r0) return;
  const s0 = r0.stops.find(x => x.outlet === code); const t0 = s0 && s0.tasks.find(x => x.id === tid); if(!t0) return;
  const key = code+"|"+tid, d = dmState(key, t0), poolKey = dosingKeyFor(code, t0.pool);
  const cl = d.tool === "jug" ? jugTotal(d) : Number(d.chlorine);
  const acid = d.acid === "" ? 0 : Number(d.acid);
  if(isNaN(cl) || cl < 0 || isNaN(acid) || acid < 0 || (d.tool !== "jug" && d.chlorine === "")){
    flash(d.tool === "jug" ? "Count the jars you filled first." : "Enter the chlorine measured (in grams) first."); return;
  }
  const pd = t0.plannedDose;
  const sst = dmSaveState(d);
  if(!sst.ok){ flash(sst.label === "Take the photo first" ? "Take the photo of the scale first." : sst.label); return; }
  const photos = d.photos || [];
  const dosed = {chlorineG:cl, acidMl:acid, tool:d.tool,
    plannedChlorineG: pd ? toGrams(pd.chlorine, pd.chlorineUnit) : null, plannedAcidMl: pd ? toMl(pd.acid, pd.acidUnit) : null,
    chlorineSource: d.tool === "jug" ? "jug-fills"
      : (d.chlorineSource === "photo" && !d.touched && String(d.readG) === String(cl)) ? "photo" : "typed",
    readG: (d.readG !== undefined && d.readG !== null) ? d.readG : null,
    jugFills: d.tool === "jug" ? (Number(d.jugFills) || 0) : null,
    jugPartMl: d.tool === "jug" ? ((d.jugPart === "" || isNaN(Number(d.jugPart))) ? 0 : Number(d.jugPart)) : null,
    at:new Date().toISOString(), by:state.me};
  const queued = [];
  if(relayCfg()){
    dosed.photos = photos.map(ph => {
      if(ph.status === "done") return {fileId:ph.fileId, url:ph.url, thumb:ph.thumb || null, readG: (ph.reading && ph.reading.status === "ok") ? Math.round(ph.reading.grams) : null};
      const qid = uid(); queued.push({qid, ph}); return {pending:true, queueId:qid};
    });
  }
  let finished = null;
  withRound(r => {
    const s = r.stops.find(x => x.outlet === code); if(!s) return false;
    const t = s.tasks.find(x => x.id === tid); if(!t || !t.startedAt || t.doneAt) return false;
    if(t.claimedBy !== state.me) return false;
    t.doneAt = new Date().toISOString(); t.dosed = dosed;
    finished = {name:t.name, kind:t.kind, pool:t.pool||null, doneAt:t.doneAt};
  }, "Couldn't save the amounts. Try again.").then(() => {
    if(!finished) return;
    syncTaskToOtherRounds(code, finished, {doneAt:finished.doneAt, dosed});
    // Joins the night's water_tests record (merge, so the reading written by
    // the water test stays), or starts one if the dosing came first.
    const wt = {outlet:code, pool:poolKey, date:todayKey(), slot:"night", source:"app",
       dosedChlorineG:cl, dosedAcidMl:acid, dosingTool:d.tool, dosedAt:dosed.at, dosedBy:state.me, chlorineSource:dosed.chlorineSource,
       jugFills:dosed.jugFills, jugPartMl:dosed.jugPartMl};
    const urls = (dosed.photos || []).filter(x => x.url).map(x => x.url);
    if(urls.length) wt.dosingPhotoUrls = urls;
    persist("water_tests/"+todayKey()+"__"+poolKey+"__night", wt, () => {}, {merge:true});
    queued.forEach(({qid, ph}) => { if(!ph.base64) return;
      photoQ.add({id:qid, roundId:myId(), outlet:code, taskId:tid, poolKey, date:todayKey(),
        payload:{kind:"dosing-photo", outlet:code, pool:poolKey, job:t0.name, person:state.me, takenAt:ph.takenAt, date:todayKey(), tool:d.tool, wantReading:false, imageBase64:ph.base64, photoNo:ph.n}});
    });
    delete state.dm[key];
  });
}

/* ---------- photo proof: the scale photo on Manual Dosing ----------
 * Camera-only capture (no gallery), stamped with outlet/pool/job/person/time
 * inside the image, uploaded through the Apps Script relay to Drive, and --
 * for a digital scale -- the number on the display is read by a vision
 * model and pre-filled, so the technician confirms rather than types. The
 * relay address and a shared key live in the Task Setting config; with no
 * relay configured the job behaves as before (typed amount, no photo).
 */
const PHOTO_MAX_AGE_MS = 10*60*1000;   // a "fresh" photo is one taken in the last 10 minutes
const PHOTO_MAX_PX = 1280;
const relayCfg = () => (state.cfg.photo && state.cfg.photo.relayUrl) ? state.cfg.photo : null;

async function loadPhoto(file){
  try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){
    return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
}
// Downscale, then burn the stamp into the pixels -- a photo that leaves the
// phone already says where, what, who and when, so it can't be passed off as
// another night's.
async function preparePhoto(file, lines){
  const img = await loadPhoto(file);
  const iw = img.width, ih = img.height, sc = Math.min(1, PHOTO_MAX_PX / Math.max(iw, ih));
  const W = Math.round(iw*sc), H = Math.round(ih*sc);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.drawImage(img, 0, 0, W, H);
  const fs = Math.max(14, Math.round(W/40)), pad = Math.round(fs*0.6), bandH = pad*2 + lines.length*Math.round(fs*1.3);
  g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(0, H-bandH, W, bandH);
  g.fillStyle = "#fff"; g.font = `600 ${fs}px "IBM Plex Mono", monospace`; g.textBaseline = "top";
  lines.forEach((ln, i) => g.fillText(ln, pad, H-bandH+pad+i*Math.round(fs*1.3)));
  const dataUrl = c.toDataURL("image/jpeg", 0.82);
  return {dataUrl, base64: dataUrl.split(",")[1], width:W, height:H};
}
async function relayUpload(payload){
  const rc = relayCfg(); if(!rc) throw new Error("no relay");
  // text/plain keeps the browser from sending a CORS preflight, which an
  // Apps Script web app can't answer; the script parses the JSON itself.
  const res = await fetch(rc.relayUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({key: rc.key || ""}, payload))});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || "relay error");
  return j;
}
function photoStampLines(code, poolKey, jobName){
  const n = new Date();
  return [`${code}${poolKey !== code ? " · "+poolKey : ""} · ${jobName}`, `${state.me || "?"} · ${n.getDate()} ${MONTH_ABBR[n.getMonth()]} ${n.getFullYear()} ${pad(n.getHours())}:${pad(n.getMinutes())}`];
}
// Applies a successful upload's reading to the entry: pre-fills the grams
// unless the technician already typed their own number.
// One dose can take several fills -- 2.3 kg from a 1 L jug is three photos
// (1 L, 1 L, 300 ml) -- so the entry holds a list of photos, and for the
// scale the readings are added up into the pre-filled total.
function photoReadings(d){
  return (d.photos || []).filter(ph => ph.status === "done" && ph.reading && ph.reading.status === "ok" && ph.reading.grams !== null && ph.reading.grams !== undefined)
    .map(ph => Math.round(ph.reading.grams));
}
function applyReading(d){
  if(d.tool === "jug") return;   // a jug total comes from the fills, never a photo
  const reads = photoReadings(d);
  if(!reads.length || d.touched) return;
  const total = reads.reduce((a,b) => a+b, 0);
  d.chlorine = String(total); d.chlorineSource = "photo"; d.readG = total;
  d.readConfidence = (d.photos || []).some(ph => ph.reading && ph.reading.confidence === "low") ? "low" : "high";
}
async function onDosingPhotoPicked(key, file){
  const [code, tid] = key.split("|");
  const r = myRound(); const s = r && r.stops.find(x => x.outlet === code); const t = s && s.tasks.find(x => x.id === tid);
  if(!t) return;
  const d = dmState(key, t), poolKey = dosingKeyFor(code, t.pool);
  // Camera-only is enforced by the input itself; this is the belt to that
  // brace -- a file that isn't from the last few minutes is not tonight's.
  if(file.lastModified && Date.now() - file.lastModified > PHOTO_MAX_AGE_MS){
    flash("That photo isn't from just now — take a fresh one of the scale."); return;
  }
  d.photos = d.photos || [];
  const ph = {id: uid(), status:"preparing", n: d.photos.length + 1};
  d.photos.push(ph); render();
  let prepared;
  try{ prepared = await preparePhoto(file, photoStampLines(code, poolKey, t.name).concat([`photo ${ph.n}`])); }
  catch(e){ d.photos = d.photos.filter(x => x !== ph); flash("Couldn't read that image. Try again."); render(); return; }
  Object.assign(ph, {status:"uploading", dataUrl: prepared.dataUrl, base64: prepared.base64, takenAt: new Date().toISOString()}); render();
  await uploadDosingPhoto(key, d, ph, {code, poolKey, jobName:t.name, tool:d.tool});
}
async function uploadDosingPhoto(key, d, ph, meta){
  try{
    const j = await relayUpload({kind:"dosing-photo", outlet:meta.code, pool:meta.poolKey, job:meta.jobName, person:state.me, takenAt:ph.takenAt,
      date: todayKey(), tool: meta.tool, wantReading: meta.tool !== "jug", imageBase64: ph.base64, photoNo: ph.n});
    Object.assign(ph, {status:"done", fileId:j.fileId, url:j.url, thumb:j.thumb || null, reading:j.reading || null});
    applyReading(d);
    const reads = photoReadings(d);
    if(j.reading && j.reading.status === "ok" && !d.touched) flash(reads.length > 1 ? `Read ${reads.join(" + ")} = ${reads.reduce((a,b)=>a+b,0)} g off the scale — check it, then Save.` : `Read ${Math.round(j.reading.grams)} g off the scale — check it, then Save.`);
  }catch(e){
    ph.status = "failed"; ph.error = "Upload didn't go through (signal?). Retry, or save now and it uploads later.";
  }
  render();
}
// Photos that couldn't upload on site wait here and go up when there's
// signal, then attach themselves to the job they belong to.
const photoQ = {
  read(){ try{ return JSON.parse(localStorage.getItem("drt.photoq") || "[]"); }catch(e){ return []; } },
  write(q){ try{ localStorage.setItem("drt.photoq", JSON.stringify(q)); }catch(e){} },
  add(item){ const q = this.read(); q.push(item); this.write(q); }
};
let photoFlushing = false;
async function flushPhotoQueue(){
  if(photoFlushing || !relayCfg()) return;
  const q = photoQ.read(); if(!q.length) return;
  photoFlushing = true;
  try{
    for(const item of q.slice()){
      try{
        const j = await relayUpload(item.payload);
        const rest = photoQ.read().filter(x => x.id !== item.id); photoQ.write(rest);
        attachQueuedPhoto(item, j);
      }catch(e){ /* still no luck -- next pass */ }
    }
  } finally { photoFlushing = false; }
}
function attachQueuedPhoto(item, j){
  const r = state.rounds[item.roundId]; if(!r) return;
  const rr = clone(r); const s = rr.stops.find(x => x.outlet === item.outlet); const t = s && s.tasks.find(x => x.id === item.taskId);
  if(!t || !t.dosed) return;
  t.dosed.photos = (t.dosed.photos || []).filter(x => x.queueId !== item.id);
  t.dosed.photos.push({fileId:j.fileId, url:j.url, thumb:j.thumb || null});
  saveRound(rr);
  syncTaskToOtherRounds(item.outlet, {name:t.name, kind:t.kind, pool:t.pool||null}, {dosed:t.dosed});
  persist("water_tests/"+item.date+"__"+item.poolKey+"__night", {dosingPhotoUrls: t.dosed.photos.filter(x=>x.url).map(x=>x.url)}, () => {}, {merge:true});
}
setInterval(flushPhotoQueue, 30000);
setTimeout(flushPhotoQueue, 6000);

function dosingPhotoHtml(key, d){
  if(!relayCfg()) return "";
  const tool = d.tool === "jug" ? "jug" : "scale";
  const photos = d.photos || [];
  const input = `<input type="file" accept="image/*" capture="environment" hidden data-dmphoto="${key}">`;
  if(!photos.length){
    return `<div class="wt-photo"><div class="ph-empty" aria-hidden="true">📷</div><div class="ph-main">
      <span class="ph-status">${tool === "jug" ? "Take a photo of each jar you fill — one per fill." : "Photo of the scale showing the amount — required before Save. If it takes more than one weighing, take a photo of each."}</span>
      <div class="ph-actions"><button class="btn sm primary" type="button" data-dmphotobtn="${key}">Take photo</button></div></div>${input}</div>`;
  }
  const rows = photos.map(ph => {
    const thumb = ph.dataUrl ? `<img src="${ph.dataUrl}" alt="Photo ${ph.n} of the ${tool}">` : `<div class="ph-empty" aria-hidden="true">📷</div>`;
    let status = "", actions = "";
    if(ph.status === "preparing") status = `<span class="ph-status">Photo ${ph.n} · preparing…</span>`;
    else if(ph.status === "uploading") status = `<span class="ph-status">Photo ${ph.n} · uploading${tool === "scale" ? " and reading the display" : ""}…</span>`;
    else if(ph.status === "done"){
      const rd = ph.reading;
      const msg = tool === "jug" ? `Photo ${ph.n} saved.`
        : (rd && rd.status === "ok") ? `Photo ${ph.n} · read <b>${Math.round(rd.grams)} g</b>${rd.confidence === "low" ? " (not 100% sure — check it)" : ""}`
        : `Photo ${ph.n} saved — display couldn't be read.`;
      status = `<span class="ph-status ok">${msg}</span>`;
      actions = `<button class="link" type="button" data-dmphotorm="${key}|${ph.id}">remove</button>`;
    } else if(ph.status === "failed"){
      status = `<span class="ph-status err">Photo ${ph.n} · ${esc(ph.error || "Upload failed.")}</span>`;
      actions = `<button class="btn sm" type="button" data-dmphotoretry="${key}|${ph.id}">Retry upload</button><button class="link" type="button" data-dmphotorm="${key}|${ph.id}">remove</button>`;
    }
    return `<div class="wt-photo has">${thumb}<div class="ph-main">${status}<div class="ph-actions">${actions}</div></div></div>`;
  }).join("");
  const reads = photoReadings(d);
  const total = (tool === "scale" && reads.length > 1) ? `<span class="wt-src photo">Scale readings add up: ${reads.join(" + ")} = ${reads.reduce((a,b)=>a+b,0)} g</span>` : "";
  const want = jugPhotosExpected(d);
  const hint = tool === "jug"
    ? `<span class="wt-src">${photos.length} photo${photos.length===1?"":"s"} for ${want} fill${want===1?"":"s"}.${photos.length < want ? " Take one for each." : ""}</span>`
    : (reads.length === 0 && photos.some(p=>p.status==="done") ? `<span class="wt-src">Display couldn't be read — type the amount.</span>` : "");
  return `<div class="stack" style="gap:8px">${rows}${total}${hint}
    <button class="btn sm" type="button" data-dmphotobtn="${key}">+ Add another photo</button>${input}</div>`;
}

/* ---------- technician ---------- */
function techView(){
  if(!state.me) return pickPerson();
  const r = myRound();
  return r ? runRound(r) : buildRound();
}

function pickPerson(){
  const opts = state.roster.map(n => '<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
  return `
  <div class="card" style="padding:20px">
    <div class="eyebrow">Step 1</div>
    <h2 class="sec" style="margin:6px 0 14px">Who's doing the round?</h2>
    <div class="stack">
      <select id="who"><option value="">Select your name…</option>${opts}</select>
      <button class="btn primary big" id="who-go">Continue</button>
      <p class="note">Your name is remembered on this phone, so you only pick it once.</p>
    </div>
  </div>
  ${rosterPanel()}`;
}

function buildRound(){
  const sel = state.picking || [];
  const pills = OUTLETS.map(o => {
    const extra = assignedFor(o.code, operationalNow().getDay()).length;
    const others = othersOn(o.code);
    const who = others.length ? `<span class="pill-who">${esc(others.join(", "))}</span>` : "";
    return `<button class="pill ${others.length?"pill-taken":""}" data-pick="${o.code}" aria-pressed="${sel.includes(o.code)}">
      ${esc(o.code)}<small>${extra ? "+"+extra+" job"+(extra>1?"s":"") : "&nbsp;"}</small>${who}</button>`;
  }).join("");
  const anyTaken = OUTLETS.some(o => othersOn(o.code).length);
  return `
  <div class="card" style="padding:20px">
    <div class="sec-head" style="margin-bottom:4px"><h2 class="sec">Today's round</h2><span class="eyebrow">${esc(state.me)}</span></div>
    <p class="note" style="margin:0 0 14px">Tap the outlets you're covering today, then Start round.${anyTaken ? " Outlets already picked up by someone else today are marked — you can still take them too." : ""}</p>
    <div class="pill-grid">${pills}</div>
    <div class="row-2" style="margin-top:16px">
      <button class="btn" id="pick-all" style="flex:1">Select all</button>
      <button class="btn" id="pick-none" style="flex:1">Clear</button>
    </div>
    <button class="btn primary big" id="start" style="margin-top:10px" ${sel.length?"":"disabled"}>
      Start round · ${sel.length} outlet${sel.length===1?"":"s"}</button>
    <p class="note" style="margin:12px 0 0">Each outlet comes with its job list. Nothing is timed until you claim a job.</p>
  </div>
  <button class="btn" id="switch-user" style="align-self:flex-start">Not ${esc(state.me)}?</button>`;
}

// The "heading to next?" pill picker, shown once a technician has left a stop
// and hasn't arrived anywhere new yet, for every outlet still remaining —
// even just one. With a single outlet left it's less about choosing between
// options and more about confirming "yes, travelling there now," which is
// exactly what lights up the dashed anticipated-route line on the
// supervisor's Routes map instead of leaving it a plain "still to visit" ring.
function headingPicker(r, pending){
  if(!pending.length) return "";
  const pills = pending.map(s =>
    `<button class="pill" data-heading="${esc(s.outlet)}" aria-pressed="${r.headingTo===s.outlet}">${esc(stopLabel(s))}</button>`
  ).join("");
  const prompt = pending.length === 1
    ? `Heading to ${esc(stopLabel(pending[0]))}? <span class="muted">Optional — shows on the Routes map.</span>`
    : `Heading to next? <span class="muted">Optional — shows on the Routes map.</span>`;
  return `<div class="card" style="padding:14px">
    <p class="note" style="margin:0 0 8px">${prompt}</p>
    <div class="pill-grid">${pills}</div>
  </div>`;
}

// An unplanned detour -- hardware shop, the office, anywhere that isn't one
// of the ten registered pool branches. Chun Kay wanted this available even
// while still checked in somewhere else -- a plan can change mid-visit (an
// emergency call to go somewhere else), and he shouldn't have to leave his
// current stop first just to get the option onto tonight's round. It works
// exactly like "+ Add outlet" above, which was never blocked this way
// either: adding a stop just queues it up as pending. Its own Arrive button
// stays disabled ("Still checked in at X -- leave there first") until the
// current stop is actually left, same as any other pending stop -- so this
// only removes the button's visibility, not the real one-stop-at-a-time rule.
function addCustomStopBlock(r){
  if(!state.addingCustomStop){
    return `<button class="btn" id="open-addcustom" style="align-self:flex-start">+ Add a stop (hardware shop, office, etc.)</button>`;
  }
  return `<div class="card" style="padding:14px">
    <p class="note" style="margin:0 0 8px">Add an unplanned stop — shows on your route with why you went. <span class="muted">Address/postal is what lets it show up on the map too.</span></p>
    <input type="text" id="customname" placeholder="Place name, e.g. Ah Huat Hardware" autocomplete="off" maxlength="80">
    <input type="text" id="customaddr" placeholder="Address" autocomplete="off" maxlength="200" style="margin-top:8px">
    <input type="text" id="custompostal" placeholder="Postal code" autocomplete="off" maxlength="10" inputmode="numeric" style="margin-top:8px">
    <textarea id="customremark" placeholder="Why are you going here?" maxlength="200" style="margin-top:8px;min-height:56px"></textarea>
    <div class="row-2" style="margin-top:10px">
      <button class="btn primary sm" id="confirm-addcustom" style="flex:1">Add stop</button>
      <button class="btn sm" id="cancel-addcustom" style="flex:1">Cancel</button>
    </div>
  </div>`;
}

// A same-day, last-minute outlet a technician wasn't originally assigned —
// covering for someone stuck elsewhere (fixing a pump, say) — added directly
// from their own round rather than needing the supervisor to set it up first.
function addOutletBlock(r){
  const available = OUTLETS.filter(o => !r.stops.some(s => s.outlet === o.code));
  if(!available.length) return "";
  if(!state.pickingExtra){
    return `<button class="btn" id="open-addoutlet" style="align-self:flex-start">+ Add outlet — covering for someone</button>`;
  }
  if(state.pickingExtraFor){
    const code = state.pickingExtraFor;
    return `<div class="card" style="padding:14px">
      <p class="note" style="margin:0 0 8px">Covering <strong>${esc(code)}</strong> — add a note? <span class="muted">Optional, e.g. who you're covering for.</span></p>
      <input type="text" id="coveringnote" placeholder="e.g. Covering for Fik — pump repair at DR" autocomplete="off" maxlength="200">
      <div class="row-2" style="margin-top:10px">
        <button class="btn primary sm" id="confirm-addoutlet" style="flex:1">Add ${esc(code)}</button>
        <button class="btn sm" id="back-addoutlet" style="flex:1">Back</button>
      </div>
    </div>`;
  }
  const pills = available.map(o => `<button class="pill" data-addoutlet="${o.code}">${esc(o.code)}</button>`).join("");
  return `<div class="card" style="padding:14px">
    <p class="note" style="margin:0 0 8px">Which pool are you covering tonight?</p>
    <div class="pill-grid">${pills}</div>
    <button class="btn sm" id="cancel-addoutlet" style="margin-top:10px">Cancel</button>
  </div>`;
}

// Shown on a covering stop's own card — the note can be added or edited at
// any point while it's still on the round, not just at the moment it's added
// (a technician may only think to note who/why after the fact).
function coveringNoteBlock(s){
  if(state.notingOutlet === s.outlet){
    return `<div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
      <input type="text" id="notenote" value="${esc(s.coveringNote||"")}" placeholder="e.g. Covering for Fik — pump repair at DR" autocomplete="off" maxlength="200">
      <div class="row-2">
        <button class="btn primary sm" data-savenote="${s.outlet}" style="flex:1">Save note</button>
        <button class="btn sm" data-cancelnote="${s.outlet}" style="flex:1">Cancel</button>
      </div>
    </div>`;
  }
  if(s.coveringNote){
    return `<p class="note" style="margin:6px 0 0">“${esc(s.coveringNote)}” <button class="link" data-asknote="${s.outlet}">edit</button></p>`;
  }
  return `<button class="link" data-asknote="${s.outlet}" style="align-self:flex-start;margin-top:4px">+ Add a note</button>`;
}

function runRound(r){
  const t = totals(r), cs = crewState(r);
  // Cards are shown in the order the round actually happened, not the fixed
  // reference order the outlets were originally picked in (r.stops keeps that
  // fixed order — a technician can arrive at their picked outlets in any
  // order). Visited/active stops are sorted by real arrival time; anything
  // not yet started is appended after — the declared "heading to" outlet
  // first, if one's been picked, then the rest in their original order.
  const visited = r.stops.filter(s => s.arriveAt).sort((a,b) => a.arriveAt < b.arriveAt ? -1 : 1);
  let pending = r.stops.filter(s => !s.arriveAt);
  if(r.headingTo){
    const hi = pending.findIndex(s => s.outlet === r.headingTo);
    if(hi > 0) pending = [pending[hi], ...pending.slice(0,hi), ...pending.slice(hi+1)];
  }
  const ordered = visited.concat(pending);
  let out = [], prev = null, shownGap = false;
  ordered.forEach(s => {
    if(prev && s.arriveAt){
      out.push(`<div class="travel-gap"><span>▼ travel ${dur(mins(prev,s.arriveAt))}</span><span class="ln"></span></div>`);
    } else if(prev && !s.arriveAt && cs.k==="travel" && !shownGap){
      out.push(`<div class="travel-gap"><span>▼ travelling ${liveDur(prev)}</span><span class="ln"></span></div>`);
      out.push(headingPicker(r, pending));
      shownGap = true;
    }
    const seqIdx = visited.indexOf(s);
    out.push(stopCard(s, seqIdx, r, s.outlet === r.headingTo));
    if(s.departAt) prev = s.departAt;
  });
  return `
  <div class="kpis trio">
    <div class="kpi"><div class="v">${t.done}<span style="font-size:16.5px;color:var(--ink-3)">/${t.total}</span></div><div class="k eyebrow">Outlets</div></div>
    <div class="kpi"><div class="v" style="color:var(--accent)">${t.tasksDone}</div><div class="k eyebrow">Jobs done</div></div>
    <div class="kpi"><div class="v" style="color:var(--travel)">${dur(t.travel)}</div><div class="k eyebrow">Travelling</div></div>
  </div>
  <div class="route">${out.join("")}</div>
  ${addCustomStopBlock(r)}
  ${addOutletBlock(r)}
  <div class="row-2">
    <button class="btn" id="switch-user" style="flex:1">Not ${esc(state.me)}?</button>
    <button class="btn" id="reset-round" style="flex:1">Reset today's round</button>
  </div>`;
}

// Most stops are a flat job list. A stop whose tasks carry a `pool` (JE
// today) instead gets a heading above each pool's own 3 jobs, so a
// technician sees "JEIP1" once and reads straight down its jobs, rather
// than re-reading "JEIP1 — " on every single line in a list of 12.
function taskListHtml(s){
  if(!s.tasks.some(t => t.pool)) return s.tasks.map(t => taskRow(s,t)).join("");
  // Group strictly by pool rather than by adjacency in the array. A job added
  // mid-round -- a shared job toggled on, or an ad-hoc job for one pool -- is
  // pushed onto the END of an already-open round's task list (see
  // syncExtraToLiveRounds), not spliced back in next to its pool's other jobs,
  // so grouping can't assume same-pool tasks already sit together.
  const whole = [], byPool = new Map();
  s.tasks.forEach(t => {
    if(!t.pool){ whole.push(t); return; }
    if(!byPool.has(t.pool)) byPool.set(t.pool, []);
    byPool.get(t.pool).push(t);
  });
  // Each pool gets one of 4 colors, cycled in the order its jobs first show up,
  // so a technician can tell "am I still under JEIP1 or did I move to JEIP2"
  // at a glance instead of re-reading the heading text every time.
  let out = whole.map(t => taskRow(s,t)).join("");
  let ix = 0;
  for(const [pool, tasks] of byPool){
    out += `<div class="pool-head pool-c${(ix++ % 4) + 1}">${esc(pool)}</div>`;
    out += tasks.map(t => taskRow(s,t)).join("");
  }
  return out;
}

function taskRow(s, t){
  const running = t.startedAt && !t.doneAt, finished = !!t.doneAt;
  // A finished job whose claim is contradicted by another round's copy of
  // the same job can't be trusted as this round's alone to edit, no matter
  // whose name is on it here -- see conflictingTask.
  const conflict = finished ? conflictingTask(s.outlet, t) : null;
  // Whether the technician looking at this screen is the one who claimed it.
  // Only the claimer gets a live action button on their own claim; a
  // teammate at the same outlet sees who has it, but can't act on it.
  const mine = !!t.claimedBy && t.claimedBy === state.me && !conflict;
  const status = finished ? '<span class="tag st-done">Done</span>'
               : running  ? '<span class="tag st-prog">In Progress</span>'
                          : '<span class="tag st-open">Open</span>';
  const tag = t.kind==="required" ? '<span class="tag req">Must do</span>'
            : t.kind==="optional" ? '<span class="tag opt">If time allows</span>'
            : t.kind==="issue"    ? '<span class="tag urgent">Reported issue</span>'
            : '<span class="tag add">Added</span>';
  let time = "", act = "", conflictNote = "";
  const key = s.outlet+"|"+t.id;
  const rangeOf = x => (x.startedAt && x.doneAt) ? `${clockOf(x.startedAt)}–${clockOf(x.doneAt)}` : "";
  const range = rangeOf(t);
  if(finished){
    if(mine){
      time = `<span class="task-time" style="color:var(--ok)">${dur(mins(t.startedAt,t.doneAt))}${range?" · "+range:""}</span>`;
    } else if(!conflict){
      // Someone else's finished job, no dispute: say who and when.
      time = `<span class="task-time muted">${t.claimedBy?esc(t.claimedBy)+" · ":""}${range||dur(mins(t.startedAt,t.doneAt))}</span>`;
    } else {
      // Conflicting copies: showing this round's own name/time next to it
      // would misattribute the other round's real timing to this one, so
      // just flag the dispute here -- both sides' details are in the note.
      time = `<span class="task-time muted">Disputed</span>`;
    }
    if(!s.departAt){
      // Tapping Done again is the reopen action -- a native confirm() prompt
      // guards it (wired in wire()), same two-step feel as before without a
      // second row of buttons crowding an already tight task row. A job
      // that isn't mine (including a conflicted one) renders as a plain,
      // greyed-out span -- same "Done" label, but visibly not a button and
      // wired to nothing, so it can't be mistaken for something tappable.
      act = mine
        ? `<button class="btn sm act done" data-taskreopen="${key}">Done</button>`
        : `<span class="btn sm act done locked" aria-hidden="true">Done</span>`;
    }
    if(conflict){
      const mineRange = range || dur(mins(t.startedAt,t.doneAt));
      const otherRange = rangeOf(conflict) || dur(mins(conflict.startedAt,conflict.doneAt));
      conflictNote = `<span class="task-conflict">Two records disagree: ${esc(t.claimedBy)} (${mineRange}) and ${esc(conflict.claimedBy)} (${otherRange}) — ask a supervisor to confirm which is right before it's reopened.</span>`;
    }
  } else if(running){
    const who = esc(t.claimedBy || "Claimed");
    time = mine
      ? `<span class="task-time" style="color:var(--warn)">${liveDur(t.startedAt)}</span>`
      : `<span class="task-time muted">${who}${t.startedAt?" · since "+clockOf(t.startedAt):""}</span>`;
    // Deliberately not colored like "Done" (which reads as already-finished) —
    // the name button IS the finish action, so it's labeled and colored to
    // match "still in progress, tap when you're actually done" instead. The
    // X next to it undoes an accidental claim right away, no confirm needed.
    act = mine
      ? `<span class="act-group">
           <button class="btn sm act cancel" data-cancel="${key}" aria-label="Cancel claim on ${esc(t.name)}">✕</button>
           <button class="btn sm act inprogress" data-finish="${key}">${who}</button>
         </span>`
      : `<span class="btn sm act inprogress" aria-hidden="true">${who}</span>`;
  } else if(!s.departAt){
    act = `<button class="btn sm act" data-claim="${key}">Open</button>`;
  } else { time = `<span class="task-time muted">not done</span>`; }

  const del = (!t.startedAt && t.kind==="adhoc" && !s.departAt)
    ? `<button class="link" data-rmtask="${key}" aria-label="Remove ${esc(t.name)}">remove</button>` : "";

  // A finished water test shows what was read and what it called for; a
  // dosing job that hasn't been done yet shows the dose the water test
  // worked out for this pool, so the technician never has to look it up.
  const detail = (finished && t.reading) ? `<span class="wt-read">${readingSummary(t.reading)}</span>`
               : (finished && t.dosed) ? `<span class="wt-read">${dosedSummary(t.dosed)}</span>`
               : (!finished && t.plannedDose && isDosingTask(t)) ? `<span class="wt-read">${plannedDoseSummary(t.plannedDose)}</span>`
               : "";
  // The calculator opens inline under the water-test job the moment its
  // claimer taps it -- the reading and the dose are entered right here.
  // The dosing job likewise opens its measured-amounts entry.
  const panel = (running && mine && isWaterTestTask(t)) ? waterTestPanel(s, t)
              : (running && mine && isDosingTask(t)) ? dosingPanel(s, t)
              : "";

  return `<div class="task ${running?"running":""} ${finished?"finished":""}">
    <span class="mark">${finished?"✓":(running?"▶":"")}</span>
    <span class="task-main">
      <span class="task-name">${esc(t.name)}</span>
      <span class="task-meta">${status}${tag}${del}</span>
      ${detail}
      ${conflictNote}
    </span>
    ${time}${act}
  </div>${panel}`;
}

function priorityTag(p){
  return p==="urgent" ? '<span class="tag urgent">Urgent</span>'
       : p==="low"    ? '<span class="tag low">Low</span>'
       :                '<span class="tag medium">Medium</span>';
}

// A compact, read-only line for an open issue already logged at this outlet —
// shown to every technician there, whether or not they're the one who raised
// it, mainly so nobody re-reports the same broken heater twice.
function issueSummaryRow(issue){
  const planned = issue.status==="planned"
    ? `<span class="tag st-prog">${issue.targetDate?"Target "+esc(issue.targetDate):"Planned"}</span>`
    : `<span class="tag st-open">Needs planning</span>`;
  // A quick, on-the-spot fix doesn't need the full supervisor plan-and-assign
  // flow — a technician standing right here can turn it into a job in their
  // own list and just do it. Once converted, this line stops offering the
  // button (it's a job now, shown below) so it's never two clicks away in
  // two different places.
  const action = issue.convertedToTask
    ? `<span class="mono muted issue-meta">on the job list below</span>`
    : `<button class="link" data-converttask="${issue.id}">+ Turn into a job I can do</button>`;
  return `<div class="issue-row">
    <span class="issue-desc">${esc(issue.description)}</span>
    ${priorityTag(issue.priority)}${planned}
    <span class="mono muted issue-meta">by ${esc(issue.raisedBy)}</span>
    ${action}
  </div>`;
}

// Any open issues already on this outlet, plus the trigger/inline form to
// report a new one. Shown on every stop card regardless of visit status —
// a technician might notice something on arrival, mid-job, or only think to
// mention it as they're leaving.
function issueBlock(s){
  const open = openIssuesFor(s.outlet);
  const list = open.length ? `<div class="issue-list">${open.map(issueSummaryRow).join("")}</div>` : "";
  const reporting = state.reportingIssue === s.outlet;
  const trigger = reporting ? `
    <div class="issue-form">
      <textarea id="issue-desc" rows="2" maxlength="500"
        placeholder="What's wrong, and what needs to happen? e.g. Instant heater not working — needs a replacement arranged"></textarea>
      <div class="row-2">
        <select id="issue-priority">
          <option value="low">Low — can wait</option>
          <option value="medium" selected>Medium</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="row-2">
        <button class="btn primary sm" data-submitissue="${s.outlet}" style="flex:1">Report to supervisor</button>
        <button class="btn sm" id="cancel-issue" style="flex:1">Cancel</button>
      </div>
    </div>`
    : `<button class="btn urgent sm issue-open" data-openissue="${s.outlet}" style="align-self:flex-start">⚠ Report an issue</button>`;
  return `${list}${trigger}`;
}

// The address+remark block shown on a custom (unplanned) stop's card in every
// state -- pending, on-site, or already left -- so a technician (or anyone
// looking back at this round later) can always see where it was and why.
function customStopNote(s){
  return `${s.customAddress ? `<p class="note" style="margin:0">${esc(s.customAddress)}</p>` : ""}
    ${s.customRemark ? `<p class="note" style="margin:4px 0 0"><em>${esc(s.customRemark)}</em></p>` : ""}
    ${s.geoFailed ? `<p class="note" style="margin:4px 0 0;color:var(--warn)">Couldn't place this on the map. <button class="link" data-retrygeo="${s.outlet}">Retry</button></p>` : ""}`;
}
function stopLabel(s){ return s.custom ? (s.customName || "Stop") : s.outlet; }

function stopCard(s, i, r, isHeading){
  const done = !!s.departAt, active = !!s.arriveAt && !done;
  const open = activeStop(r);
  const blocked = open && open.outlet !== s.outlet;
  const cls = done ? "is-done" : (active ? "is-active" : (isHeading ? "is-next" : ""));
  const label = stopLabel(s);
  let times = "";
  if(s.arriveAt) times += `<span class="mono">in ${clockOf(s.arriveAt)}</span>`;
  if(done) times += `<span class="mono">out ${clockOf(s.departAt)}</span><span class="mono" style="color:var(--accent)">${dur(mins(s.arriveAt,s.departAt))}</span>`;
  else if(active) times += `<span class="mono" style="color:var(--accent)">${liveDur(s.arriveAt)}</span>`;

  let body = "";
  if(s.custom){
    // A custom stop has no preset checklist -- nothing's pre-assigned to dose
    // or vacuum at a hardware shop -- but a technician can still log an ad-hoc
    // job they actually did there (e.g. "Collected filter cartridges"), the
    // same +Add-another-job flow a real branch offers. Reuses addTask/
    // taskListHtml/taskRow as-is -- they already key everything off s.outlet,
    // which works identically whether that's a real code or a synthetic
    // CUSTOM- id.
    if(done){
      const reopenConfirm = state.confirmReopen === s.outlet;
      const reopenBlock = reopenConfirm
        ? `<div class="row-2">
             <button class="btn warn sm" style="flex:1" data-reopen="${s.outlet}">Yes, reopen ${esc(label)}</button>
             <button class="btn sm" style="flex:1" data-cancelreopen="${s.outlet}">Cancel</button>
           </div>`
        : `<button class="link" data-askreopen="${s.outlet}" style="align-self:flex-start">Left by mistake? Reopen</button>`;
      body = `<div class="stop-body">${customStopNote(s)}${s.tasks.length ? `<div class="tasks">${taskListHtml(s)}</div>` : ""}${reopenBlock}</div>`;
    } else if(active){
      const adding = state.adding === s.outlet;
      body = `<div class="stop-body">
        ${customStopNote(s)}
        ${s.tasks.length ? `<div class="tasks">${taskListHtml(s)}</div>` : ""}
        ${adding ? `
        <div class="addbox">
          <input type="text" id="newtask" placeholder="What did you do here?" autocomplete="off">
          <div class="sugg">${SUGGESTIONS.map(x=>`<button data-sugg="${esc(x)}">${esc(x)}</button>`).join("")}</div>
          <div class="row-2">
            <button class="btn primary sm" data-addtask="${s.outlet}" style="flex:1">Add job</button>
            <button class="btn sm" id="cancel-add" style="flex:1">Cancel</button>
          </div>
        </div>`
        : `<button class="btn sm" data-openadd="${s.outlet}" style="align-self:flex-start">+ Add a job you did here</button>`}
        <button class="btn primary big" data-depart="${s.outlet}">Leave ${esc(label)}</button>
        <button class="link" data-unarrive="${s.outlet}" style="align-self:center">Wrong stop? Undo arrival</button>
      </div>`;
    } else {
      body = `<div class="stop-body">
        ${customStopNote(s)}
        ${blocked
          ? `<p class="note" style="margin:0;color:var(--warn)">Still checked in at ${esc(stopLabel(open))} — leave there first.</p>`
          : `<button class="btn big" data-arrive="${s.outlet}">Arrive</button>`}
        <button class="link" data-skip="${s.outlet}" style="align-self:center">Remove from round</button>
      </div>`;
    }
  } else if(done){
    // Same row-with-bar treatment the supervisor's "Time by job" uses, so a
    // finished stop reads the same way here as it does on the supervisor board.
    const doneTasks = s.tasks.filter(t=>t.doneAt);
    const maxM = doneTasks.length ? Math.max(1, ...doneTasks.map(t=>mins(t.startedAt,t.doneAt))) : 1;
    const rows = doneTasks.map(t => { const m = mins(t.startedAt,t.doneAt); return `<div class="brow">
      <span class="lbl">${esc(t.name)}</span>
      <span class="val">${dur(m)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(3,m/maxM*100)}%"></span></span>
    </div>`; }).join("");
    // A stop left by mistake — nothing claimed, or "Leave" tapped before a
    // must-do job was — can be reopened rather than being stuck as-is for the
    // rest of the day. A second tap confirms, since it changes the round's shape.
    const reopenConfirm = state.confirmReopen === s.outlet;
    const reopenBlock = reopenConfirm
      ? `<div class="row-2">
           <button class="btn warn sm" style="flex:1" data-reopen="${s.outlet}">Yes, reopen ${esc(s.outlet)}</button>
           <button class="btn sm" style="flex:1" data-cancelreopen="${s.outlet}">Cancel</button>
         </div>`
      : `<button class="link" data-askreopen="${s.outlet}" style="align-self:flex-start">Left by mistake? Reopen</button>`;
    body = `<div class="stop-body">${rows ? `<div class="bars">${rows}</div>` : ""}${reopenBlock}</div>`;
  } else if(active){
    const left = requiredLeft(s);
    const adding = state.adding === s.outlet;
    const departConfirm = state.confirmDepart === s.outlet;
    // Leaving with must-do jobs still open is allowed (sometimes a job genuinely
    // can't be done), but it's a one-tap, full-width button right below the
    // warning text — easy to hit by accident. A second confirming tap only kicks
    // in when something's actually still open; the common case (everything done)
    // stays a single tap.
    // Once every must-do job is done, this is exactly the moment a technician
    // is about to walk out -- a nudge right here, not buried in a menu, is the
    // best chance of getting Leave tapped when it actually happens instead of
    // later at the next outlet (which is what quietly turns real travel time
    // into a false "0 minutes" on the Routes tab).
    const leaveBlock = !left
      ? `<p class="note" style="margin:0">All must-do jobs done here. Tap <strong>Leave</strong> right when you actually head out — that's what starts the drive-time count to your next stop.</p>
         <button class="btn primary big" data-depart="${s.outlet}">Leave ${esc(s.outlet)}</button>`
      : !departConfirm
      ? `<p class="note" style="margin:0;color:var(--warn)">${left} must-do job${left>1?"s":""} still open.</p>
         <button class="btn big" data-askdepart="${s.outlet}">Leave ${esc(s.outlet)}</button>`
      : `<p class="note" style="margin:0;color:var(--warn)">${left} must-do job${left>1?"s":""} still open — leave anyway?</p>
         <div class="row-2">
           <button class="btn warn big" style="flex:1" data-depart="${s.outlet}">Yes, leave anyway</button>
           <button class="btn big" style="flex:1" data-canceldepart="${s.outlet}">Cancel</button>
         </div>`;
    body = `<div class="stop-body">
      <div class="tasks">${taskListHtml(s)}</div>
      ${adding ? `
      <div class="addbox">
        <input type="text" id="newtask" placeholder="What else did you do here?" autocomplete="off">
        <div class="sugg">${SUGGESTIONS.map(x=>`<button data-sugg="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        <div class="row-2">
          <button class="btn primary sm" data-addtask="${s.outlet}" style="flex:1">Add job</button>
          <button class="btn sm" id="cancel-add" style="flex:1">Cancel</button>
        </div>
      </div>`
      : `<button class="btn sm" data-openadd="${s.outlet}" style="align-self:flex-start">+ Add another job</button>`}
      ${leaveBlock}
      ${s.tasks.some(t=>t.startedAt) ? "" : `<button class="link" data-unarrive="${s.outlet}" style="align-self:center">Wrong outlet — undo arrival</button>`}
    </div>`;
  } else {
    const n = s.tasks.length;
    body = `<div class="stop-body">
      <p class="note" style="margin:0">${n} job${n===1?"":"s"} waiting${s.tasks.some(t=>t.kind==="optional")?" — includes jobs to do if time allows":""}</p>
      ${blocked
        ? `<p class="note" style="margin:0;color:var(--warn)">Still checked in at ${esc(stopLabel(open))} — leave there first.</p>`
        : `<button class="btn big" data-arrive="${s.outlet}">Arrive</button>`}
      <button class="link" data-skip="${s.outlet}" style="align-self:center">Remove from round</button>
    </div>`;
  }
  // A not-yet-visited stop only gets a real sequence number once it's actually
  // been reached (i is its position among visited stops, -1 otherwise); the
  // declared "heading to" stop shows an arrow instead of a number it hasn't
  // earned yet.
  const idxLabel = done ? "✓" : (i >= 0 ? i+1 : (isHeading ? "→" : ""));
  return `<div class="stop ${cls}">
    <div class="idx mono">${idxLabel}</div>
    <div class="stop-head">
      <span class="stop-name">${esc(label)}</span>
      ${s.custom?'<span class="tag add">Stop</span>':""}
      ${active?'<span class="chip onsite"><span class="dot"></span>On site</span>':""}
      ${isHeading?'<span class="chip travel"><span class="dot"></span>Next</span>':""}
      ${s.covering?'<span class="tag covering">Covering</span>':""}
      <span class="stop-times">${times}</span>
    </div>
    ${s.covering ? coveringNoteBlock(s) : ""}
    ${s.custom ? "" : issueBlock(s)}
    ${body}</div>`;
}

/* ---------- overview ----------
 * The supervisor's one-click "how's tonight going" screen: always today,
 * no date picker to fiddle with first. Four things a supervisor actually
 * checks in sequence -- are outlets getting done, who's where right now,
 * what got left behind, and what's waiting on a decision from them.
 */
// Always includes the date, even for today -- an issue/task's own reported-at
// stamp and a "resolved recently" history both want a fixed, unambiguous date
// rather than a relative "today" reading that quietly changes at midnight.
function fmtWhenFull(iso){
  const d = new Date(iso);
  return d.getDate()+" "+MONTH_ABBR[d.getMonth()]+", "+pad(d.getHours())+":"+pad(d.getMinutes());
}

function overviewStats(rounds){
  const outletCodes = new Set();
  rounds.forEach(r => r.stops.forEach(s => outletCodes.add(s.outlet)));
  let outletsDone = 0;
  outletCodes.forEach(code => {
    const stops = [];
    rounds.forEach(r => { const s = r.stops.find(x => x.outlet===code); if(s) stops.push(s); });
    const anyOnSite = stops.some(s => s.arriveAt && !s.departAt);
    const anyDeparted = stops.some(s => s.departAt);
    if(!anyOnSite && anyDeparted) outletsDone++;
  });
  const activeTechs = rounds.filter(r => ["onsite","travel"].includes(crewState(r).k)).length;
  const jobsDone = rounds.reduce((n,r) => n + totals(r).tasksDone, 0);
  return {outletsTotal: outletCodes.size, outletsDone, activeTechs, jobsDone};
}

// Every outlet, whether or not anyone's covering it tonight -- "not started"
// is as much a status a supervisor needs to see as "in progress" or "done".
// A stop's job list, rendered the same way the Routes tab's expanded X/Y
// breakdown does -- reused here so an outlet card on Overview and a stop on
// Routes read identically.
function stopJobList(s){
  return `<div class="job-list">${s.tasks.map(t => {
    // Done jobs carry when they actually happened (claim to finish) as a
    // clock range, AND how long that took -- Chun Kay asked first for the
    // clock range so a supervisor can see exactly when a job was done, then
    // asked for the duration back alongside it rather than in place of it.
    // Falls back to just the duration if a job's startedAt is somehow
    // missing (very old data from before per-task timing existed).
    const tStatus = t.doneAt ? `<span class="tag st-done">Done · ${t.startedAt ? clockOf(t.startedAt)+"–"+clockOf(t.doneAt)+" · "+dur(mins(t.startedAt,t.doneAt)) : dur(mins(t.startedAt,t.doneAt))}</span>`
                  : t.startedAt ? '<span class="tag st-prog">In Progress</span>'
                  : '<span class="tag st-open">Open</span>';
    const kindTag = t.kind==="required" ? '<span class="tag req">Must do</span>'
                  : t.kind==="optional" ? '<span class="tag opt">If time allows</span>'
                  : t.kind==="issue"    ? '<span class="tag urgent">Reported issue</span>'
                  : '<span class="tag add">Added</span>';
    // Who actually has (or finished) this job -- without it, two technicians
    // sharing an outlet just look like two separate "Done" rows with no way
    // to tell whether that's the same job correctly mirrored between them,
    // or genuinely two different people each doing their own copy of it.
    // Before anyone's claimed it, credit whoever typed it in instead (an
    // ad-hoc job, a Task Setting extra, or a converted issue all carry this)
    // -- so an unrecognized job on the list can actually be asked about,
    // rather than sitting there anonymous until someone claims it.
    const addedBy = addedByOf(t);
    const who = t.claimedBy ? `<span class="who">${esc(t.claimedBy)}</span>`
              : addedBy     ? `<span class="who">Added by ${esc(addedBy)}</span>`
              : "";
    // Name gets its own line, tags/status/claimer sit together below it --
    // keeps the job title readable instead of wrapping mid-word around tags.
    // A finished water test carries its reading and the dose it called for;
    // a still-open dosing job shows the dose the water test worked out.
    const detail = (t.doneAt && t.reading) ? `<div class="job-row-read">${readingSummary(t.reading)}</div>`
                 : (t.doneAt && t.dosed) ? `<div class="job-row-read">${dosedSummary(t.dosed)}</div>`
                 : (!t.doneAt && t.plannedDose && isDosingTask(t)) ? `<div class="job-row-read">${plannedDoseSummary(t.plannedDose)}</div>`
                 : "";
    return `<div class="job-row">
      <div class="job-row-name">${t.pool?`<span class="tag pool">${esc(t.pool)}</span> `:""}${esc(t.name)}</div>
      <div class="job-row-tags">${kindTag}${who}${tStatus}</div>${detail}
    </div>`;
  }).join("")}</div>`;
}

// When two technicians share an outlet tonight, each of their own round
// documents carries its own copy of the same must-do job list -- kept in
// sync as either one claims or finishes something (see syncTaskToOtherRounds
// / seedTasksFor). Listing each person's copy side by side would just show
// the same finished job twice, once under each name, which is exactly what
// Chun Kay flagged as confusing to read at WWW. This merges every stop at
// the outlet into one job, one line -- matched the same way the rest of the
// app already treats two copies as "the same job" (name + kind + pool) --
// crediting whoever actually has or finished it, so a job only ever shows
// once no matter how many technicians are covering that outlet.
function mergeStopTasks(stops){
  const rank = t => t.doneAt ? 2 : (t.startedAt ? 1 : 0);
  const merged = [];
  stops.forEach(s => {
    s.tasks.forEach(t => {
      const key = t.name+"|"+t.kind+"|"+(t.pool||"");
      const existing = merged.find(x => x.key === key);
      if(!existing) merged.push({key, task:t});
      else if(rank(t) > rank(existing.task)) existing.task = t;
    });
  });
  return merged.map(x => x.task);
}

// Each outlet card on Overview can be expanded in place -- Chun Kay wanted to
// click an outlet and see today's job list and its issues right there,
// without switching to Routes (for the jobs) and scrolling the Issues & tasks
// board (for the issues) and matching them up by outlet himself.
function outletStatusGrid(rounds){
  const cards = OUTLETS.map(o => {
    const stops = [];
    rounds.forEach(r => { const s = r.stops.find(x => x.outlet===o.code); if(s) stops.push({s, person:r.person}); });
    const issues = openIssuesFor(o.code);
    const issueN = issues.length;
    const issueTag = issueN ? `<span class="tag urgent">${issueN} issue${issueN>1?"s":""}</span>` : "";
    const expanded = !!state.expandedOutlets[o.code];
    const toggle = `<button type="button" class="link mono" data-toggleoutlet="${esc(o.code)}" aria-expanded="${expanded}">${expanded?"▲ hide details":"▼ show jobs & issues"}</button>`;
    const jobsPart = stops.length
      ? stopJobList({tasks: mergeStopTasks(stops.map(x => x.s))})
      : `<p class="note" style="margin:0">Not started yet tonight.</p>`;
    const issuesPart = issueN
      ? `<div class="issue-list">${issues.map(issueSummaryRow).join("")}</div>`
      : `<p class="note" style="margin:0">No open issues.</p>`;
    const details = expanded ? `<div class="stack" style="gap:10px;width:100%;margin-top:2px">
        <div class="stack" style="gap:6px"><div class="eyebrow">Jobs tonight</div>${jobsPart}</div>
        <div class="stack" style="gap:6px"><div class="eyebrow">Issues</div>${issuesPart}</div>
      </div>` : "";
    if(!stops.length){
      return `<div class="outlet-status${expanded?" is-expanded":""}">
        <span class="oc">${esc(o.code)}</span><span class="tag st-open">Not started</span>${issueTag}
        ${toggle}
        ${details}
      </div>`;
    }
    const onSite = stops.filter(x => x.s.arriveAt && !x.s.departAt);
    const departed = stops.filter(x => x.s.departAt);
    const names = [...new Set(stops.map(x => x.person))];
    const tag = onSite.length ? '<span class="tag st-prog">In progress</span>'
              : departed.length ? '<span class="tag st-done">Done</span>'
              : '<span class="tag st-open">Not started</span>';
    return `<div class="outlet-status${expanded?" is-expanded":""}">
      <span class="oc">${esc(o.code)}</span>
      ${tag}${issueTag}
      <span class="mono muted">${esc(names.join(", "))}</span>
      ${toggle}
      ${details}
    </div>`;
  }).join("");
  return `<div class="outlet-status-grid">${cards}</div>`;
}

// A must-do job still open at a stop the technician has already LEFT -- as
// opposed to one that's simply still in progress -- is the one kind of
// "unfinished" that genuinely needs a supervisor's attention: nobody's
// coming back to it tonight on their own. Deduped the same way the Supervisor
// board dedupes shared-outlet jobs, so two technicians' mirrored copies of
// the same job don't show up twice.
// Any job still undone at a stop the technician has already LEFT -- must-do
// jobs first (those are the ones that should never really be skipped), but
// also optional "if time allows" and ad-hoc jobs, since a skipped optional
// job (like the CC water feature that only got 4 of 5 jobs before Sharul
// moved on) is exactly the kind of thing a supervisor wants to be able to
// spot too, even though it never blocked leaving. Deduped the same way the
// Supervisor board dedupes shared-outlet jobs, so two technicians' mirrored
// copies of the same job don't show up twice.
function unfinishedJobs(rounds){
  const seen = new Set(), out = [];
  rounds.forEach(r => r.stops.forEach(s => {
    if(!s.departAt) return;
    // A custom stop's outlet field is a synthetic CUSTOM- id, never something
    // to show a supervisor -- stopLabel(s) is the friendly name for it (see
    // the custom-stop feature).
    const label = stopLabel(s);
    s.tasks.filter(t => !t.doneAt).forEach(t => {
      const k = s.outlet+"|"+t.kind+"|"+t.name+"|"+(t.pool||"");
      if(seen.has(k)) return; seen.add(k);
      out.push({outlet:s.outlet, label, pool:t.pool||null, name:t.name, kind:t.kind, person:r.person, departAt:s.departAt});
    });
  }));
  // Must-do first (the ones that matter most), then optional, then ad-hoc;
  // within each, in outlet order, so the list reads the same way the
  // checklist itself does.
  const kindOrder = {required:0, issue:1, optional:2, adhoc:3};
  const outletOrder = new Map(OUTLETS.map((o,i)=>[o.code,i]));
  out.sort((a,b) => {
    const k = (kindOrder[a.kind] ?? 3) - (kindOrder[b.kind] ?? 3);
    return k || ((outletOrder.get(a.outlet) ?? 999) - (outletOrder.get(b.outlet) ?? 999));
  });
  return out;
}
function unfinishedJobsBlock(rounds){
  const list = unfinishedJobs(rounds);
  if(!list.length) return `<p class="note" style="margin:0">Nothing left open — every job at every stop left tonight is done.</p>`;
  const tagOf = k => k==="required" ? '<span class="tag req">Must do</span>'
              : k==="optional" ? '<span class="tag opt">If time allows</span>'
              : k==="issue"    ? '<span class="tag urgent">Reported issue</span>'
              : '<span class="tag add">Added</span>';
  const rows = list.map(x => `<div class="issue-row">
    <span class="issue-desc"><strong>${esc(x.label)}</strong>${x.pool?` <span class="tag pool">${esc(x.pool)}</span>`:""} — ${esc(x.name)} ${tagOf(x.kind)}</span>
    <span class="mono muted issue-meta">left by ${esc(x.person)} · ${clockOf(x.departAt)}</span>
  </div>`).join("");
  return `<div class="issue-list">${rows}</div>`;
}

const PRIORITY_ORDER = {urgent:0, medium:1, low:2};
// Most urgent first; within the same priority, whoever's been waiting
// longest surfaces first, so an old Medium doesn't get buried forever
// under a stream of newer ones.
function issueSortCompare(a,b){
  const p = (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1);
  return p || (a.raisedAt < b.raisedAt ? -1 : 1);
}

// The supervisor-facing issue card: read-only summary, or the plan/edit form
// when this is the one card currently open for editing.
function issueCard(issue){
  const editing = state.planningIssue === issue.id;
  const rosterOpts = state.roster.map(n => `<option value="${esc(n)}" ${issue.assignee===n?"selected":""}>${esc(n)}</option>`).join("");
  const meta = `<span class="mono muted">reported by ${esc(issue.raisedBy)} · ${fmtWhenFull(issue.raisedAt)}</span>`;
  let body;
  if(editing){
    body = `<div class="issue-form">
      <div class="row-2">
        <select id="plan-priority-${issue.id}">
          <option value="low" ${issue.priority==="low"?"selected":""}>Low</option>
          <option value="medium" ${(!issue.priority||issue.priority==="medium")?"selected":""}>Medium</option>
          <option value="urgent" ${issue.priority==="urgent"?"selected":""}>Urgent</option>
        </select>
        <input type="date" id="plan-date-${issue.id}" value="${issue.targetDate||""}" aria-label="Target fix date">
      </div>
      <select id="plan-assignee-${issue.id}" aria-label="Assigned to">
        <option value="">Unassigned</option>
        <option value="Contractor" ${issue.assignee==="Contractor"?"selected":""}>Contractor</option>
        ${rosterOpts}
      </select>
      <textarea id="plan-notes-${issue.id}" rows="2" maxlength="500"
        placeholder="Plan notes — e.g. contractor booked for Friday, parts on order">${esc(issue.notes||"")}</textarea>
      <div class="row-2">
        <button class="btn primary sm" data-saveplan="${issue.id}" style="flex:1">Save plan</button>
        <button class="btn sm" data-cancelplan="${issue.id}" style="flex:1">Cancel</button>
      </div>
    </div>`;
  } else {
    const planRow = (issue.status==="planned" || issue.assignee) ? `<div class="issue-meta-row">
      ${issue.status==="planned" ? `<span class="tag st-prog">${issue.targetDate?"Target "+esc(issue.targetDate):"Planned"}</span>` : ""}
      ${issue.assignee ? `<span class="tag pool">${esc(issue.assignee)}</span>` : ""}
    </div>` : "";
    const taskLine = issue.convertedToTask
      ? `<p class="note" style="margin:0">✓ Added as a job — whoever's covering ${esc(issue.outlet)} can claim and complete it; it'll resolve here automatically once they do.</p>`
      : (issue.status!=="resolved" ? `<button class="btn sm" data-converttask="${issue.id}" style="width:100%">Turn into a job a technician can claim</button>` : "");
    body = `${planRow}
    ${issue.notes ? `<p class="note" style="margin:0">${esc(issue.notes)}</p>` : ""}
    ${taskLine}
    <div class="row-2">
      ${issue.status!=="resolved" ? `<button class="btn sm" data-planissue="${issue.id}" style="flex:1">${issue.status==="planned"?"Edit plan":"Plan this"}</button>` : ""}
      ${issue.status!=="resolved"
        ? `<button class="btn sm" data-resolveissue="${issue.id}" style="flex:1">Mark resolved</button>`
        : `<button class="btn sm" data-reopenissue="${issue.id}" style="flex:1">Reopen</button>`}
    </div>`;
  }
  return `<div class="card issue-card">
    <div class="issue-card-head">
      <span class="tag pool">${esc(issue.outlet)}</span>${priorityTag(issue.priority)}
      ${issue.status==="resolved" ? `<span class="tag st-done">Resolved${issue.resolvedBy?" by "+esc(issue.resolvedBy):""} · ${fmtWhenFull(issue.resolvedAt)}</span>` : ""}
    </div>
    <p class="issue-card-desc">${esc(issue.description)}</p>
    ${meta}
    ${body}
  </div>`;
}

// Lets a supervisor get ahead of a problem instead of only reacting to one a
// technician reports -- "replace that worn ladder pad at JEIP2 sometime this
// week" doesn't need to wait for anyone to notice it's broken first. Lands
// in the exact same board as a technician-raised issue (just a different
// raisedBy), so it shows up the same way on that outlet's stop card too.
function addIssueBlock(){
  if(!state.addingIssue){
    return `<button class="btn sm" id="open-addissue" style="align-self:flex-start">+ Add a task for an outlet</button>`;
  }
  const opts = OUTLETS.map(o => `<option value="${esc(o.code)}">${esc(o.code)}</option>`).join("");
  return `<div class="issue-form">
    <div class="row-2">
      <select id="addissue-outlet" aria-label="Outlet">${opts}</select>
      <select id="addissue-priority" aria-label="Priority">
        <option value="low" selected>Low — can wait</option>
        <option value="medium">Medium</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>
    <textarea id="addissue-desc" rows="2" maxlength="500"
      placeholder="What needs to be done? e.g. Replace worn ladder pad at JEIP2"></textarea>
    <div class="row-2">
      <button class="btn primary sm" id="submit-addissue" style="flex:1">Add task</button>
      <button class="btn sm" id="cancel-addissue" style="flex:1">Cancel</button>
    </div>
  </div>`;
}

function issueBoard(){
  const all = Object.values(state.issues);
  const open = all.filter(i => i.status==="open").sort(issueSortCompare);
  const planned = all.filter(i => i.status==="planned").sort(issueSortCompare);
  const resolved = all.filter(i => i.status==="resolved").sort((a,b) => a.resolvedAt < b.resolvedAt ? 1 : -1).slice(0,30);
  const section = (title, list, emptyMsg) => `<div class="stack" style="gap:8px">
    <div class="eyebrow">${title}${list.length?" ("+list.length+")":""}</div>
    ${list.length ? list.map(issueCard).join("") : `<p class="note" style="margin:0">${emptyMsg}</p>`}
  </div>`;
  const resolvedBlock = resolved.length ? `<details class="panel"><summary>Resolved recently (${resolved.length})</summary>
    <div class="panel-body">${resolved.map(issueCard).join("")}</div></details>` : "";
  return `${section("Needs planning", open, "Nothing waiting on a plan.")}
    ${section("Planned", planned, "Nothing scheduled right now.")}
    ${resolvedBlock}`;
}
